// serialized state so it never leaks into the generated mobileconfig.
let ui = { openStep: null, draftStep: null, stepTab: "info", settingsOpen: false, settingsTab: "identity", welcomeOpen: false, pendingStep: null, expandedOptional: new Set(), expandedBranches: new Set(), selectedPlaybook: 0, sidebarCollapsed: false };

// The popped-out help window, when there is one. Declared up here rather than
// beside the help code at the bottom because applyTheme() and
// applyDisplaySettings() both push changes into it, and both run during boot —
// a `let` further down would still be in its temporal dead zone by then.
let helpWindow = null;
let helpWindowApi = null;

// ============================================================================
// Display scaling
//
// The whole stylesheet is hard-coded px, which reads fine on a 1440-wide
// laptop and microscopic on a 5K display. Rather than rewrite ~1300 lines into
// rem, one `zoom` on <body> scales everything uniformly (--ui-scale), and
// --content-max independently widens the step column so a big screen gains
// real estate instead of just bigger pixels.
//
// Everything that measures the DOM must go through localRect()/localViewport()
// — see the long note at the top of the stylesheet for why.
// ============================================================================

const SCALE_STEPS = [0.9, 1, 1.1, 1.25, 1.5, 1.75];
const CONTENT_WIDTHS = {
    comfortable: { label: "Comfortable", value: "640px" },
    wide:        { label: "Wide",        value: "900px" },
    full:        { label: "Full width",  value: "none"  }
};
const DISPLAY_PREFS_KEY = "enrollinator-display";
const THEMES = { system: "System", light: "Light", dark: "Dark" };

const display = {
    scale: "auto",              // "auto" or one of SCALE_STEPS
    contentWidth: "comfortable",
    theme: "system",            // "system" | "light" | "dark"
    previewResized: false       // true once the user drags the preview divider
};

/** Write the concrete theme the stylesheet reads onto <html>.
 *  "system" is resolved here rather than left to a prefers-color-scheme block
 *  so the dark palette exists in exactly one place — see the note at the top
 *  of the stylesheet. Mirrors the boot-time snippet in <head>, which does the
 *  same thing before first paint so dark users never see a light flash. */
function applyTheme() {
    const dark = display.theme === "dark" ||
        (display.theme === "system" &&
         window.matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.dataset.theme = dark ? "dark" : "light";
    syncHelpWindow();
}

function setTheme(theme) {
    display.theme = theme;
    saveDisplayPrefs();
    applyTheme();
    refreshViewMenu();
}

/** Scale picked by "auto", from the raw (unzoomed) viewport width. */
function autoScaleFor(width) {
    if (width >= 3000) return 1.5;
    if (width >= 2400) return 1.25;
    if (width >= 1900) return 1.1;
    return 1;
}

/** The scale actually in effect right now — never the string "auto". */
function effectiveScale() {
    return display.scale === "auto" ? autoScaleFor(window.innerWidth) : display.scale;
}

/** getBoundingClientRect() converted into the body-local px that style.left,
 *  style.top and offsetWidth all speak. Use this for any overlay placement. */
function localRect(el) {
    const r = el.getBoundingClientRect();
    const z = effectiveScale();
    return {
        left: r.left / z, top: r.top / z, right: r.right / z, bottom: r.bottom / z,
        width: r.width / z, height: r.height / z
    };
}

/** Viewport size in body-local px. */
function localViewport() {
    const z = effectiveScale();
    return { width: window.innerWidth / z, height: window.innerHeight / z };
}

function applyDisplaySettings() {
    const scale = effectiveScale();
    const root  = document.documentElement.style;
    const local = { width: window.innerWidth / scale, height: window.innerHeight / scale };

    root.setProperty("--ui-scale", String(scale));
    root.setProperty("--app-vh", local.height + "px");
    root.setProperty("--content-max",
        (CONTENT_WIDTHS[display.contentWidth] || CONTENT_WIDTHS.comfortable).value);

    // Default preview width tracks the window so a wide display gets a wide
    // XML pane — but never once the user has dragged the divider themselves.
    if (!display.previewResized) {
        root.setProperty("--preview-w",
            Math.round(Math.max(320, Math.min(local.width * 0.26, 560))) + "px");
    }

    document.body.classList.toggle("narrow-layout", local.width < 1000);
    refreshViewMenu();
    syncHelpWindow();
}

function setScale(scale) {
    display.scale = scale;
    saveDisplayPrefs();
    applyDisplaySettings();
}

function setContentWidth(key) {
    display.contentWidth = key;
    saveDisplayPrefs();
    applyDisplaySettings();
}

/** Step the scale one notch up (+1) or down (-1) through SCALE_STEPS. */
function nudgeScale(direction) {
    const current = effectiveScale();
    // Nearest step to where we are now, so "auto" nudges from its resolved value.
    let idx = 0;
    for (let i = 1; i < SCALE_STEPS.length; i++) {
        if (Math.abs(SCALE_STEPS[i] - current) < Math.abs(SCALE_STEPS[idx] - current)) idx = i;
    }
    const next = Math.max(0, Math.min(SCALE_STEPS.length - 1, idx + direction));
    setScale(SCALE_STEPS[next]);
}

// localStorage throws outright — not just returns null — when storage is
// disabled (Safari private browsing, sandboxed/data: contexts, some MDM
// policies). An unguarded read here would abort the rest of the boot script,
// leaving a blank canvas, so every access goes through these two.
function prefGet(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
}
function prefSet(key, value) {
    try { localStorage.setItem(key, value); } catch (e) { /* session-only */ }
}

function loadDisplayPrefs() {
    try {
        const raw = prefGet(DISPLAY_PREFS_KEY);
        if (!raw) return;
        const saved = JSON.parse(raw);
        if (saved.scale === "auto" || SCALE_STEPS.includes(saved.scale)) display.scale = saved.scale;
        if (CONTENT_WIDTHS[saved.contentWidth]) display.contentWidth = saved.contentWidth;
        if (THEMES[saved.theme]) display.theme = saved.theme;
    } catch (e) { /* corrupt or unavailable storage — fall back to defaults */ }
}

function saveDisplayPrefs() {
    prefSet(DISPLAY_PREFS_KEY, JSON.stringify({
        scale: display.scale, contentWidth: display.contentWidth, theme: display.theme
    }));
}

function scaleLabel(scale) {
    return scale === "auto" ? "Auto" : Math.round(scale * 100) + "%";
}

/** Repaint the Display menu's active pills if it happens to be open. */
function refreshViewMenu() {
    const menu = document.getElementById("view-menu");
    if (!menu) return;
    menu.querySelectorAll("[data-scale]").forEach(b => {
        const val = b.dataset.scale === "auto" ? "auto" : parseFloat(b.dataset.scale);
        b.classList.toggle("active", display.scale === val);
    });
    menu.querySelectorAll("[data-cwidth]").forEach(b => {
        b.classList.toggle("active", display.contentWidth === b.dataset.cwidth);
    });
    menu.querySelectorAll("[data-theme-choice]").forEach(b => {
        b.classList.toggle("active", display.theme === b.dataset.themeChoice);
    });
    const auto = menu.querySelector('[data-scale="auto"]');
    if (auto) auto.textContent = "Auto (" + scaleLabel(autoScaleFor(window.innerWidth)) + ")";
    const sys = menu.querySelector('[data-theme-choice="system"]');
    if (sys) sys.textContent = "System (" +
        (window.matchMedia("(prefers-color-scheme: dark)").matches ? "Dark" : "Light") + ")";
}

function toggleViewMenu(btn) {
    const existing = document.getElementById("view-menu");
    if (existing) { existing.remove(); return; }

    const rect = localRect(btn);
    const menu = document.createElement("div");
    menu.id = "view-menu";
    menu.className = "header-dropdown-menu";
    menu.style.cssText =
        `top:${rect.bottom + 4}px;left:${rect.left}px;min-width:260px`;

    const scaleBtns = ["auto", ...SCALE_STEPS].map(s =>
        `<button data-scale="${s}">${s === "auto" ? "Auto" : scaleLabel(s)}</button>`
    ).join("");
    const widthBtns = Object.keys(CONTENT_WIDTHS).map(k =>
        `<button data-cwidth="${k}">${CONTENT_WIDTHS[k].label}</button>`
    ).join("");
    const themeBtns = Object.keys(THEMES).map(k =>
        `<button data-theme-choice="${k}">${THEMES[k]}</button>`
    ).join("");

    menu.innerHTML = `
        <div class="view-menu-group">
            <div class="view-menu-label">Appearance</div>
            <div class="view-seg">${themeBtns}</div>
        </div>
        <div class="view-menu-group">
            <div class="view-menu-label">Interface scale</div>
            <div class="view-seg">${scaleBtns}</div>
        </div>
        <div class="view-menu-group">
            <div class="view-menu-label">Content width</div>
            <div class="view-seg">${widthBtns}</div>
        </div>
        <div class="view-menu-foot">
            <kbd>⌥ +</kbd> / <kbd>⌥ −</kbd> scale · <kbd>⌥ 0</kbd> reset<br>
            Drag the divider to resize the preview pane.
        </div>`;

    menu.addEventListener("click", e => {
        const b = e.target.closest("button");
        if (!b) return;
        if (b.dataset.scale != null) {
            setScale(b.dataset.scale === "auto" ? "auto" : parseFloat(b.dataset.scale));
        } else if (b.dataset.cwidth != null) {
            setContentWidth(b.dataset.cwidth);
        } else if (b.dataset.themeChoice != null) {
            setTheme(b.dataset.themeChoice);
        }
    });

    document.body.appendChild(menu);
    refreshViewMenu();
    setTimeout(() => document.addEventListener("click", function close(e) {
        if (menu.contains(e.target) || e.target === btn) return;
        menu.remove();
        document.removeEventListener("click", close);
    }), 0);
}

function initDisplay() {
    loadDisplayPrefs();
    applyTheme();
    applyDisplaySettings();

    // Follow the OS while the setting is "System" — macOS flips this on its
    // own at sunset if the user has auto appearance on.
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
        if (display.theme === "system") applyTheme();
        refreshViewMenu();
    });

    let pending = false;
    window.addEventListener("resize", () => {
        if (pending) return;
        pending = true;
        requestAnimationFrame(() => { pending = false; applyDisplaySettings(); });
    });

    // Option-based so we don't fight the browser's own ⌘+/⌘− page zoom, which
    // Chrome and Safari swallow before the page ever sees the keydown.
    window.addEventListener("keydown", e => {
        if (!e.altKey || e.metaKey || e.ctrlKey) return;
        if (e.code === "Equal" || e.code === "NumpadAdd") { e.preventDefault(); nudgeScale(1); }
        else if (e.code === "Minus" || e.code === "NumpadSubtract") { e.preventDefault(); nudgeScale(-1); }
        else if (e.code === "Digit0" || e.code === "Numpad0") { e.preventDefault(); setScale(1); }
    });

    document.getElementById("view-btn").addEventListener("click", function () {
        toggleViewMenu(this);
    });
}

// ============================================================================
// Utilities
// ============================================================================

function uuid() {
    if (crypto.randomUUID) return crypto.randomUUID().toUpperCase();
    return "XXXXXXXX-XXXX-4XXX-YXXX-XXXXXXXXXXXX".replace(/[XY]/g, c => {
        const r = Math.random() * 16 | 0;
        const v = c === "X" ? r : (r & 0x3 | 0x8);
        return v.toString(16).toUpperCase();
    });
}

function xmlEscape(s) {
    return String(s).replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&apos;"
    })[c]);
}

// ============================================================================
// Serialization — state → plist XML
// ============================================================================

function plistValue(v, indent) {
    const pad = "    ".repeat(indent);
    if (v === true)  return `${pad}<true/>`;
    if (v === false) return `${pad}<false/>`;
    if (typeof v === "number" && Number.isInteger(v))
        return `${pad}<integer>${v}</integer>`;
    if (typeof v === "string")
        return `${pad}<string>${xmlEscape(v)}</string>`;
    if (Array.isArray(v)) {
        if (v.length === 0) return `${pad}<array/>`;
        return `${pad}<array>\n${v.map(x => plistValue(x, indent + 1)).join("\n")}\n${pad}</array>`;
    }
    if (typeof v === "object" && v !== null) {
        const entries = Object.entries(v);
        if (entries.length === 0) return `${pad}<dict/>`;
        const inner = entries.map(([k, val]) =>
            `${pad}    <key>${xmlEscape(k)}</key>\n${plistValue(val, indent + 1)}`
        ).join("\n");
        return `${pad}<dict>\n${inner}\n${pad}</dict>`;
    }
    return `${pad}<string></string>`;
}

// Strip empty strings / null / empty arrays+dicts so we don't emit noisy keys.
function clean(v) {
    if (v === null || v === undefined) return undefined;
    if (typeof v === "string") return v === "" ? undefined : v;
    if (Array.isArray(v)) {
        const out = v.map(clean).filter(x => x !== undefined);
        return out.length === 0 ? undefined : out;
    }
    if (typeof v === "object") {
        const out = {};
        for (const [k, val] of Object.entries(v)) {
            const c = clean(val);
            if (c !== undefined) out[k] = c;
        }
        return Object.keys(out).length === 0 ? undefined : out;
    }
    return v;
}

function buildInnerPayload(s) {
    const payload = {

        PayloadIdentifier: s.outer.PayloadIdentifier + ".config",

        Branding: clean(s.Branding) || undefined,
        DefaultPlaybook: s.DefaultPlaybook || undefined,
        AllowClose: s.AllowClose === true ? true : undefined,
        TestMode: s.TestMode === true ? true : undefined,
        InstallSwiftDialog: s.InstallSwiftDialog === true ? true : undefined,
        // Only meaningful alongside InstallSwiftDialog, and only when the admin
        // overrides the built-in default, so don't emit it otherwise.
        SwiftDialogTeamID: (s.InstallSwiftDialog === true && s.SwiftDialogTeamID)
                               ? s.SwiftDialogTeamID : undefined,

function parsePlistText(xml) {

    let src = xml.replace(/^\uFEFF/, "");

    // Comments carry no data we need, so remove them unconditionally.
    src = src.replace(/<!--[\s\S]*?-->/g, "");
    // Strip the Apple plist DOCTYPE declaration — browsers reject the external
    // DTD URL in strict XML parsing modes.
    src = src.replace(/<!DOCTYPE\s+plist[^>]*>/i, "");
    // Try strict XML first; fall back to "text/xml" which is more lenient.
    let doc = new DOMParser().parseFromString(src, "application/xml");
    if (doc.querySelector("parsererror")) {
        doc = new DOMParser().parseFromString(src, "text/xml");
    }
    if (doc.querySelector("parsererror")) {
        const msg = doc.querySelector("parsererror")?.textContent?.split("\n")[0] || "unknown parse error";
        throw new Error("Not valid XML: " + msg);

function parseNode(node) {

    if (tag === "true")    return true;
    if (tag === "false")   return false;
    if (tag === "string")  return node.textContent;
    if (tag === "integer") return parseInt(node.textContent, 10);
    if (tag === "real")    return parseFloat(node.textContent);
    if (tag === "data")    return node.textContent.trim();
    if (tag === "date")    return node.textContent;
    if (tag === "array")   return Array.from(node.children).map(parseNode);
    if (tag === "dict") {
        const out = {};
        const kids = Array.from(node.children);
        for (let i = 0; i < kids.length; i += 2) {
            if (kids[i].tagName !== "key") continue;
            out[kids[i].textContent] = parseNode(kids[i + 1]);

        return out;
    }
    return null;

    const out = blankStep();
    for (const k of Object.keys(out)) if (s[k] !== undefined) out[k] = s[k];
    out.Action     = importAction(s.Action || null);
    out.Conditions = (s.Conditions || []).map(importCondition);
    if (s.WaitWindow) {
        out.WaitWindow = {
            Title:           s.WaitWindow.Title   || "",
            Message:         s.WaitWindow.Message || "",
            TitleFontSize:   Number.isFinite(s.WaitWindow.TitleFontSize)   ? s.WaitWindow.TitleFontSize   : null,
            MessageFontSize: Number.isFinite(s.WaitWindow.MessageFontSize) ? s.WaitWindow.MessageFontSize : null,
            Slideshow: Array.isArray(s.WaitWindow.Slideshow)
                ? s.WaitWindow.Slideshow.map(normalizeSlide)
                : [],
            Video:         s.WaitWindow.Video || "",
            VideoAutoplay: typeof s.WaitWindow.VideoAutoplay === "boolean" ? s.WaitWindow.VideoAutoplay : null,
            Width:         Number.isFinite(s.WaitWindow.Width)  ? s.WaitWindow.Width  : null,
            Height:        Number.isFinite(s.WaitWindow.Height) ? s.WaitWindow.Height : null,
            Blur:          typeof s.WaitWindow.Blur        === "boolean" ? s.WaitWindow.Blur        : null,
            AlwaysOnTop:   typeof s.WaitWindow.AlwaysOnTop === "boolean" ? s.WaitWindow.AlwaysOnTop : null
        };
    }
    return out;
}

// Small DOM helper (no framework, just enough to build nodes from code).
// ============================================================================

function h(tag, attrs, ...children) {
    const n = document.createElement(tag);
    if (attrs) {
        for (const [k, v] of Object.entries(attrs)) {
            if (v == null || v === false) continue;
            if (k === "class")            n.className = v;
            else if (k === "html")        n.innerHTML = v;
            else if (k.startsWith("on"))  n.addEventListener(k.slice(2), v);
            else if (k === "checked")     n.checked = !!v;
            else if (k === "value")       n.value = v == null ? "" : v;
            else                          n.setAttribute(k, v);
        }
    }
    for (const c of children.flat()) {
        if (c == null || c === false) continue;
        if (typeof c === "string") n.appendChild(document.createTextNode(c));
        else n.appendChild(c);
    }
    return n;
}
function row(label, ...fields) {
    return h("div", { class: "row" },
        h("label", null, label),
        h("div", { class: "field" }, ...fields)
    );
}
function textInput(value, onInput, placeholder, onBlur) {
    const n = h("input", { type: "text", value: value || "",
        placeholder: placeholder || "",
        oninput: e => { onInput(e.target.value); updatePreview(); } });
    if (onBlur) n.addEventListener("blur", onBlur);
    return n;
}

// Variables available for substitution in title/subtitle fields.
const TITLE_VARS = [
    { token: "{full_name}",     label: "User's full display name" },
    { token: "{console_user}",  label: "Login username" },
    { token: "{computer_name}", label: "Computer name" },
    { token: "{hostname}",      label: "Local hostname" },
    { token: "{serial_number}", label: "Hardware serial" },
    { token: "{model}",         label: "Model identifier" },
    { token: "{os_version}",    label: "macOS version" },
    { token: "{ip_address}",    label: "Primary IP address" },
];

// Insert text at the cursor position of an <input> and fire its oninput.
function insertAtCursor(input, text) {
    const s = input.selectionStart, e = input.selectionEnd;
    input.value = input.value.slice(0, s) + text + input.value.slice(e);
    input.selectionStart = input.selectionEnd = s + text.length;
    input.dispatchEvent(new Event("input"));
    input.focus();
}

// Wrap a textInput with a {…} button that lets the user pick a variable token.
function textInputWithVars(value, onInput, placeholder, onBlur) {
    const input = textInput(value, onInput, placeholder, onBlur);

    const dropdown = h("div", { class: "var-picker-dropdown hidden" });
    TITLE_VARS.forEach(({ token, label }) => {
        dropdown.appendChild(h("div", { class: "var-picker-item",
            onmousedown: e => {
                e.preventDefault(); // keep focus on input
                insertAtCursor(input, token);
                dropdown.classList.add("hidden");
            }
        },
            h("span", { class: "var-token" }, token),
            h("span", { class: "var-label" }, label)
        ));
    });

    const btn = h("button", { class: "var-picker-btn", title: "Insert variable",
        type: "button",
        onclick: e => { e.stopPropagation(); dropdown.classList.toggle("hidden"); }
    }, "{…}");

    // Close on any outside click.
    document.addEventListener("click", () => dropdown.classList.add("hidden"), true);

    return h("div", { class: "var-input-wrap" },
        input,
        h("div", { class: "var-picker-wrap" }, btn, dropdown)
    );
}

function intInput(value, onInput, placeholder) {
    return h("input", { type: "number", min: "0",
        value: value == null ? "" : String(value),
        placeholder: placeholder || "",
        oninput: e => {
            const v = e.target.value === "" ? null : parseInt(e.target.value, 10);
            onInput(Number.isFinite(v) ? v : null); updatePreview();
        } });
}
function checkbox(checked, onChange, label) {
    return h("div", { class: "check-row" },
        h("input", { type: "checkbox", checked: !!checked,
            onchange: e => { onChange(e.target.checked); updatePreview(); } }),
        label ? h("span", null, label) : null
    );
}
function selectInput(value, options, onChange) {
    const opts = options.map(o => {
        const [val, text] = Array.isArray(o) ? o : [o, o];
        const opt = h("option", { value: val }, text);
        if (val === value) opt.selected = true;
        return opt;
    });
    return h("select", { onchange: e => { onChange(e.target.value); updatePreview(); } }, ...opts);
}
// Three-state select for per-window blur/ontop overrides.
// value: null = inherit from global, true = on, false = off
function triStateSelect(value, onChange) {
    return selectInput(
        value === true ? "true" : value === false ? "false" : "",
        [["", "Inherit from global"], ["true", "On"], ["false", "Off"]],
        v => onChange(v === "" ? null : v === "true")
    );
}
function hint(text) { return h("div", { class: "hint" }, text); }
function btn(label, onClick, cls) {
    return h("button", { class: "btn" + (cls ? " " + cls : ""), onclick: onClick }, label);
}

/**
 * Icon input: plain text field for paths/URLs + an animation picker that
 * appears when the value starts with "SF=". Calls onChange(newValue) on
 * every change; calls updateFn() (e.g. updatePreview or reopenStep) after.
 *
 * Returns a fragment — use spread (...renderIconInput(...)) inside row().
 */
function renderIconInput(value, onChange, updateFn) {
    const sf = parseSFValue(value);
    const inputEl = textInput(value, v => {
        onChange(v);
        if (updateFn) updateFn();
    }, sf ? "SF=symbol.name" : "/path/img.png, https://…, or SF=symbol.name");

    const nodes = [inputEl];

    if (sf) {
        const animSel = h("div", { class: "sf-anim-row" },
            h("span", { class: "sf-anim-label" }, "Animation"),
            h("select", { class: "sf-anim-select",
                onchange: e => {
                    onChange(buildSFValue(sf.name, e.target.value));
                    if (updateFn) updateFn();
                }
            },
                ...SF_ANIMATIONS.map(([val, label]) =>
                    h("option", { value: val, selected: val === sf.animation }, label)
                )
            )
        );
        nodes.push(animSel);
    }

    nodes.push(h("div", { class: "hint" },
        "Local path, https:// URL, or ",
        h("code", null, "SF=symbol.name"),
        " — ", sfLink()
    ));

    return nodes;
}

let _issues = [];

function validateState() {
    const issues = [];
    const nonAddon = state.Playbooks.filter(p => !p.Addon);

    if (state.Playbooks.length === 0) {
        issues.push({ scope: "global", message: "No playbooks defined." });
    }
    if (nonAddon.length > 0 && !state.DefaultPlaybook) {
        issues.push({ scope: "global", message: "No default playbook set (Runtime tab)." });
    }
    if (state.DefaultPlaybook && !nonAddon.find(p => p.Name === state.DefaultPlaybook)) {
        issues.push({ scope: "global", message: `Default playbook "${state.DefaultPlaybook}" not found.` });
    }

    const seenNames = new Set();
    state.Playbooks.forEach((p, pIdx) => {
        if (!p.Name) {
            issues.push({ scope: "playbook", pIdx, message: "Playbook has no name." });
        } else if (seenNames.has(p.Name)) {
            issues.push({ scope: "playbook", pIdx, message: `Duplicate playbook name: "${p.Name}".` });
        } else {
            seenNames.add(p.Name);
        }
        if (p.Steps.length === 0) {
            issues.push({ scope: "playbook", pIdx, message: "Playbook has no steps." });
        }

        const seenIds = new Set();
        p.Steps.forEach((st, sIdx) => {
            const stepIssues = [];
            if (!st.Name) stepIssues.push("No name.");
            if (!st.Id) {
                stepIssues.push("No ID.");
            } else if (seenIds.has(st.Id)) {
                stepIssues.push(`Duplicate step ID "${st.Id}".`);
            } else {
                seenIds.add(st.Id);
            }
            if (st.Action) {
                const a = st.Action;
                if (a.Type === "shell"   && !a.Command) stepIssues.push("Shell action has no command.");
                if (a.Type === "package" && !a.Path)    stepIssues.push("Package action has no path.");
                if (a.Type === "dialog"  && !a.Title)   stepIssues.push("Dialog action has no title.");
                if (a.Type === "dialog"  && !a.Message) stepIssues.push("Dialog action has no message.");
                if (a.Type === "dialog" && a.ExpectedButton
                    && Array.isArray(a.Buttons) && a.Buttons.length
                    && !a.Buttons.includes(a.ExpectedButton)) {
                    stepIssues.push(`Expected button "${a.ExpectedButton}" is not one of the dialog's buttons — the step could never succeed.`);
                }
            }
            (st.Conditions || []).forEach((c, ci) => {
                const n = ci + 1;
                if (c.Type === "shell"             && !c.Command)    stepIssues.push(`Condition ${n}: no command.`);
                if (c.Type === "app_installed"     && !c.BundleId && !c.Path) stepIssues.push(`Condition ${n}: needs a bundle ID or path.`);
                if (c.Type === "default_browser"   && !c.BundleId)   stepIssues.push(`Condition ${n}: needs a bundle ID.`);
                if (c.Type === "file_exists"       && !c.Path)       stepIssues.push(`Condition ${n}: needs a path.`);
                if (c.Type === "profile_installed" && !c.Identifier) stepIssues.push(`Condition ${n}: needs an identifier.`);
                if (c.Type === "process_running"   && !c.Name)       stepIssues.push(`Condition ${n}: needs a process name.`);
            });
            stepIssues.forEach(message =>
                issues.push({ scope: "step", pIdx, sIdx, message })
            );
        });
    });
    return issues;
}

function renderValidationBanner(issues) {
    const global = issues.filter(i => i.scope === "global");
    const rest   = issues.filter(i => i.scope !== "global");
    const total  = issues.length;
    const label  = `${total} issue${total === 1 ? "" : "s"} found`;
    const items  = [...global, ...rest].map(i => {
        let prefix = "";
        if (i.scope === "playbook") {
            const p = state.Playbooks[i.pIdx];
            prefix = `Playbook "${p && p.Name || `#${i.pIdx + 1}`}": `;
        } else if (i.scope === "step") {
            const p = state.Playbooks[i.pIdx];
            const s = p && p.Steps[i.sIdx];
            prefix = `"${p && p.Name || `Playbook ${i.pIdx + 1}`}" › step ${i.sIdx + 1}${s && s.Name ? ` "${s.Name}"` : ""}: `;
        }
        return h("li", null, prefix + i.message);
    });
    return h("details", { class: "validation-banner" },
        h("summary", null, label),
        h("ul", null, ...items)
    );
}

function renderCanvas() {
    _issues = validateState();
    // Clamp selected index in case a playbook was deleted.
    if (ui.selectedPlaybook >= state.Playbooks.length) {
        ui.selectedPlaybook = Math.max(0, state.Playbooks.length - 1);
    }
    const root = document.getElementById("canvas");
    root.innerHTML = "";
    root.append(
        renderPlaybookSidebar(),
        renderPlaybookContent(ui.selectedPlaybook)
    );
}

function renderPlaybookSidebar() {
    const collapsed = ui.sidebarCollapsed;
    const sidebar = h("div", { class: "playbook-sidebar" + (collapsed ? " collapsed" : "") });

    // Top row: toggle button (+ settings icon when collapsed)
    const toggleBtn = h("button", {

        "data-tooltip": collapsed ? "Expand sidebar" : "Collapse sidebar",
        "data-tooltip-below": "",
        onclick: () => { ui.sidebarCollapsed = !ui.sidebarCollapsed; renderCanvas(); }
    }, collapsed ? "›" : "‹");

    const settingsIconBtn = h("button", {
        class: "sidebar-settings-icon",
        "data-tooltip": "Profile Settings",
        "data-tooltip-below": "",
        onclick: e => openSettingsPopover(e.currentTarget)
    }, "⚙");

    sidebar.appendChild(h("div", { class: "sidebar-top-row" },
        collapsed ? null : h("span", { style: "font-size:11px;font-weight:700;color:var(--text-4);letter-spacing:0.05em;text-transform:uppercase" }, "Playbooks"),
        toggleBtn
    ));

    if (collapsed) {
        sidebar.appendChild(settingsIconBtn);
    } else {
        // Settings button
        const isOpen = ui.settingsOpen;
        sidebar.appendChild(
            h("div", { class: "sidebar-settings-row" },
                h("button", {
                    class: "settings-trigger-btn" + (isOpen ? " active" : ""),
                    "data-tooltip": "Branding, identity, hardware info, help & add-on picker",
                    "data-tooltip-below": "",
                    onclick: e => openSettingsPopover(e.currentTarget)
                },
                    h("span", { class: "stb-icon" }, "⚙"),
                    "Profile Settings",
                    h("span", { class: "stb-caret" }, "▾")
                )
            )
        );

        // Welcome Screen launcher — sits directly under Profile Settings since
        // they're both global (per-profile) settings the user reaches via a
        // dedicated launcher button.  Reuses .settings-trigger-btn styling so
        // the two buttons read as a coherent stack.
        const welcomeEnabled = !!(state.WelcomeScreen && state.WelcomeScreen.Enabled);
        sidebar.appendChild(
            h("div", { class: "sidebar-settings-row" },
                h("button", {
                    class: "settings-trigger-btn" + (ui.welcomeOpen ? " active" : ""),
                    "data-tooltip": "Configure the optional welcome dialog shown before onboarding starts",
                    "data-tooltip-below": "",
                    onclick: e => openWelcomePopover(e.currentTarget)
                },
                    h("span", { class: "stb-icon" }, "👋"),
                    h("span", { style: "flex:1;text-align:left" }, "Welcome Screen"),
                    h("span", { class: "stb-mini-status" }, welcomeEnabled ? "On" : "Off"),
                    h("span", { class: "stb-caret" }, "▾")
                )
            )
        );

        sidebar.appendChild(h("div", { class: "sidebar-section-label" }, ""));
    }

    const list = h("div", { class: "sidebar-playbook-list" });
    state.Playbooks.forEach((p, idx) => {
        const stepCount = p.Steps.length;
        const issueCount = _issues.filter(i =>
            (i.scope === "playbook" || i.scope === "step") && i.pIdx === idx).length;
        const itemLabel = p.Name || `Playbook ${idx + 1}`;
        const item = h("div", {
            class: "sidebar-item" + (ui.selectedPlaybook === idx ? " active" : ""),
            draggable: "true",
            "data-tooltip": collapsed ? itemLabel : undefined,
            "data-tooltip-below": collapsed ? "" : undefined,
            onclick: () => { ui.selectedPlaybook = idx; renderCanvas(); }
        },
            h("span", { class: "sidebar-item-icon" }, p.Addon ? "📦" : "▶"),
            h("span", { class: "sidebar-item-name" }, itemLabel),
            issueCount ? h("span", { class: "sidebar-item-warn" }, "⚠") : null,
            h("span", { class: "sidebar-item-count" }, String(stepCount))
        );

        item.addEventListener("dragstart", e => {
            e.dataTransfer.setData("application/enrollinator-lane", String(idx));
            e.dataTransfer.effectAllowed = "move";
            item.classList.add("dragging");
        });
        item.addEventListener("dragend", () => item.classList.remove("dragging"));
        item.addEventListener("dragover", e => {
            if (e.dataTransfer.types.includes("application/enrollinator-lane")) {
                e.preventDefault(); item.classList.add("drag-over");
            } else if (e.dataTransfer.types.includes("application/enrollinator-step")) {
                // Don't allow dropping a step onto its own playbook.
                e.preventDefault(); item.classList.add("step-drop-over");
            }
        });
        item.addEventListener("dragleave", () => item.classList.remove("drag-over", "step-drop-over"));
        item.addEventListener("drop", e => {
            item.classList.remove("drag-over", "step-drop-over");
            // Reorder playbooks
            if (e.dataTransfer.types.includes("application/enrollinator-lane")) {
                const raw = e.dataTransfer.getData("application/enrollinator-lane");
                if (!raw) return;
                e.preventDefault();
                const from = parseInt(raw, 10);
                if (from === idx) return;
                const moved = state.Playbooks.splice(from, 1)[0];
                state.Playbooks.splice(idx, 0, moved);
                if (ui.selectedPlaybook === from) ui.selectedPlaybook = idx;
                renderCanvas(); updatePreview();
                return;
            }
            // Move step to this playbook (appended at end)
            const raw = e.dataTransfer.getData("application/enrollinator-step");
            if (!raw) return;
            e.preventDefault();
            const { from, idx: sIdx } = JSON.parse(raw);
            if (from === idx) return; // same playbook — ignore, handled by step-row drop
            moveStep(from, sIdx, idx, state.Playbooks[idx].Steps.length);
            ui.selectedPlaybook = idx; // switch view to destination
        });

        list.appendChild(item);
    });
    sidebar.appendChild(list);

    sidebar.appendChild(h("button", {
        class: "sidebar-add-btn",
        "data-tooltip": collapsed ? "Add playbook" : undefined,
        "data-tooltip-below": "",
        onclick: () => {
            state.Playbooks.push(blankProfile());
            ui.selectedPlaybook = state.Playbooks.length - 1;
            renderCanvas(); updatePreview();
        }
    },
        "+",
        h("span", { class: "sidebar-add-btn-label" }, " Add playbook")
    ));

    return sidebar;
}

function renderPlaybookContent(pIdx) {
    const content = h("div", { class: "playbook-content" });

    if (state.Playbooks.length === 0) {
        content.appendChild(h("div", { class: "empty-state" },
            "No playbooks yet — click '+ Add playbook' in the sidebar."));
        return content;
    }

    const profile = state.Playbooks[pIdx];
    if (!profile) return content;

    // Show global issues + issues for this playbook only.
    const relevant = _issues.filter(i =>
        i.scope === "global" || ((i.scope === "playbook" || i.scope === "step") && i.pIdx === pIdx));
    if (relevant.length) content.appendChild(renderValidationBanner(relevant));

    // Playbook header
    const isDefault = state.DefaultPlaybook === profile.Name;
    content.appendChild(h("div", { class: "playbook-content-header" },
        h("div", { class: "playbook-content-title" },
            h("span", null, profile.Name || `Playbook ${pIdx + 1}`),
            isDefault ? h("span", { class: "pill default" }, "default") : null,
            profile.TestMode ? h("span", { class: "pill test-mode" }, "test mode") : null,
            profile.Addon ? h("span", { class: "pill addon" }, "addon") : null
        ),
        h("div", { class: "playbook-content-actions" },
            btn("Playbook Settings", () => openProfileEditor(pIdx)),
            btn("Duplicate", () => {
                state.Playbooks.splice(pIdx + 1, 0, JSON.parse(JSON.stringify(profile)));
                renderCanvas(); updatePreview();
            }),
            btn("Delete", () => {
                if (!confirm(`Delete playbook "${profile.Name || "untitled"}"?`)) return;
                state.Playbooks.splice(pIdx, 1);
                renderCanvas(); updatePreview();
            }, "danger")
        )
    ));

    function addStep() {
        openStepCatalog(pIdx, profile.Steps.length);
    }

    if (profile.Steps.length === 0) {
        content.appendChild(h("div", { class: "step-list-empty-cta", onclick: addStep },
            h("div", { class: "cta-icon" }, "＋"),
            h("div", { class: "cta-title" }, "Add your first step"),
            h("div", { class: "cta-sub" }, "Pick from the catalogue — installs, waits, dialogs — or start blank")
        ));
    } else {
        content.appendChild(renderStepList(profile, pIdx));
        content.appendChild(h("div", { style: "display:flex;justify-content:center;" },
            h("button", { class: "step-list-add",
                "data-tooltip": "Add a new step to this playbook",
                onclick: addStep
            }, "+ Add step")
        ));
    }

    return content;
}

function renderStepInsertBtn(pIdx, insertIdx) {
    return h("div", { class: "step-insert" },
        h("button", {
            class: "step-insert-btn",
            "data-tooltip": "Insert step here",
            onclick: e => { e.stopPropagation(); openStepCatalog(pIdx, insertIdx); }
        }, "+")
    );

function renderStepList(profile, pIdx) {
    const list = h("div", { class: "step-list" });
    if (profile.Steps.length === 0) return list;

    profile.Steps.forEach((st, sIdx) => {
        list.appendChild(renderStepRow(st, pIdx, sIdx));
        const branchKey = `${pIdx}:${sIdx}`;
        if (st.OnSuccess || st.OnFailure || ui.expandedBranches.has(branchKey)) {
            list.appendChild(renderBranchBlock(st, pIdx, sIdx, profile.Steps));
        }
        // Insert button between this step and the next.
        if (sIdx < profile.Steps.length - 1) {
            list.appendChild(renderStepInsertBtn(pIdx, sIdx + 1));
        }
    });

    // Drop onto empty area at end of list.
    list.addEventListener("dragover", e => {
        if (e.dataTransfer.types.includes("application/enrollinator-step")) e.preventDefault();
    });
    list.addEventListener("drop", e => {
        const raw = e.dataTransfer.getData("application/enrollinator-step");
        if (!raw) return;
        e.preventDefault();
        const { from, idx } = JSON.parse(raw);
        moveStep(from, idx, pIdx, profile.Steps.length);
    });

    return list;
}

    if (ui.settingsOpen) {

    const backdrop = h("div", { class: "popover-backdrop", onclick: closeSettingsPopover });

    const tabBar = h("div", { class: "popover-tab-bar", id: "settings-tab-bar" },
        ...SETTINGS_TABS.map(t =>
            h("button", {
                class: "popover-tab" + (ui.settingsTab === t.id ? " active" : ""),

                onclick: () => {

                    renderSettingsBody();
                }
            }, t.label)
        )

    const body = h("div", { class: "popover-body", id: "settings-popover-body" });

    const popover = h("div", { class: "settings-popover" }, tabBar, body);

    const root = document.getElementById("popover-root");
    root.innerHTML = "";

    centrePopoverOnCanvas(popover);
    renderSettingsBody();

/** Centre a popover horizontally over the canvas, just below its top edge.
 *  Measures the popover after insertion rather than assuming a width — the
 *  width lives in CSS, and guessing it here drifts the popover off-centre. */
function centrePopoverOnCanvas(popover) {
    const cr = localRect(document.getElementById("canvas"));
    popover.style.left = (cr.left + (cr.width - popover.offsetWidth) / 2) + "px";
    popover.style.top  = (cr.top + 20) + "px";
}

function closeSettingsPopover() {
    ui.settingsOpen = false;
    document.getElementById("popover-root").innerHTML = "";
    renderCanvas(); // refresh button active state
}

// Stand-alone popover for the Welcome Screen tile.  Lives outside the main
// Settings popover (it's not in SETTINGS_TABS) so the Welcome Screen has its
// own dedicated launcher button above the step list.  Reuses the same
// .settings-popover styling for visual consistency.
function openWelcomePopover(triggerEl) {
    if (ui.welcomeOpen) { closeWelcomePopover(); return; }
    if (ui.settingsOpen) closeSettingsPopover();
    ui.welcomeOpen = true;
    renderCanvas();

    const backdrop = h("div", { class: "popover-backdrop", onclick: closeWelcomePopover });
    const tabBar = h("div", { class: "popover-tab-bar" },
        h("button", { class: "popover-tab active" }, "Welcome Screen")
    );
    const body = h("div", { class: "popover-body", id: "welcome-popover-body" });
    body.appendChild(renderWelcomeScreenTile());

    const popover = h("div", { class: "settings-popover" }, tabBar, body);

    const root = document.getElementById("popover-root");
    root.innerHTML = "";
    root.append(backdrop, popover);
    centrePopoverOnCanvas(popover);
}

function closeWelcomePopover() {
    ui.welcomeOpen = false;
    document.getElementById("popover-root").innerHTML = "";
    renderCanvas();
}

// Re-render whichever popover is currently open.  Called by tile renderers
// after toggling state that affects which sub-fields are visible (e.g.
// flipping Welcome Screen's Enabled checkbox).
function reopenSettings() {
    if (ui.settingsOpen) {
        renderSettingsBody();
    } else if (ui.welcomeOpen) {
        const body = document.getElementById("welcome-popover-body");
        if (!body) return;
        body.innerHTML = "";
        body.appendChild(renderWelcomeScreenTile());
    }
}

function renderSettingsBody() {
    const body = document.getElementById("settings-popover-body");
    if (!body) return;
    body.innerHTML = "";
    switch (ui.settingsTab) {
        case "identity": body.appendChild(renderIdentityTile()); break;
        case "branding": body.appendChild(renderBrandingTile()); break;
        case "runtime":  body.appendChild(renderRuntimeTile()); break;
        case "hardware": body.appendChild(renderHardwareInfoTile()); break;
        case "help":     body.appendChild(renderHelpTile()); break;
        case "addons":   body.appendChild(renderAddonPickerTile()); break;
    }
}

// Renders an optional path field. Shows a dashed "+ Add" button when the
// value is empty and the field hasn't been explicitly expanded; once open,
// shows the text input with a Remove button to collapse it again.
function optionalTextRow(label, key, value, onUpdate, placeholder, hintText) {
    const isOpen = !!(value) || ui.expandedOptional.has(key);
    if (isOpen) {
        return row(label,
            h("div", { class: "inline-color" },
                textInput(value, v => { onUpdate(v); updatePreview(); }, placeholder),
                h("button", { class: "btn-secondary", onclick: () => {
                    onUpdate("");
                    ui.expandedOptional.delete(key);
                    updatePreview(); reopenSettings();
                }}, "Remove")
            ),
            ...(hintText ? [hint(hintText)] : [])
        );
    }
    return row(label,
        h("button", { class: "optional-add-btn", onclick: () => {
            ui.expandedOptional.add(key);
            reopenSettings();
        }}, "+ Add")
    );
}

/** Like optionalTextRow but uses renderIconInput so SF= fields get the animation picker. */
function optionalIconRow(label, key, value, onUpdate) {
    const isOpen = !!(value) || ui.expandedOptional.has(key);
    if (isOpen) {
        const removeBtn = h("button", { class: "btn-secondary", style: "flex-shrink:0", onclick: () => {
            onUpdate("");
            ui.expandedOptional.delete(key);
            updatePreview(); reopenSettings();
        }}, "Remove");
        const inputNodes = renderIconInput(value, v => { onUpdate(v); updatePreview(); }, reopenSettings);
        // Wrap text input + remove button on the same line, hints below.
        const [inputEl, ...extra] = inputNodes;
        const firstLine = h("div", { class: "inline-color" }, inputEl, removeBtn);
        return row(label, firstLine, ...extra);
    }
    return row(label,
        h("button", { class: "optional-add-btn", onclick: () => {
            ui.expandedOptional.add(key);
            reopenSettings();
        }}, "+ Add")
    );
}

function renderHardwareInfoTile() {
    const hw = state.HardwareInfo;
    const tile = h("div", { class: "tile" }, h("h3", null, "Hardware info"));
    tile.append(
        h("p", { class: "tile-desc" }, "Shows a key–value panel next to the step list during onboarding — useful when a user needs to read their serial number to IT over the phone."),
        row("Enabled",
            checkbox(hw.Enabled, v => {
                hw.Enabled = v;
                reopenSettings(); updatePreview();
            }, "Show a hardware info panel beside the step list"))
    );
    if (hw.Enabled) {
        const grid = h("div", { style: "display:grid;grid-template-columns:1fr 1fr;gap:4px" });
        for (const [token, label] of HARDWARE_FIELDS) {
            const isOn = hw.Fields.includes(token);
            grid.appendChild(h("label", { class: "check-row",
                style: "gap:6px;font-size:12px;color:var(--text)" },
                h("input", { type: "checkbox", checked: isOn,
                    onchange: e => {
                        if (e.target.checked) {
                            if (!hw.Fields.includes(token)) hw.Fields.push(token);
                        } else {
                            hw.Fields = hw.Fields.filter(x => x !== token);
                        }
                        updatePreview();
                    } }),
                h("span", null, label)));
        }
        tile.append(row("Fields", grid,
            hint("Shown in the order checked here. Uncheck all to hide the panel.")));
    }
    return tile;
}

function renderWelcomeScreenTile() {
    const w = state.WelcomeScreen;
    w.Slideshow = (w.Slideshow || []).map(normalizeSlide);

    const tile = h("div", { class: "tile" },
        h("h3", null, "Welcome Screen"),
        h("p", { class: "tile-desc" }, "Optional full-screen dialog shown before onboarding begins. Supports a logo, slideshow or video, and an optional deferral button.")
    );

    tile.appendChild(h("div", { class: "section" },
        h("div", { class: "behavior-flag" },
            h("div", null,
                h("div", { class: "behavior-flag-label" }, "Enabled"),
                h("div", { class: "behavior-flag-hint" }, "Show a welcome dialog before the main onboarding window opens.")
            ),
            checkbox(w.Enabled, v => { w.Enabled = v; updatePreview(); reopenSettings(); })
        )
    ));

    if (!w.Enabled) return tile;

    // Derive / restore media mode (transient — not serialized)
    if (!w._mediaMode) {
        w._mediaMode = w.Video ? "video" : (w.Slideshow.length > 0 ? "slideshow" : "off");
    }
    const mode = w._mediaMode;

    function switchMode(val) {
        if      (val === "off")       { w.Video = ""; w.Slideshow = []; }
        else if (val === "slideshow") { w.Video = ""; }
        else if (val === "video")     { w.Slideshow = []; }
        w._mediaMode = val;
        updatePreview(); reopenSettings();
    }

    const mediaModes = [["off", "None"], ["slideshow", "Slideshow"], ["video", "Video"]];
    const mediaPicker = h("div", { style: "display:inline-flex;border-radius:7px;overflow:hidden;border:1px solid var(--border)" },
        ...mediaModes.map(([val, label], idx) =>
            h("button", {
                class: "btn" + (mode === val ? " btn--active" : ""),
                style: "border-radius:0;border:none;" + (idx < mediaModes.length - 1 ? "border-right:1px solid var(--border);" : ""),
                onclick: () => switchMode(val)
            }, label)
        )
    );

    // Slideshow frame editor
    const slidesWrap = h("div", { style: "display:flex;flex-direction:column;gap:8px;margin-top:8px" });
    if (w.Slideshow.length === 0)
        slidesWrap.appendChild(hint("No frames. Add one for a still image; 2+ for a user-clicked slideshow."));
    w.Slideshow.forEach((slide, i) => {
        slidesWrap.appendChild(h("div", {
            style: "display:flex;flex-direction:column;gap:6px;padding:10px 10px 8px;background:var(--hover-fill);border-radius:7px;border:1px solid var(--hairline)"
        },
            h("div", { style: "display:flex;align-items:center;gap:6px;margin-bottom:2px" },
                h("span", { style: "font-size:10px;font-weight:700;text-transform:uppercase;color:var(--text-faint);letter-spacing:0.08em;flex:1" }, `Frame ${i + 1}`),
                btn("↑", () => { move(w.Slideshow, i, -1); reopenSettings(); }, "icon"),
                btn("↓", () => { move(w.Slideshow, i,  1); reopenSettings(); }, "icon"),
                btn("✕", () => { w.Slideshow.splice(i, 1); reopenSettings(); updatePreview(); }, "danger")
            ),
            row("Image", h("input", { type: "text", value: slide.Image || "",
                placeholder: "/path/img.png or https://…",
                oninput: e => { slide.Image = e.target.value; updatePreview(); } })),
            row("Title", h("input", { type: "text", value: slide.Title || "",
                placeholder: "Overrides title for this slide (optional)",
                oninput: e => { slide.Title = e.target.value; } })),
            row("Message", h("textarea", {
                placeholder: "Overrides message for this slide (Markdown, optional)",
                oninput: e => { slide.Message = e.target.value; }
            }, slide.Message || ""))
        ));
    });
    slidesWrap.appendChild(btn("+ Add frame", () => {
        w.Slideshow.push({ Image: "", Title: "", Message: "" }); reopenSettings();
    }));

    // Video
    const videoInput = h("input", { type: "text", value: w.Video || "",
        placeholder: "/path/video.mp4, https://… or YouTube URL", style: "flex:1",
        oninput: e => { w.Video = e.target.value; updatePreview(); } });
    const autoplayBtn = h("button", {
        class: "btn" + (w.VideoAutoplay === true ? " btn--active" : ""),
        style: "white-space:nowrap;flex-shrink:0",
        onclick: () => { w.VideoAutoplay = w.VideoAutoplay === true ? null : true; updatePreview(); reopenSettings(); }
    }, "▶ Autoplay");
    const videoSection = h("div", { style: "display:flex;gap:6px;align-items:center;margin-top:8px" },
        videoInput, autoplayBtn
    );

    tile.appendChild(h("div", { class: "section" },
        h("div", { class: "section-title" }, "Content"),
        row("Title", textInputWithVars(w.Title, v => { w.Title = v; updatePreview(); }, "Defaults to Branding title")),
        row("Message", h("textarea", {
            oninput: e => { w.Message = e.target.value; updatePreview(); },
            placeholder: "Markdown — shown below the title."
        }, w.Message || "")),
        row("Media", h("div", null,
            mediaPicker,
            ...(mode === "slideshow" ? [slidesWrap]   : []),
            ...(mode === "video"     ? [videoSection] : [])
        ))
    ));

    tile.appendChild(h("div", { class: "section" },
        h("div", { class: "section-title" }, "Buttons"),
        row("Proceed button",
            textInput(w.Button, v => { w.Button = v; updatePreview(); }, "Get Started"),

        row("Defer button",

                hint("After this many deferrals the defer button is hidden and the user must proceed."))

    // Playbook Picker
    const pp = w.PlaybookPicker || (w.PlaybookPicker = { Enabled: false, Playbooks: [], Title: "", Message: "", Icon: "", HideIcon: false, Width: null, Height: null });

        } else {

        ppSection.appendChild(row("Message",

            placeholder: "/path/img.png, https://…, or SF=symbol.name",
            disabled: pp.HideIcon,
            oninput: e => { pp.Icon = e.target.value; updatePreview(); }
        });
        ppSection.appendChild(row("Icon",
            h("div", { style: "display:flex;flex-direction:column;gap:4px" }, iconInpEl, hideIconCb),
            hint('Path, URL, or SF= token. Omit to use the default. Check "Hide icon" to suppress the icon area entirely.')));

// Canvas: lanes (one per profile) with draggable step cubes.

function renderStepRow(step, pIdx, sIdx) {
    const stepRow = h("div", { class: "step-row", draggable: "true",
        onclick: () => openStepEditor(pIdx, sIdx) });
    stepRow.dataset.pidx = String(pIdx);
    stepRow.dataset.sidx = String(sIdx);

    stepRow.appendChild(h("span", { class: "step-row-handle",
        "data-tooltip": "Drag to reorder · drop onto a sidebar playbook to move",
        onclick: e => e.stopPropagation() }, "⋮⋮"));

    stepRow.appendChild(h("span", { class: "step-row-num" }, String(sIdx + 1)));

    // Icon
    const icon = h("div", { class: "step-row-icon" });
    if (step.Icon) {
        if (/^https?:\/\//i.test(step.Icon)) {
            icon.appendChild(h("img", { src: step.Icon, alt: "" }));
        } else if (/^SF=/i.test(step.Icon)) {
            icon.textContent = "􀀳";
            icon.title = step.Icon;
        } else {
            icon.textContent = "📦";
            icon.title = step.Icon;
        }
    } else {
        icon.textContent = (step.Name || step.Id || "?").trim().charAt(0).toUpperCase() || "?";
    }
    stepRow.appendChild(icon);

    // Body
    const body = h("div", { class: "step-row-body" });
    body.appendChild(h("div", { class: "step-row-name" }, step.Name || "(unnamed step)"));

    const meta = h("div", { class: "step-row-meta" });
    meta.appendChild(h("span", { class: "step-row-id" }, step.Id || "no id"));

    const badges = h("div", { class: "cube-badges" });
    if (step.Action) badges.appendChild(h("span", { class: "tag action" }, step.Action.Type));
    if (step.Conditions && step.Conditions.length)
        badges.appendChild(h("span", { class: "tag conds" },
            `${step.Conditions.length} cond${step.Conditions.length === 1 ? "" : "s"}`));
    if (step.Blocking) badges.appendChild(h("span", { class: "tag blocking" }, "blocking"));
    meta.appendChild(badges);

    const stepErrors = _issues.filter(i => i.scope === "step" && i.pIdx === pIdx && i.sIdx === sIdx);
    if (stepErrors.length) {
        stepRow.classList.add("has-error");
        meta.appendChild(h("span", {
            class: "step-row-error-badge",
            title: stepErrors.map(e => e.message).join("\n")
        }, `⚠ ${stepErrors.length}`));
    }

    body.appendChild(meta);
    stepRow.appendChild(body);

    // Actions
    const actions = h("div", { class: "step-row-actions",
        onclick: e => e.stopPropagation() });
    const branchKey = `${pIdx}:${sIdx}`;
    const branchActive = !!(step.OnSuccess || step.OnFailure) || ui.expandedBranches.has(branchKey);
    actions.appendChild(h("button", {
        class: "btn" + (branchActive ? " branch-btn-active" : ""),
        "data-tooltip": branchActive ? "Remove if/else branch" : "Add if/else branch",
        onclick: e => {
            e.stopPropagation();
            if (branchActive) {
                // Clean toggle: clearing OnSuccess/OnFailure too means a single
                // click always removes the branch, no matter what's selected.
                // (Used to require the user to first reset both dropdowns to
                // default before this button would collapse the panel — which
                // also meant non-default selections silently survived.)
                step.OnSuccess = "";
                step.OnFailure = "";
                ui.expandedBranches.delete(branchKey);
            } else {
                ui.expandedBranches.add(branchKey);
            }
            renderCanvas(); updatePreview();
        } }, "⎇"));
    actions.appendChild(h("button", { class: "btn", "data-tooltip": "Duplicate step",
        onclick: e => {
            e.stopPropagation();
            const copy = JSON.parse(JSON.stringify(step));
            if (copy.Id) copy.Id = copy.Id + "-copy";
            if (copy.Name) copy.Name = copy.Name + " (copy)";
            state.Playbooks[pIdx].Steps.splice(sIdx + 1, 0, copy);
            renderCanvas(); updatePreview();
        } }, "⎘"));
    actions.appendChild(h("button", { class: "btn danger", "data-tooltip": "Delete step",
        onclick: e => {
            e.stopPropagation();
            state.Playbooks[pIdx].Steps.splice(sIdx, 1);
            renderCanvas(); updatePreview();
        } }, "✕"));
    stepRow.appendChild(actions);

    // Drag source
    stepRow.addEventListener("dragstart", e => {
        e.stopPropagation();
        e.dataTransfer.setData("application/enrollinator-step",
            JSON.stringify({ from: pIdx, idx: sIdx }));
        e.dataTransfer.effectAllowed = "move";
        stepRow.classList.add("dragging");
    });
    stepRow.addEventListener("dragend", () => {
        stepRow.classList.remove("dragging", "drop-before", "drop-after");
        document.querySelectorAll(".step-row.drop-before, .step-row.drop-after")
            .forEach(r => r.classList.remove("drop-before", "drop-after"));
    });

    // Drop target — top/bottom half = before/after
    stepRow.addEventListener("dragover", e => {
        if (!e.dataTransfer.types.includes("application/enrollinator-step")) return;
        e.preventDefault(); e.stopPropagation();
        const rect = stepRow.getBoundingClientRect();
        const before = (e.clientY - rect.top) < rect.height / 2;
        stepRow.classList.toggle("drop-before", before);
        stepRow.classList.toggle("drop-after", !before);
    });
    stepRow.addEventListener("dragleave", () => {
        stepRow.classList.remove("drop-before", "drop-after");
    });
    stepRow.addEventListener("drop", e => {
        const raw = e.dataTransfer.getData("application/enrollinator-step");
        if (!raw) return;
        e.preventDefault(); e.stopPropagation();
        const rect = stepRow.getBoundingClientRect();
        const before = (e.clientY - rect.top) < rect.height / 2;
        stepRow.classList.remove("drop-before", "drop-after");
        const { from, idx } = JSON.parse(raw);
        moveStep(from, idx, pIdx, sIdx + (before ? 0 : 1));
    });

    return stepRow;
}

// Move a step from {fromPIdx, fromSIdx} to {toPIdx, toSIdx-ish}.
// The target index is interpreted as the index AFTER removal of the source.
function moveStep(fromPIdx, fromSIdx, toPIdx, toSIdx) {
    const src = state.Playbooks[fromPIdx];
    const dst = state.Playbooks[toPIdx];
    if (!src || !dst) return;
    const [moved] = src.Steps.splice(fromSIdx, 1);
    if (fromPIdx === toPIdx && toSIdx > fromSIdx) toSIdx--;
    dst.Steps.splice(toSIdx, 0, moved);
    renderCanvas(); updatePreview();
}

function closeModal() {
    if (ui.pendingStep) {
        const { pIdx, sIdx } = ui.pendingStep;
        state.Playbooks[pIdx].Steps.splice(sIdx, 1);
        ui.pendingStep = null;
    }
    document.getElementById("modal-root").innerHTML = "";
    ui.openStep = null;
    ui.draftStep = null;
}

function openModal(titleNode, bodyNode, footerNode) {
    const root = document.getElementById("modal-root");
    root.innerHTML = "";
    const backdrop = h("div", { class: "modal-backdrop",
        onclick: e => { if (e.target === backdrop) closeModal(); } });
    const modal = h("div", { class: "modal" },
        h("div", { class: "modal-header" }, titleNode,
            h("button", { class: "btn", onclick: closeModal }, "Close")),
        h("div", { class: "modal-body" }, bodyNode),
        h("div", { class: "modal-footer" }, footerNode || h("span"))
    );
    backdrop.appendChild(modal);
    root.appendChild(backdrop);
}

// ----------------------------------------------------------------------------
// Guides — the follow-up questions a recipe asks in guided mode.
//
// A recipe already knows almost everything about the step it builds. What it
// can't know is the handful of values that are specific to your fleet: which
// policy, which bundle ID, what the dialog should say. Rather than open the
// four-tab editor and leave you to find those fields among everything else,
// guided mode asks for them one at a time and fills the rest in behind you.
//
// This is a front door, not a fence. Every question screen carries "Open the
// full editor", which hands the half-built step straight to the editor with
// the answers so far applied. Advanced mode skips guides entirely.
//
// A question is:
//   { id, ask, hint, type, placeholder, choices, optional, get(st), set(st,v) }
// type is "text" | "textarea" | "number" | "choice". A question whose `set`
// is omitted is display-only (used for the closing summary).
// ----------------------------------------------------------------------------

/** The closing question every guide shares. The recipe has already put a
 *  sensible name in place, so this is a confirm-and-edit, never a blank. */
function nameQuestion(hint) {
    return {
        id: "name",
        ask: "What should this step be called?",
        hint: hint || "Shown in the progress window while the step runs. Change it to something your users would recognise.",
        type: "text",
        placeholder: "Install Google Chrome",
        get: st => st.Name,
        set: (st, v) => { st.Name = v; }
    };
}

/** Conditions all answer "how do we know this finished?", but each type stores
 *  its answer in a different key. This pairs the type picker with the one
 *  follow-up field that type needs. */
const CONDITION_ASKS = [

/** Read/write the first condition on a step, swapping its type in place. */
function firstConditionQuestions(askText) {
    return [
        {
            id: "cond-type",
            ask: askText || "How will Enrollinator know this finished?",
            hint: "The step keeps checking until this is true. You can add more checks later in the Conditions tab.",
            type: "choice",
            choices: CONDITION_ASKS,
            get: st => (st.Conditions[0] || {}).Type || "",
            set: (st, v) => {
                if (!st.Conditions[0] || st.Conditions[0].Type !== v) {
                    st.Conditions[0] = blankCondition(v);
                }
            }
        },
        {
            id: "cond-value",
            // Both the question and the field it writes depend on the type
            // chosen a screen earlier, so they're resolved at render time.
            dynamic: st => {
                const c = st.Conditions[0] || {};
                const spec = CONDITION_ASKS.find(a => a.value === c.Type) || CONDITION_ASKS[0];
                return {
                    ask: spec.ask,
                    placeholder: spec.placeholder,
                    type: spec.value === "shell" ? "textarea" : "text",
                    get: s => (s.Conditions[0] || {})[spec.key] || "",
                    set: (s, v) => { if (s.Conditions[0]) s.Conditions[0][spec.key] = v; }
                };
            }
        }
    ];
}
