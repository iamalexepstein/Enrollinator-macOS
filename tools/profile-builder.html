// Fleet setup sheet — the first thing a new user sees, and the one question
// worth asking up front: what manages these Macs? Everything downstream (the
// source picker, the step catalogue) narrows itself from the answer.
// ============================================================================

function slugifyOrg(name) {
    const slug = (name || "").toLowerCase()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "");
    return slug || "example";
}

/** Seed profile identity from the organisation name, but only over fields the
 *  user has not touched — this runs after setup, and setup can be reopened at
 *  any time, so it must never stomp a hand-edited identifier. */
function seedIdentityFromOrg(org) {
    if (!org) return;
    const defaults = defaultState();
    if (state.outer.PayloadOrganization === defaults.outer.PayloadOrganization ||
        !state.outer.PayloadOrganization) {
        state.outer.PayloadOrganization = org;
    }
    if (state.outer.PayloadIdentifier === defaults.outer.PayloadIdentifier ||
        !state.outer.PayloadIdentifier) {
        state.outer.PayloadIdentifier = `com.${slugifyOrg(org)}.enrollinator`;
    }
}

/** Push the organisation's logo into Branding.Logo — the image at the top of
 *  the onboarding window, which the welcome screen and add-on picker both fall
 *  back to, so setting it once covers all three.
 *
 *  @param {string} logo     the value just chosen in setup
 *  @param {string} previous what setup last pushed, so a logo the user has
 *                           since edited in Profile Settings is left alone
 *                           while re-running setup can still change its own. */
function seedLogoFromOrg(logo, previous) {
    const current = state.Branding.Logo || "";
    if (current && current !== (previous || "")) return;  // hand-edited — leave it
    state.Branding.Logo = logo || "";
}

/** Keep the header chip in step with the fleet. */
function refreshFleetChip() {
    const btn = document.getElementById("fleet-btn");
    if (!btn) return;
    const mdm = sourceById(fleet.mdm);
    btn.innerHTML = "";
    if (mdm) {
        btn.classList.remove("unset");
        if (mdm.icon) btn.appendChild(h("span", { class: "fleet-btn-icon" }, mdm.icon));
        btn.appendChild(h("span", null, mdm.label));
        const extras = fleet.tools.length;
        if (extras) btn.appendChild(h("span", { class: "pill" }, `+${extras}`));
        btn.setAttribute("data-tooltip",
            "Targeting " + mdm.label + ". Click to change the MDM or tooling.");
    } else if (fleet.configured) {
        // Configured with no MDM is a deliberate choice, not a blank — say so.
        btn.classList.remove("unset");
        btn.appendChild(h("span", { class: "fleet-btn-icon" }, "🛠"));
        btn.appendChild(h("span", null, "Advanced mode"));
        btn.setAttribute("data-tooltip",
            "Every source and the full step editor. Click to pick an MDM and turn on guided mode.");
    } else {
        btn.classList.add("unset");
        btn.appendChild(h("span", null, "Set MDM"));
        btn.setAttribute("data-tooltip", "Which MDM this profile targets");
    }
}

/** Guided mode is on whenever the user named an MDM. Advanced mode (no MDM)
 *  keeps the original behaviour: every source, straight into the full editor. */
function guidedMode() { return !!fleet.mdm; }

/** @param {{firstRun?: boolean}} [opts] — first run reached this from the
 *  welcome launcher, so the copy addresses someone starting from nothing and
 *  Cancel reads as Skip. */
function showFleetSetup(opts) {
    const firstRun = !!(opts && opts.firstRun);
    const existing = document.getElementById("fleet-setup-root");
    if (existing) existing.remove();

    // Edit a copy: closing without confirming must leave the fleet untouched.
    // Reopening setup should show the logo that's actually in use, not the one
    // setup last pushed — they differ once someone edits it in Profile Settings.
    const draft = { mdm: fleet.mdm, tools: fleet.tools.slice(), org: fleet.org,
                    logo: state.Branding.Logo || fleet.logo };

    const root = h("div", { id: "fleet-setup-root" });
    const backdrop = h("div", { class: "gs-backdrop",
        onclick: e => { if (e.target === backdrop) dismiss(); } });
    const modal = h("div", { class: "gs-modal" });

    function dismiss() {
        // Skipping still counts as configured — otherwise the sheet reappears
        // on every reload for someone who deliberately skipped it. No MDM is
        // advanced mode, which is a reasonable place to leave a skipper.
        fleet.configured = true;
        saveFleetPrefs();
        refreshFleetChip();
        root.remove();
    }

    modal.appendChild(h("div", { class: "gs-header" },
        h("h2", null, firstRun ? "👋 Let's set up your deployment" : "🏢 Deployment target"),
        h("p", null, firstRun
            ? "Two quick questions so the builder can show you the tools your fleet actually runs. You can change this at any time."
            : "Which MDM and tooling this profile targets. This shapes the step catalogue and the source picker — it is builder context only and never appears in the exported profile.")
    ));

    const body = h("div", { class: "setup-body" });

    // ---- MDM choice. A dropdown rather than a card per vendor: it is a
    // single-choice question, and the grid took the weight of the whole sheet
    // to ask it — worse with every MDM added.
    const mdmSelect = h("select", {
        onchange: e => { draft.mdm = e.target.value || null; syncMdmChoice(); }
    },
        h("option", { value: "" }, "— Choose an MDM —"),
        // Names only. The source icons are a colour-coded shorthand that reads
        // as decoration in a plain option list; 🛠 on the button beside it is
        // doing different work, marking the one choice that isn't a vendor.
        ...sourcesOfKind("mdm").map(m => h("option", { value: m.id }, m.label))
    );
    // No MDM is advanced mode: every source, every field, no follow-up
    // questions. It is also the honest answer for a fleet whose MDM isn't
    // listed, or one driven from a package with no MDM binary at all.
    const advancedBtn = h("button", {
        class: "mdm-advanced",
        "data-tooltip": "Every source and the full step editor, with no guided questions.",
        onclick: () => { draft.mdm = null; syncMdmChoice(); }
    }, h("span", null, "🛠"), h("span", null, "Advanced mode"));

    /** Advanced mode is the absence of an MDM, so the button lights up exactly
     *  when the dropdown is empty. Mutates the two controls in place rather
     *  than rebuilding them, so changing the select doesn't drop focus. */
    function syncMdmChoice() {
        mdmSelect.value = draft.mdm || "";
        const active = sourceById(draft.mdm);
        mdmSelect.setAttribute("data-tooltip",
            active ? active.blurb : "Which MDM manages these Macs.");
        advancedBtn.classList.toggle("selected", draft.mdm === null);
    }
    const mdmChoice = h("div", { class: "mdm-choice" }, mdmSelect, advancedBtn);
    syncMdmChoice();

    body.appendChild(h("div", { class: "setup-section" },
        h("div", { class: "setup-label" }, "What manages these Macs?"),
        mdmChoice,
        h("p", { class: "setup-hint" },
            "Picking an MDM turns on guided mode: new steps are built by answering a few questions, and command pickers list that MDM, macOS built-ins and your tooling. Other MDMs' presets are hidden until you click Show all sources, and the full step editor is one click away from every question. Advanced mode leaves everything on and asks nothing.")
    ));

    // ---- Extra tooling
    const toolList = h("div", { class: "tool-list" });
    function paintToolList() {
        toolList.innerHTML = "";
        for (const t of sourcesOfKind("tool")) {
            const on = draft.tools.includes(t.id);
            toolList.appendChild(h("label", {
                class: "tool-opt" + (on ? " selected" : ""),
            },
                h("input", { type: "checkbox", checked: on, onchange: e => {
                    if (e.target.checked) {
                        if (!draft.tools.includes(t.id)) draft.tools.push(t.id);
                    } else {
                        draft.tools = draft.tools.filter(x => x !== t.id);
                    }
                    paintToolList();
                }}),
                h("div", { class: "tool-opt-text" },
                    h("span", { class: "tool-opt-name" }, `${t.icon} ${t.label}`),
                    h("span", { class: "tool-opt-desc" }, t.blurb)
                )
            ));
        }
    }
    paintToolList();
    body.appendChild(h("div", { class: "setup-section" },
        h("div", { class: "setup-label" }, "Also deployed on this fleet?",
            h("span", { class: "setup-optional" }, "optional")),
        toolList
    ));

    // ---- Organisation: name and logo, the two things every profile wants and
    // nobody thinks to go looking for in Profile Settings.
    const orgInput = h("input", { type: "text", value: draft.org,
        placeholder: "Example, Inc.",
        oninput: e => { draft.org = e.target.value; } });

    const logoWrap = h("div", { class: "setup-logo-field" });
    // Same control as every other icon and logo in the builder, SF picker
    // included — it re-renders itself because the animation row only exists
    // for SF= values.
    function paintLogo() {
        logoWrap.innerHTML = "";
        logoWrap.append(
            ...renderIconInput(draft.logo, v => { draft.logo = v; }, paintLogo)
        );
    }
    paintLogo();

    body.appendChild(h("div", { class: "setup-section" },
        h("div", { class: "setup-label" }, "Organisation",
            h("span", { class: "setup-optional" }, "optional")),
        orgInput,
        h("div", { class: "setup-sublabel" }, "Logo"),
        logoWrap,
        h("p", { class: "setup-hint" },
            "The name fills in the profile's organisation and payload identifier; the logo becomes the image at the top of the onboarding window, which the welcome screen and add-on picker both fall back to. Anything you've already edited in Profile Settings is left alone.")
    ));

    modal.appendChild(body);

    modal.appendChild(h("div", { class: "gs-footer" },
        h("span", { style: "font-size:12px;color:var(--text-4)" },
            "Stored in this browser only."),
        h("div", { style: "display:flex;gap:8px" },
            h("button", { class: "btn",
                style: "height:34px;padding:0 16px;font-size:13px",
                onclick: dismiss
            }, firstRun ? "Skip" : "Cancel"),
            h("button", { class: "btn primary",
                style: "height:34px;padding:0 22px;font-size:13px",
                onclick: () => {
                    const previousLogo = fleet.logo;
                    fleet.mdm = draft.mdm;
                    fleet.tools = draft.tools.slice();
                    fleet.org = draft.org.trim();
                    fleet.logo = (draft.logo || "").trim();
                    fleet.configured = true;
                    saveFleetPrefs();
                    seedIdentityFromOrg(fleet.org);
                    seedLogoFromOrg(fleet.logo, previousLogo);
                    refreshFleetChip();
                    root.remove();
                    renderCanvas(); updatePreview(); reopenSettings();
                }
            }, firstRun ? "Start building" : "Save")
        )
    ));

    backdrop.appendChild(modal);
    root.appendChild(backdrop);
    document.body.appendChild(root);
    setTimeout(() => orgInput.focus(), 60);
}

    modal.appendChild(h("div", { class: "welcome-body" }, list));

            onclick: () => { close(); showGettingStarted(); }
        }, "Take the tour")

    backdrop.appendChild(modal);

    document.body.appendChild(root);
}

            </table>` },
        { h: "Advanced mode", body: `
            <p>Picking <b>Advanced mode</b> instead of an MDM turns all of that off: every source in every picker, the whole catalogue, and recipes that go straight to the full step editor with no questions.</p>
            <p>It's also the right answer when your MDM isn't listed, or when Enrollinator runs from a package with no MDM binary involved. Switch back to an MDM from the header chip whenever you like — it's a setting, not a one-way door.</p>` },
        { h: "Nothing is removed", body: `
            <div class="help-tip">Narrowing is a default, never a wall. <b>Show all sources</b> under any narrowed picker restores the full list; a step that already uses a source from outside your fleet always keeps it in the dropdown — so importing an Iru config while set to Jamf never hides the commands that config is built on; and every guided question screen carries <b>Open the full editor</b>.</div>` },
        { h: "Imported configs answer for themselves", body: `
            <p>Import and Load sample read the MDM back out of the commands a config already contains, and adopt it. Tooling is additive: importing a config that uses Installomator adds Installomator to your fleet rather than replacing what was there.</p>` }
    ]
},
{
    id: "playbooks", icon: "🗂", title: "Playbooks",
    lede: "One playbook per device type, department, or role. Enrollinator runs exactly one of them.",
    blocks: [
        { h: "Working with playbooks", body: `
            <ul>
              <li>The left sidebar lists every playbook. Click one to open it.</li>
              <li>Drag to reorder. Order is cosmetic — it does not affect which playbook runs.</li>
              <li>Drag a step row onto a playbook name to move that step across playbooks.</li>
              <li>Click the playbook title in the content header to rename it or edit its description.</li>
              <li>Collapse the sidebar with the <code>‹</code> button when you want more room for steps.</li>
            </ul>
            <p>Playbooks are referenced by <b>name</b>, not by position — <b>DefaultPlaybook</b> and the welcome screen's playbook picker both hold name strings. Renaming a playbook here updates both, so the default stays the default; the Name field tells you which references will move.</p>` },
        { h: "How the playbook is chosen", body: `
            <p>Enrollinator resolves exactly one playbook at launch, in this order:</p>
            <ol>
              <li><code>--profile NAME</code> on the command line, if given. Always wins — this is the testing path.</li>
              <li><b>DefaultPlaybook</b> from global settings, matched against playbook names <b>exactly and case-sensitively</b>.</li>
              <li>With no DefaultPlaybook: the only playbook, if you've defined just one.</li>
              <li>Otherwise, if the welcome screen's playbook picker is enabled, the first playbook — the user picks from there.</li>
            </ol>
            <p>If none of those apply, Enrollinator stops with an error rather than guessing.</p>
            <div class="help-tip"><b>Varying the playbook across a fleet</b> is done outside the config: scope a different <code>.mobileconfig</code> to each MDM smart group, or ship one config and let the welcome screen's playbook picker put the choice to the user.</div>` },
        { h: "Selectors have been removed", body: `
            <p>Older builds picked a playbook per machine by matching a <b>Selector</b> rule — hostname regex, model identifier, serial number, flag file, macOS version, or console user. Selectors are gone from both the runtime and this builder, so there are no selector fields to fill in.</p>
            <p>Importing a config written for an older build still works: its <code>Selector</code> dicts are simply dropped. Re-exporting is the easiest way to clean up a legacy config.</p>` },
        { h: "Addon playbooks", body: `
            <p>Toggle <b>Addon</b> on a playbook to keep it out of automatic selection. Addon playbooks are offered to the user in a checkbox picker <i>after</i> the main run finishes — optional software, department extras, and so on.</p>
            <p>Steps that already ran during the main run are skipped automatically, so there are no double installs. The picker's title, message, button labels, icon, and size live under <b>Settings → Addon picker</b>.</p>` }
    ]
},
{
    id: "steps", icon: "⚡", title: "Steps",
    lede: "Click any step row to open its editor. The editor buffers a draft — Done commits it, Cancel discards it.",
    blocks: [
        { h: "Adding a step — the catalogue", body: `
            <p><b>+ Add step</b>, and the <code>+</code> between two steps, open a searchable catalogue of tasks rather than dropping you into an empty editor. Pick what you want to happen — <i>Run a Jamf policy</i>, <i>Wait for an app to appear</i>, <i>Ask them to accept a policy</i> — and the step arrives with its action, conditions, timeout, blocking behaviour and icon already filled in.</p>
            <table>
              <tr><th>Group</th><th>Covers</th></tr>
              <tr><td>Install software</td><td>Your MDM's install tasks, your tooling's, macOS built-ins, and a local <code>.pkg</code>.</td></tr>
              <tr><td>Wait for something</td><td>MDM enrolment, an app appearing, or the user finishing something themselves — the last with a wait window and slideshow already set up.</td></tr>
              <tr><td>Talk to the user</td><td>A message, a policy to accept, a slideshow walkthrough, or a video.</td></tr>
              <tr><td>Flow &amp; custom</td><td>Pause, branch checkpoint, custom shell command, blank step.</td></tr>
            </table>
            <div class="help-tip">A recipe is a starting point, not a track. Every one produces an ordinary step with nothing locked or hidden, and <b>Blank step</b> gives you the empty editor if you would rather build it up by hand.</div>` },
        { h: "Guided mode", body: `
            <p>With an MDM set, picking a recipe asks for the handful of values it can't know — one question per screen, with everything else filled in behind you. <i>Run a Jamf policy</i> asks which custom event and what to call the step, and that's the whole interaction.</p>
            <table>
              <tr><td>Name &amp; icon</td><td>The closing question pairs them, since they sit side by side in the progress window. The icon field has the same <b>SF</b> picker as everywhere else.</td></tr>
              <tr><td>Enter</td><td>Next question. In a message box use ⌘ Enter, since plain Enter is a newline there.</td></tr>
              <tr><td>Back</td><td>Revisit an answer. <b>Skip</b> appears on optional questions.</td></tr>
              <tr><td>Open the full editor</td><td>Hands the half-built step to the four-tab editor with your answers applied. On every screen.</td></tr>
              <tr><td>Cancel</td><td>Discards the step entirely — it isn't added to the playbook until the last question.</td></tr>
            </table>
            <p>Questions can depend on earlier answers: <i>Wait for the user</i> asks how the step should know it's finished, then follows up with the right field for the check you chose.</p>
            <p>In <b>Advanced mode</b> there are no questions — recipes open the full editor directly, on whichever tab holds the field worth filling in.</p>` },
        { h: "Info tab", body: `
            <table>
              <tr><th>Field</th><th>Notes</th></tr>
              <tr><td>Name</td><td>Shown in the step list during the run.</td></tr>
              <tr><td>Description</td><td>Shown as the step's subtitle.</td></tr>
              <tr><td>ID</td><td>Stable identifier used as a branch target. Auto-generated when left blank — set it by hand if you intend to point <code>OnSuccess</code> / <code>OnFailure</code> at this step.</td></tr>
              <tr><td>Icon</td><td>An SF Symbol token (<code>SF=checkmark.circle</code>), an absolute path, or an <code>https://</code> URL.</td></tr>
            </table>` },
        { h: "Icons and SF Symbols", body: `
            <p>Every icon and logo field in the builder — the organisation <b>Logo</b> in deployment setup, step <b>Icon</b>, branding <b>Logo</b> and <b>Banner</b>, the welcome screen's <b>Logo / icon</b>, the playbook picker's and add-on picker's <b>Icon</b> — has an <b>SF</b> button beside it.</p>
            <p>It opens a searchable shortlist of around a hundred symbols relevant to setting up a Mac, labelled in the words you'd search for: <code>vpn</code> finds <code>lock.shield</code>, <code>restart</code> finds <code>powerplug</code>. The <b>Symbol</b> field below the list takes any SF Symbol name at all, so the shortlist is a shortcut rather than a limit.</p>
            <p>An animation dropdown sits alongside — pulse, bounce, variable colour, appear, disappear, rotate, plus breathe and wiggle on macOS 14+. Animations need macOS 13+.</p>
            <div class="help-tip">The picker lists names rather than drawing the symbols. SF Symbols is a system font with no web distribution, so a browser has nothing to render — use Apple's free SF Symbols app to see the artwork, then paste the name in.</div>
            <p>Remote images are fetched at run time with a short timeout; if the host is unreachable Enrollinator drops the image rather than hanging the window.</p>` },
        { h: "Reordering and duplicating", body: `
            <ul>
              <li>Drag the <code>⋮⋮</code> handle to move a step within its playbook.</li>
              <li>Hover between two steps and click the <code>+</code> that fades in to insert at that exact position.</li>
              <li>Drag a step onto a sidebar playbook name to move it to that playbook.</li>
            </ul>` }
    ]
},
{
    id: "actions", icon: "▶", title: "Actions",
    lede: "What Enrollinator actually does for a step. Every step has at most one action — a step with none is a pure condition check.",
    blocks: [
        { h: "The five action types", body: `
            <table>
              <tr><th>Type</th><th>What it does</th></tr>
              <tr><td>shell</td><td>Runs a command as root, or as the console user with <b>Run as user</b>. Set <b>Timeout</b> to cap a command that might hang.</td></tr>
              <tr><td>package</td><td>Installs a local <code>.pkg</code> via <code>installer</code>. Give the path on disk and, optionally, a target volume (default <code>/</code>).</td></tr>
              <tr><td>dialog</td><td>Shows a swiftDialog popup. The step passes or fails on which button the user clicks.</td></tr>
              <tr><td>wait</td><td>Sleeps a fixed number of seconds and succeeds. Useful for letting a daemon settle after an install.</td></tr>
              <tr><td>noop</td><td>Succeeds immediately. Use it for condition-only steps and as a landing pad for branches.</td></tr>
            </table>` },
        { h: "MDM presets for shell actions", body: `
            <p>The <b>MDM / source</b> picker fills in the command for you, with a sensible timeout, so you don't have to remember binary paths.</p>
            <table>
              <tr><th>Source</th><th>Commands</th></tr>
              <tr><td>Jamf Pro</td><td>policy by custom event, policy by ID, all scoped policies, recon, manage</td></tr>
              <tr><td>Installomator</td><td>Install by label (<code>googlechromepkg</code>, <code>slack</code>, …)</td></tr>
              <tr><td>Munki / WS1</td><td><code>managedsoftwareupdate</code> — auto, install-cached-only, check-only</td></tr>
              <tr><td>Iru (formerly Kandji)</td><td>Run all library items, or one item by name or ID</td></tr>
              <tr><td>Mosyle</td><td>Force an agent check-in via enrollment renew</td></tr>
              <tr><td>Addigy</td><td>Run a named policy through the go-agent</td></tr>
              <tr><td>macOS built-ins</td><td>Rosetta 2, Xcode Command Line Tools, Software Update, <code>installer</code></td></tr>
              <tr><td>Custom</td><td>Write the command yourself</td></tr>
            </table>
            <p>Picking a preset only writes text into the Command field — you can edit it afterwards and the builder will still recognise it.</p>
            <p>When a vendor renames a binary or a verb, the old command is still recognised, so an existing config keeps editing against its own preset. Import never rewrites it: the step shows what the preset writes today with an <b>Update it</b> link, and your timeout is left alone. This covers the Kandji → Iru rebrand — <code>kandji run</code> and <code>kandji library</code> map onto <code>iru library</code>.</p>
            <p>The picker is narrowed to your <i>Deployment target</i> — your MDM, macOS built-ins, your tooling, and Custom. <b>Show all sources</b> beneath it brings back the full table above, and a step already using another MDM's command keeps that source listed regardless.</p>` },
        { h: "Dialog actions", body: `
            <p>A dialog action shows a window and turns the user's click into pass or fail.</p>
            <ul>
              <li><b>Buttons</b> — up to three labels; reorder or remove with <code>↑ ↓ ✕</code>.</li>
              <li><b>Expected</b> — which button counts as a pass. Appears once at least one button is defined.</li>
              <li><b>Message</b> supports Markdown.</li>
              <li><b>Media</b> — None, Slideshow, or Video (see <i>Wait windows &amp; media</i>).</li>
              <li><b>Blur screen</b> and <b>Always on top</b> override the global setting for this dialog only.</li>
            </ul>` }
    ]
},
{
    id: "conditions", icon: "✓", title: "Conditions",
    lede: "Checks that decide whether a step counts as complete. All conditions on a step must pass — they are ANDed.",
    blocks: [
        { h: "Condition types", body: `
            <table>
              <tr><th>Type</th><th>Passes when…</th></tr>
              <tr><td>shell</td><td>The command exits 0</td></tr>
              <tr><td>app_installed</td><td>An app with the given bundle ID — and optional minimum version — is installed</td></tr>
              <tr><td>default_browser</td><td>The app with the given bundle ID is the default browser</td></tr>
              <tr><td>file_exists</td><td>A file or directory exists at the path (<b>Kind</b> narrows it to one or the other)</td></tr>
              <tr><td>profile_installed</td><td>A configuration profile with the given identifier is installed</td></tr>
              <tr><td>process_running</td><td>A process with the given name is running, optionally at least N of them</td></tr>
            </table>
            <p><b>Invert</b> on any condition flips its logic — that's how you assert something is <i>absent</i>.</p>` },
        { h: "Why conditions matter twice", body: `
            <p>Conditions do double duty. On a normal step they verify the action worked. On a <b>blocking</b> step they are the gate: Enrollinator polls them until they all pass, keeping the user on that step.</p>
            <p>These primitives are deliberately vendor-neutral. Gates for ZScaler, GlobalProtect, CrowdStrike and friends are composed from them — see <code>docs/recipes.md</code> in the repo for copy-pasteable examples.</p>` }
    ]
},
{
    id: "behavior", icon: "⎇", title: "Behavior & branching",
    lede: "How a step handles waiting, failure, and where the run goes next.",
    blocks: [
        { h: "Blocking steps", body: `
            <p>With <b>Blocking</b> on, Enrollinator will not advance until every condition passes. It re-checks on an interval and shows the user what they need to do.</p>
            <table>
              <tr><th>Field</th><th>Notes</th></tr>
              <tr><td>Interval</td><td>Seconds between condition checks. Default 5.</td></tr>
              <tr><td>Timeout</td><td>Give up after this many seconds. <code>0</code> waits forever.</td></tr>
              <tr><td>User prompt</td><td>Text shown in the main window while waiting.</td></tr>
              <tr><td>Wait window</td><td>An optional second window with instructions — see the next section.</td></tr>
            </table>` },
        { h: "Continue on failure", body: `
            <p>By default a failed step stops the run. Turn <b>Continue on failure</b> on for steps that are nice-to-have, and the run carries on with the failure recorded in the log.</p>` },
        { h: "Branching", body: `
            <p>Click <code>⎇</code> on a step row to open its branch block and wire the two outcomes independently.</p>
            <table>
              <tr><th>Target</th><th>Meaning</th></tr>
              <tr><td>Continue to next step</td><td>Default on success — advance sequentially.</td></tr>
              <tr><td>End run</td><td><code>$end</code> — finish immediately.</td></tr>
              <tr><td>Stop run</td><td>Default on failure — halt without closing.</td></tr>
              <tr><td>A step name</td><td>Jump to that step by its ID.</td></tr>
            </table>
            <div class="help-tip">Branch targets are resolved by step <b>ID</b>, so give any step you plan to jump to a deliberate ID on the Info tab. Enrollinator carries a cycle guard, but a branch pointing back at itself is still a bug worth avoiding.</div>` }
    ]
},
{
    id: "media", icon: "🖼", title: "Wait windows & media",
    lede: "The second window shown while a blocking step polls — this is where you tell the user what to do.",
    blocks: [
        { h: "Wait window fields", body: `
            <p>Enable Blocking on the Behavior tab, then click <b>Add wait window</b>.</p>
            <table>
              <tr><td>Title / Message</td><td>Window content. Message supports Markdown.</td></tr>
              <tr><td>Font sizes</td><td>Compact Title / Body fields.</td></tr>
              <tr><td>Size</td><td>Compact W / H fields.</td></tr>
              <tr><td>Blur screen / Always on top</td><td>Per-window overrides of the global setting.</td></tr>
              <tr><td>Media</td><td>None, Slideshow, or Video.</td></tr>
            </table>` },
        { h: "Slideshows", body: `
            <p>A slideshow is a sequence of frames the user clicks through before the step's polling begins. Each frame carries an image plus optional title and message overrides, so one step can walk someone through a multi-screen sign-in.</p>
            <p>In a wait window the frames get <b>← Back</b> / <b>Next →</b> navigation, and the user can go back to re-read at any point while Enrollinator keeps polling in the background.</p>` },
        { h: "Video", body: `
            <p>Point <b>Video</b> at a file path, a direct URL, or a YouTube watch/short URL — YouTube links are converted to an embeddable ID automatically. The <b>▶ Autoplay</b> toggle appears once a URL is entered. Video takes precedence over a slideshow if both are set.</p>` },
        { h: "Welcome screen", body: `
            <p>The <b>Welcome screen</b> button above the step list configures the window shown before the run starts: title, message, logo, its own slideshow or video, and an optional <b>Not now</b> deferral button with a maximum deferral count.</p>
            <p>It can also present a <b>playbook picker</b>, letting the user choose their own setup from a list you define.</p>` }
    ]
},
{
    id: "settings", icon: "⚙", title: "Global settings",
    lede: "Everything under the ⚙ button applies to every playbook in the config.",
    blocks: [
        { h: "Branding", body: `
            <table>
              <tr><td>Title / Subtitle</td><td>Main window text. Both support <code>{token}</code> substitution.</td></tr>
              <tr><td>Logo</td><td>Image path, <code>https://</code> URL, or SF Symbol.</td></tr>
              <tr><td>Banner</td><td>Optional image across the top of the window.</td></tr>
              <tr><td>Accent colour</td><td>Hex colour applied to the title text.</td></tr>
              <tr><td>Window size</td><td>Default dimensions of the main window.</td></tr>
              <tr><td>Font sizes</td><td>Title and body sizes.</td></tr>
            </table>` },
        { h: "Hardware info panel", body: `
            <p>Turn it on and pick fields to show a live info panel beside the step list: current user, computer name, hostname, serial number, model identifier, macOS version, IP address, hardware UUID.</p>` },
        { h: "Help contacts", body: `
            <p>Fills the <code>?</code> button <i>inside the Enrollinator run window</i> — not this builder's help. Give it a title, a message, and a list of contacts (label, detail, optional URL) so a stuck user can reach your help desk without leaving the window.</p>` },
        { h: "Runtime flags", body: `
            <table>
              <tr><td>Allow close</td><td>Shows a Done button when the run finishes instead of closing automatically.</td></tr>
              <tr><td>Test mode</td><td>Walks the whole UI and evaluates conditions without running destructive actions. Use this before every rollout.</td></tr>
              <tr><td>Install swiftDialog</td><td>Enrollinator downloads and installs swiftDialog itself if it's missing. Prefer deploying it as a managed package — this needs <code>api.github.com</code> reachable at enrollment time, which is often exactly when it isn't. A <b>Signing team ID</b> field appears when this is on; leave it blank unless you mirror your own rebuilt package.</td></tr>
              <tr><td>Blur screen</td><td>Blurs the desktop behind the window.</td></tr>
              <tr><td>Always on top</td><td>Keeps the window above everything else.</td></tr>
              <tr><td>Quit key</td><td>Secret key combination that dismisses the window — useful for technicians.</td></tr>
            </table>` },
        { h: "Identity", body: `
            <p>The outer profile wrapper: payload identifier (reverse-DNS), display name, organization, and description. These are what your MDM shows in its profile list.</p>` }
    ]
},
{
    id: "tokens", icon: "❴❵", title: "Tokens",
    lede: "Placeholders expanded at run time, on the machine, inside title and subtitle strings.",
    blocks: [
        { h: "Available tokens", body: `
            <table>
              <tr><th>Token</th><th>Expands to</th></tr>
              <tr><td>{console_user}</td><td>Login username</td></tr>
              <tr><td>{full_name}</td><td>The user's display name</td></tr>
              <tr><td>{computer_name}</td><td>Computer name</td></tr>
              <tr><td>{hostname}</td><td>Local hostname</td></tr>
              <tr><td>{serial_number}</td><td>Hardware serial</td></tr>
              <tr><td>{model}</td><td>Model identifier, e.g. <code>MacBookPro18,4</code></td></tr>
              <tr><td>{model_name}</td><td>Marketing model name, e.g. <code>MacBook Pro</code></td></tr>
              <tr><td>{os_version}</td><td>macOS version</td></tr>
              <tr><td>{ip_address}</td><td>Primary IP address</td></tr>
            </table>
            <p>Click the <code>{ }</code> button beside any supporting field to insert one at the cursor instead of typing it. Example: <code>Welcome to Acme, {console_user}!</code></p>` }
    ]
},
{
    id: "export", icon: "📄", title: "Export & deploy",
    lede: "Two export formats, matching the two ways Enrollinator can be configured.",
    blocks: [
        { h: "Which format?", body: `
            <table>
              <tr><th>Format</th><th>Use it when…</th></tr>
              <tr><td>.mobileconfig</td><td>You deploy config separately from code. Upload it to your MDM as a custom configuration profile for the <code>com.enrollinator.app</code> domain. You can update the config without rebuilding the package.</td></tr>
              <tr><td>.plist (--xml)</td><td>You want the config baked into the package. Save it as <code>enrollinator.xml</code> at the repo root and run <code>./pkg/build.sh</code> — no MDM profile needed.</td></tr>
            </table>` },
        { h: "The live preview", body: `
            <p>Under the visual preview, the right-hand pane shows the exact XML that will be written, updated on every keystroke. The badge in its header reads <b>valid</b> or <b>error</b> depending on whether the config serialises cleanly — visible whether or not the XML itself is unfolded.</p>
            <p>The XML starts folded, since most edits are checked against the picture rather than the plist. Click the <b>.mobileconfig preview</b> header to unfold it.</p>
            <p>Collapse the whole pane with <code>›</code> for more editing room, or drag the divider to resize it.</p>` },
        { h: "The visual preview", body: `
            <p>The top of the right pane is a mock Mac desktop with the windows this config produces drawn on it, at true size against the screen, redrawn on every edit. Two dropdowns and a stepper drive it:</p>
            <table>
              <tr><td>Screen</td><td>Jumps to a screen. The list is built from the config itself — the welcome screen and its playbook picker only appear when you enable them, the add-on picker only once a playbook is marked <b>Addon</b>.</td></tr>
              <tr><td>Playbook</td><td>Which playbook the run window is working through. It follows whichever playbook you're editing until you choose one here, after which it stays put.</td></tr>
              <tr><td><code>‹ ›</code></td><td>Walks the whole run in order without touching the dropdowns: welcome screen, each of its slides, the playbook picker, every step, finished, add-ons. Rows above the current step read <b>Done</b>, the current one <b>Running…</b> or <b>Waiting…</b>, the rest <b>Pending</b> — the same status text swiftDialog shows.</td></tr>
            </table>
            <p><b>Windows that open on top of others are drawn that way.</b> A step's <code>dialog</code> action, or a blocking step's wait window, sits offset over the dimmed run window; the add-on picker sits over the finished one. A step with both gets a frame for each, in the order the run opens them.</p>
            <p><b>Slideshows are stepped through frame by frame</b>, with the same <b>Next →</b> and <b>← Back</b> buttons the user will click and each frame's own title and message. The last frame carries the window's real buttons, which is how the runtime itself hands off from the slides to the window.</p>
            <p><b>The screen blurs when the run would blur it</b> — <code>BlurScreen</code>, or a per-window <b>Blur</b> override — smearing the wallpaper and dock behind the window.</p>
            <p>The line below the screen spells out the parts a drawing can't show: conditions, poll interval, and where <b>On success</b> / <b>On failure</b> branch to.</p>
            <p>It is a schematic, not a screenshot. Logos, banners, slideshow frames and video are drawn as labelled placeholders — a browser can't resolve a path that only exists on the enrolled Mac — and SF Symbols show their name rather than the glyph. The desktop and its dock are set dressing, there to give the windows a sense of scale. <code>{token}</code> placeholders are filled with sample values so you can see the shape of the finished sentence.</p>
            <p>Click the <b>Visual preview</b> header to fold it away, or drag the bar beneath it to give it more room. Both stick between sessions.</p>` },
        { h: "Getting Enrollinator itself", body: `
            <p>The lower half of the <b>Download ▾</b> menu pulls the runtime straight from the project's newest release, so you don't need a separate trip to GitHub:</p>
            <table>
              <tr><td>Latest script</td><td><code>enrollinator.sh</code> — the runner itself. Drop it at <code>/usr/local/enrollinator/</code>, or run it directly with <code>--config</code> while testing.</td></tr>

/** Flatten sections into searchable entries. */
function helpSearchIndex() {
    const entries = [];
    HELP_SECTIONS.forEach(sec => {
        sec.blocks.forEach(b => {
            const text = (sec.title + " " + b.h + " " + b.body.replace(/<[^>]+>/g, " "))
                .replace(/\s+/g, " ").toLowerCase();
            entries.push({ section: sec, block: b, text });
        });
    });
    return entries;
}

/** Build the help panel into `doc`, which is this document for the modal and
 *  the popped-out window's for the standalone one. Everything below is written
 *  against `doc` rather than the global so the two stay one implementation —
 *  a second copy of the search and nav logic would drift within a release.
 *
 *  @param {Document} doc
 *  @param {{sectionId?: string, popped?: boolean, onClose?: Function,
 *           onPopOut?: Function, onTour?: Function}} opts
 *  @returns {{modal: Element, focusSearch: Function, setSection: Function}} */
function mountHelpCentre(doc, opts) {
    opts = opts || {};
    let activeId = opts.sectionId || HELP_SECTIONS[0].id;
    const index = helpSearchIndex();

    const modal = doc.createElement("div");
    modal.className = "help-modal" + (opts.popped ? " popped" : "");

    const head = doc.createElement("div");
    head.className = "help-head";
    head.innerHTML = `
        <h2>📘 Profile Builder help</h2>
        <input type="text" class="help-search" placeholder="Search help…" autocomplete="off">
        ${opts.onPopOut ? `<button class="help-popout" title="Open help in its own window">⧉</button>` : ""}
        <button class="help-close" title="${opts.popped ? "Close window" : "Close"}">✕</button>`;

    const body = doc.createElement("div");
    body.className = "help-body";
    const nav = doc.createElement("div");
    nav.className = "help-nav";
    const content = doc.createElement("div");
    content.className = "help-content";
    body.append(nav, content);
    modal.append(head, body);

    const search = head.querySelector(".help-search");
    head.querySelector(".help-close").addEventListener("click", () => {
        if (opts.onClose) opts.onClose();
    });
    const popBtn = head.querySelector(".help-popout");
    if (popBtn) popBtn.addEventListener("click", () => opts.onPopOut());

    /** Browsers block window.open often enough that failing silently would
     *  look like a dead button. Say what happened, in place. */
    function reportPopOutBlocked() {
        if (!popBtn || head.querySelector(".help-popout-blocked")) return;
        const note = doc.createElement("span");
        note.className = "help-popout-blocked";
        note.textContent = "Pop-up blocked — allow pop-ups for this page.";
        head.insertBefore(note, popBtn);
        popBtn.classList.add("blocked");
    }

    function blockNode(block, sectionTitle) {
        const el = doc.createElement("div");
        el.className = "help-block";
        el.innerHTML =
            (sectionTitle ? `<div class="help-result-section">${sectionTitle}</div>` : "") +
            `<h4>${block.h}</h4>` + block.body;
        return el;
    }

    function renderNav() {
        nav.innerHTML = "";
        HELP_SECTIONS.forEach(sec => {
            const b = doc.createElement("button");
            b.className = sec.id === activeId ? "active" : "";
            b.innerHTML = `<span class="help-nav-icon">${sec.icon}</span><span>${sec.title}</span>`;
            b.addEventListener("click", () => {
                activeId = sec.id;
                search.value = "";
                renderNav(); renderSection();
            });
            nav.appendChild(b);
        });
    }

    function renderSection() {
        const sec = HELP_SECTIONS.find(s => s.id === activeId) || HELP_SECTIONS[0];
        content.innerHTML = `<h3>${sec.icon} ${sec.title}</h3><p class="help-section-lede">${sec.lede}</p>`;
        sec.blocks.forEach(b => content.appendChild(blockNode(b)));
        content.scrollTop = 0;
    }

    function renderResults(q) {
        const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
        const hits = index.filter(e => terms.every(t => e.text.includes(t)));
        content.innerHTML = `<h3>Search</h3><p class="help-section-lede">${hits.length} result${hits.length === 1 ? "" : "s"} for “${q}”.</p>`;
        if (!hits.length) {
            const none = doc.createElement("div");
            none.className = "help-empty";
            none.textContent = "Nothing matched. Try a single keyword — blocking, slideshow, Jamf, token…";
            content.appendChild(none);
            return;
        }
        hits.forEach(e => content.appendChild(blockNode(e.block, e.section.title)));
        content.scrollTop = 0;
    }

    search.addEventListener("input", e => {
        const q = e.target.value.trim();
        if (q) {
            // Results span every section, so no nav entry is "current".
            nav.querySelectorAll("button").forEach(b => b.classList.remove("active"));
            renderResults(q);
        } else {
            renderNav();
            renderSection();
        }
    });

    // Inline actions embedded in help copy (e.g. "show the quick tour"). The
    // popped-out window runs these back in the builder, since that's where the
    // thing being demonstrated lives.
    content.addEventListener("click", e => {
        const t = e.target.closest("[data-help-action]");
        if (!t) return;
        if (t.dataset.helpAction === "tour" && opts.onTour) opts.onTour();
    });

    renderNav();
    renderSection();

    return {
        modal,
        focusSearch: () => search.focus(),
        reportPopOutBlocked,
        currentSection: () => activeId,
        setSection: id => {
            activeId = id;
            search.value = "";
            renderNav(); renderSection();
        }
    };
}

function showHelpCenter(sectionId) {
    // Already popped out? Raise that window rather than opening a second copy.
    if (helpWindowOpen()) {
        helpWindow.focus();
        if (sectionId && helpWindowApi) helpWindowApi.setSection(sectionId);
        return;
    }

    const existing = document.getElementById("help-root");
    if (existing) existing.remove();

    const root = document.createElement("div");
    root.id = "help-root";

    const backdrop = document.createElement("div");
    backdrop.className = "gs-backdrop";
    backdrop.addEventListener("click", e => { if (e.target === backdrop) close(); });

    function close() {
        root.remove();
        document.removeEventListener("keydown", onKey, true);
    }
    function onKey(e) {
        if (e.key !== "Escape") return;
        // Swallow it so the shared Esc handler doesn't also close a step editor
        // sitting behind the help centre.
        e.stopPropagation();
        close();
    }
    document.addEventListener("keydown", onKey, true);

    const api = mountHelpCentre(document, {
        sectionId: sectionId || HELP_SECTIONS[0].id,
        onClose: close,
        onTour: () => { close(); showGettingStarted(); },
        onPopOut: () => {
            // Only dismiss the modal once the window is actually up — a
            // blocked pop-up would otherwise leave the reader with nothing.
            if (popOutHelpCentre(api.currentSection())) close();
            else api.reportPopOutBlocked();
        }
    });

    backdrop.appendChild(api.modal);
    root.appendChild(backdrop);
    document.body.appendChild(root);
    setTimeout(api.focusSearch, 30);
}

// ----------------------------------------------------------------------------
// Popped-out help
//
// The builder is one self-contained file with no server, so the second window
// can't just load a URL — it's opened blank and built in place: this page's own
// <style> elements are copied across, then the same mountHelpCentre() renders
// into it. Nothing is fetched, so it works offline and from file:// exactly
// like the rest of the tool.
// ----------------------------------------------------------------------------

function helpWindowOpen() {
    return !!(helpWindow && !helpWindow.closed && helpWindow.document);
}

/** Push the builder's current theme and interface scale onto the popped-out
 *  window. Called when it opens, when it resizes, and whenever the builder's
 *  own appearance settings change, so the two never drift apart. */
function syncHelpWindow() {
    if (!helpWindowOpen()) return;
    try {
        const el = helpWindow.document.documentElement;
        el.dataset.theme = document.documentElement.dataset.theme || "light";
        // The help window scales with the builder, but measures its own
        // viewport — the same innerHeight ÷ scale that applyDisplaySettings()
        // does here, since .help-modal.popped is sized from --app-vh.
        const scale = effectiveScale();
        el.style.setProperty("--ui-scale", String(scale));
        el.style.setProperty("--app-vh", (helpWindow.innerHeight / scale) + "px");
    } catch (e) { /* window went away mid-call — nothing to sync */ }
}

/** @returns {boolean} false when the browser blocked the popup. */
function popOutHelpCentre(sectionId) {
    if (helpWindowOpen()) {
        helpWindow.focus();
        if (sectionId && helpWindowApi) helpWindowApi.setSection(sectionId);
        return true;
    }

    const w = window.open("", "enrollinator-help",
        "popup=yes,width=1040,height=840,menubar=no,toolbar=no,location=no,status=no");
    if (!w) return false;
    helpWindow = w;

    const doc = w.document;
    doc.open();
    doc.write('<!doctype html><html><head><meta charset="utf-8">' +
              "<title>Profile Builder help</title></head><body></body></html>");
    doc.close();

    // Same stylesheet, same rules — the panel looks identical to the modal.
    const style = doc.createElement("style");
    style.textContent = [...document.querySelectorAll("style")]
        .map(s => s.textContent).join("\n");
    doc.head.appendChild(style);
    doc.body.className = "help-window";

    helpWindowApi = mountHelpCentre(doc, {
        sectionId,
        popped: true,
        onClose: () => w.close(),
        onTour: () => {
            // The tour belongs to the builder window; raise it and run it there.
            try { window.focus(); } catch (e) { /* focus refused — still runs */ }
            showGettingStarted();
        }
    });
    doc.body.appendChild(helpWindowApi.modal);

    syncHelpWindow();
    w.addEventListener("resize", syncHelpWindow);
    w.addEventListener("pagehide", () => { helpWindow = null; helpWindowApi = null; });
    // Esc closes it, matching the modal it came from.
    doc.addEventListener("keydown", e => { if (e.key === "Escape") w.close(); });

    setTimeout(() => { try { w.focus(); helpWindowApi.focusSearch(); } catch (e) {} }, 40);
    return true;
}

document.getElementById("help-btn").addEventListener("click", () => showHelpCenter());
// A stranded help window outlives its builder awkwardly — it can't run the
// tour, and reloading the builder would orphan a second one.
window.addEventListener("pagehide", () => {
    if (helpWindowOpen()) helpWindow.close();
});

// Fleet context: restore it, paint the header chip, and make the chip a way
// back into setup.
loadFleetPrefs();
refreshFleetChip();
document.getElementById("fleet-btn").addEventListener("click", () => showFleetSetup());

// The launcher comes first and routes from there: new configs get the
// deployment questions, imported ones and the sample answer them on their own.
if (!prefGet(WELCOME_KEY)) showWelcome();
else if (!fleet.configured) showFleetSetup({ firstRun: true });

// Per-button proximity reveal for the between-step "+ insert" affordances.
// Toggles .proximity-active on each .step-insert-btn whose centre is within
// 50 px of the cursor.  Throttled to one update per animation frame.
(function installInsertProximity() {
    const RADIUS = 50;
    const RADIUS_SQ = RADIUS * RADIUS;
    let pending = false;
    let lastX = 0, lastY = 0;
    document.addEventListener("mousemove", e => {
        lastX = e.clientX; lastY = e.clientY;
        if (pending) return;
        pending = true;
        requestAnimationFrame(() => {
            pending = false;
            document.querySelectorAll(".step-insert-btn").forEach(btn => {
                const r = btn.getBoundingClientRect();
                const dx = lastX - (r.left + r.width / 2);
                const dy = lastY - (r.top  + r.height / 2);
                btn.classList.toggle("proximity-active", dx * dx + dy * dy <= RADIUS_SQ);
            });
        });
    });
    // When the cursor leaves the window, hide all of them.
    document.addEventListener("mouseleave", () => {
        document.querySelectorAll(".step-insert-btn.proximity-active")
            .forEach(b => b.classList.remove("proximity-active"));
    });
})();

renderCanvas();
updatePreview();

// ---- preview collapse toggle
(function() {
    const btn    = document.getElementById("preview-toggle");
    const pane   = document.getElementById("preview-pane");
    const handle = document.getElementById("resize-handle");
    const mainEl = document.querySelector("main");

    btn.addEventListener("click", e => {
        e.stopPropagation(); // don't trigger resize-handle mousedown
        const isCollapsed = pane.classList.toggle("collapsed");
        handle.classList.toggle("collapsed", isCollapsed);
        if (isCollapsed) {
            pane._savedCols = mainEl.style.gridTemplateColumns || "";
            mainEl.style.gridTemplateColumns = "1fr 5px 0px";
            btn.textContent = "‹";
            btn.setAttribute("data-tooltip", "Expand preview");
            btn.title = "Expand preview";
        } else {
            mainEl.style.gridTemplateColumns = pane._savedCols || "";
            btn.textContent = "›";
            btn.setAttribute("data-tooltip", "Collapse preview");
            btn.title = "Collapse preview";
        }
    });
})();

// ---- visual preview: fold away, and drag its lower edge to resize
(function() {
    const pane   = document.getElementById("vis-pane");
    const header = document.getElementById("vis-header");
    const btn    = document.getElementById("vis-collapse");
    const stage  = document.getElementById("vis-stage");
    const handle = document.getElementById("vis-resize");

    function applyVis() {
        pane.classList.toggle("collapsed", display.visCollapsed);
        btn.textContent = display.visCollapsed ? "▸" : "▾";
        btn.title = display.visCollapsed ? "Show the visual preview" : "Hide the visual preview";
        stage.style.setProperty("--vis-h", display.visHeight + "px");
    }
    applyVis();

    // The whole header toggles: a 16px chevron is a small target for something
    // you flip this often.
    header.addEventListener("click", () => {
        display.visCollapsed = !display.visCollapsed;
        saveDisplayPrefs();
        applyVis();
    });

    let active = false, startY = 0, startH = 0;
    handle.addEventListener("mousedown", e => {
        active = true;
        startY = e.clientY;
        startH = display.visHeight;
        handle.classList.add("resizing");
        document.body.style.cursor = "row-resize";
        document.body.style.userSelect = "none";
        e.preventDefault();
    });
    document.addEventListener("mousemove", e => {
        if (!active) return;
        // clientY is real viewport px; --vis-h is body-local. See the note at
        // the top of the stylesheet.
        const dy = (e.clientY - startY) / effectiveScale();
        display.visHeight = Math.max(160, Math.min(startH + dy, localViewport().height - 220));
        stage.style.setProperty("--vis-h", display.visHeight + "px");
    });
    document.addEventListener("mouseup", () => {
        if (!active) return;
        active = false;
        handle.classList.remove("resizing");
        document.body.style.cursor = "";
        document.body.style.userSelect = "";
        saveDisplayPrefs();
        visLayout();
    });

    // The windows are sized against the mock screen, so any change to how much
    // room the stage has — dragging the divider, resizing the browser, folding
    // the XML back open — has to re-run the sizing pass. It only writes styles
    // that don't affect the stage's own box, so this cannot feed back.
    if (window.ResizeObserver) {
        new ResizeObserver(() => visLayout()).observe(stage);
    }
})();

// ---- XML preview: folded by default, unfolds from its header
(function() {
    const header = document.getElementById("xml-header");
    const btn    = document.getElementById("xml-collapse");

    function applyXml() {
        document.body.classList.toggle("xml-collapsed", display.xmlCollapsed);
        btn.textContent = display.xmlCollapsed ? "▸" : "▾";
        btn.title = display.xmlCollapsed ? "Show the XML" : "Hide the XML";
        visLayout();
    }
    applyXml();

    header.addEventListener("click", () => {
        display.xmlCollapsed = !display.xmlCollapsed;
        saveDisplayPrefs();
        applyXml();
    });
})();

// ---- resize handle
(function() {
    const handle = document.getElementById("resize-handle");
    const mainEl = document.querySelector("main");
    let active = false, startX = 0, startW = 0;
    handle.addEventListener("mousedown", e => {
        if (handle.classList.contains("collapsed")) return;
        active = true;
        startX = e.clientX;
        // Local px throughout: grid-template-columns is interpreted in the
        // zoomed body's own units, while clientX arrives in real viewport px.
        startW = localRect(document.getElementById("canvas")).width;
        handle.classList.add("resizing");
        document.body.style.cursor = "col-resize";
        document.body.style.userSelect = "none";
        e.preventDefault();
    });
    document.addEventListener("mousemove", e => {
        if (!active) return;
        const dx = (e.clientX - startX) / effectiveScale();
        const w = Math.max(320, Math.min(startW + dx, localViewport().width - 220));
        mainEl.style.gridTemplateColumns = `${w}px 5px 1fr`;
        display.previewResized = true;
    });
    document.addEventListener("mouseup", () => {
        if (!active) return;
        active = false;
        handle.classList.remove("resizing");
        document.body.style.cursor = "";
        document.body.style.userSelect = "";
    });
})();
</script>
