/** The questions for a catalogue entry, or [] when it has none (Blank step,
 *  and anything at all in advanced mode). */
function guideFor(entry) {
    if (!guidedMode()) return [];
    if (entry.guide) return entry.guide();
    const make = STEP_GUIDES[entry.id];
    return make ? make() : [];
}

/** Turn an MDM_PRESETS verb into a catalogue recipe. Only verbs carrying a
 *  stepName qualify — the rest stay available through the Action tab picker. */
function recipeFromVerb(source, verb) {
    return {
        id: `${source.id}:${verb.id}`,
        group: "install",
        glyph: source.icon || "⚙️",
        name: verb.stepName,
        desc: verb.catalogDesc || verb.note || "",
        build() {
            const st = blankStep();
            st.Name = verb.stepName;
            st.Icon = verb.icon || "";
            st.Action = blankAction("shell");
            st.Action.Command = assembleMdmCommand(verb, {});
            st.Action.TimeoutSeconds = verb.timeout || null;
            // Pre-seed the picker's transient keys so the Action tab opens on
            // the right source and verb instead of re-inferring from the
            // placeholder-laden command.
            st.Action._mdmId = source.id;
            st.Action._verbId = verb.id;
            st.Action._fields = {};
            return st;
        },
        // One question per placeholder the command template leaves open, then
        // the name. A verb with no placeholders (recon, Rosetta) asks only for
        // the name — there is genuinely nothing else to decide.
        guide: () => [
            ...verb.fields.map(f => ({
                id: f.key,
                ask: f.ask || `What should “${f.label}” be?`,
                hint: f.guideHint || verb.note || "",
                type: "text",
                placeholder: (f.placeholder || "").replace(/^e\.g\.\s*/, ""),
                get: st => (st.Action._fields || {})[f.key] || "",
                set: (st, v) => {
                    if (!st.Action._fields) st.Action._fields = {};
                    st.Action._fields[f.key] = v;
                    st.Action.Command = assembleMdmCommand(verb, st.Action._fields);
                }
            })),
            nameQuestion()
        ]
    };
}

/** Every recipe on offer, ordered so the fleet's own tooling comes first. */
function catalogEntries() {
    const fromVerbs = [];
    for (const source of visibleSources(null)) {
        if (source.kind === "custom") continue;
        for (const verb of source.verbs) {
            if (verb.stepName) fromVerbs.push(recipeFromVerb(source, verb));
        }
    }
    // The fleet's MDM leads, then its extra tooling, then macOS built-ins.
    const rank = s => s === fleet.mdm ? 0 : (fleet.tools.includes(s) ? 1 : 2);
    fromVerbs.sort((a, b) => rank(a.id.split(":")[0]) - rank(b.id.split(":")[0]));
    return [...fromVerbs, ...STEP_RECIPES];
}

function openStepCatalog(pIdx, insertIdx) {
    const root = document.getElementById("modal-root");
    root.innerHTML = "";

    const entries = catalogEntries();
    let query = "";

    const bodyEl = h("div", { class: "cat-body" });

    function commit(entry) {
        const st = entry.build();
        const questions = guideFor(entry);
        if (questions.length) {
            runGuidedStep(pIdx, insertIdx, entry, st, questions);
        } else {
            // Advanced mode, or a recipe with nothing left to ask (Blank step).
            insertBuiltStep(pIdx, insertIdx, st);
            ui.pendingStep = { pIdx, sIdx: insertIdx };
            // Open on whichever tab still holds the field worth filling in.
            // Recipes name it explicitly; otherwise Action if there is one.
            openStepEditor(pIdx, insertIdx, entry.tab || (st.Action ? "action" : "info"));
        }
    }

    function paint() {
        bodyEl.innerHTML = "";
        const q = query.trim().toLowerCase();
        const matches = entries.filter(e => !q ||
            e.name.toLowerCase().includes(q) ||
            e.desc.toLowerCase().includes(q));

        if (!matches.length) {
            bodyEl.appendChild(h("div", { class: "cat-empty" },
                "Nothing matches — try \"Blank step\" and build it by hand."));
            return;
        }

        for (const group of CATALOG_GROUPS) {
            const inGroup = matches.filter(e => e.group === group.id);
            if (!inGroup.length) continue;
            const grid = h("div", { class: "cat-grid" });
            for (const entry of inGroup) {
                grid.appendChild(h("button", {
                    class: "cat-card",
                    onclick: () => commit(entry)
                },
                    h("span", { class: "cat-card-icon" }, entry.glyph),
                    h("span", { class: "cat-card-text" },
                        h("span", { class: "cat-card-name" }, entry.name),
                        entry.desc ? h("span", { class: "cat-card-desc" }, entry.desc) : null
                    )
                ));
            }
            bodyEl.appendChild(h("div", { class: "cat-group" },
                h("div", { class: "cat-group-title" }, group.label),
                grid
            ));
        }
    }
    paint();

    const search = h("input", {
        type: "text", class: "cat-search",
        placeholder: "Search — install, wait, dialog, video…",
        oninput: e => { query = e.target.value; paint(); }
    });

    const backdrop = h("div", { class: "modal-backdrop",
        onclick: e => { if (e.target === backdrop) closeModal(); } });
    const modal = h("div", { class: "modal cat-modal" },
        h("div", { class: "modal-header" },
            h("div", { class: "modal-title" }, "Add a step"),
            h("button", { class: "btn", onclick: closeModal }, "Close")),
        h("div", { class: "cat-search-row" }, search),
        bodyEl
    );
    backdrop.appendChild(modal);
    root.appendChild(backdrop);
    setTimeout(() => search.focus(), 40);
}

/** Splice a built step into a playbook, giving it a unique readable ID derived
 *  from its name so branch targets and add-on dedup have something to hold
 *  onto immediately. */
function insertBuiltStep(pIdx, insertIdx, st) {
    const profile = state.Playbooks[pIdx];
    const used = new Set(profile.Steps.map(s => s.Id).filter(Boolean));
    const base = (st.Name || "step").toLowerCase()
        .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "step";
    let id = base, n = 2;
    while (used.has(id)) id = `${base}-${n++}`;
    st.Id = id;
    profile.Steps.splice(insertIdx, 0, st);
    return st;
}

// ============================================================================
// Guided step runner — one question per screen.
//
// The step is built up in memory and only spliced into the playbook at the
// end, so abandoning the flow leaves nothing behind. "Open the full editor"
// inserts it early and hands over mid-flight with every answer so far applied,
// which is what keeps guided mode a shortcut rather than a walled garden.
// ============================================================================

function runGuidedStep(pIdx, insertIdx, entry, st, questions) {
    const root = document.getElementById("modal-root");
    let i = 0;

    /** Questions may compute their ask/get/set from answers given earlier. */
    function resolve(q) {
        return q.dynamic ? Object.assign({}, q, q.dynamic(st)) : q;
    }

    function finish() {
        insertBuiltStep(pIdx, insertIdx, st);
        ui.pendingStep = null;
        closeModal();
        renderCanvas();
        updatePreview();
    }

    function handOff() {
        insertBuiltStep(pIdx, insertIdx, st);
        ui.pendingStep = { pIdx, sIdx: insertIdx };
        openStepEditor(pIdx, insertIdx, entry.tab || (st.Action ? "action" : "info"));
    }

    function paint() {
        const q = resolve(questions[i]);
        const isLast = i === questions.length - 1;
        root.innerHTML = "";

        // Progress bar: one segment per question.
        const progress = h("div", { class: "guide-progress" },
            ...questions.map((_, n) => h("div", {
                class: "guide-dot" + (n < i ? " done" : n === i ? " active" : "")
            }))
        );

        let readValue;
        const body = h("div", { class: "guide-body" },
            h("div", { class: "guide-count" }, `Question ${i + 1} of ${questions.length}`),
            h("h2", { class: "guide-q" }, q.ask),
            q.hint ? h("p", { class: "guide-hint" }, q.hint) : null
        );

        if (q.type === "choice") {
            let picked = q.get(st) || (q.choices[0] && q.choices[0].value);
            const wrap = h("div", { class: "guide-choices" });
            const paintChoices = () => {
                wrap.innerHTML = "";
                for (const c of q.choices) {
                    wrap.appendChild(h("button", {
                        class: "guide-choice" + (picked === c.value ? " selected" : ""),
                        onclick: () => { picked = c.value; paintChoices(); }
                    },
                        h("span", { class: "guide-choice-label" }, c.label),
                        c.desc ? h("span", { class: "guide-choice-desc" }, c.desc) : null
                    ));
                }
            };
            paintChoices();
            body.appendChild(wrap);
            readValue = () => picked;
        } else if (q.type === "textarea") {
            const ta = h("textarea", { placeholder: q.placeholder || "" }, q.get(st) || "");
            body.appendChild(ta);
            readValue = () => ta.value;
            setTimeout(() => ta.focus(), 40);
        } else if (q.type === "number") {
            const raw = q.get(st);
            const input = h("input", { type: "number", min: "0",
                placeholder: q.placeholder || "",
                value: raw == null ? "" : String(raw) });
            body.appendChild(input);
            readValue = () => {
                const n = parseInt(input.value, 10);
                return Number.isFinite(n) ? n : null;
            };
            setTimeout(() => { input.focus(); input.select(); }, 40);
        } else {
            const input = h("input", { type: "text",
                placeholder: q.placeholder || "", value: q.get(st) || "" });
            body.appendChild(input);
            readValue = () => input.value.trim();
            setTimeout(() => { input.focus(); input.select(); }, 40);
        }

        function advance() {
            const v = readValue();
            if (q.set) q.set(st, v);
            if (isLast) finish();
            else { i++; paint(); }
        }

        // Enter advances from single-line fields; a textarea keeps Enter for
        // newlines, since these messages are Markdown and want them.
        body.addEventListener("keydown", e => {
            if (e.key !== "Enter") return;
            if (e.target.tagName === "TEXTAREA" && !(e.metaKey || e.ctrlKey)) return;
            e.preventDefault();
            advance();
        });

        const nextBtn = h("button", { class: "btn primary",
            style: "height:34px;padding:0 18px;font-size:13px",
            onclick: advance
        }, isLast ? "Add step" : "Next");

        const footer = h("div", { class: "guide-footer" },
            h("button", { class: "guide-escape", onclick: handOff },
                "Open the full editor"),
            h("div", { class: "guide-nav" },
                q.optional ? h("button", {
                    class: "btn", style: "height:34px;padding:0 14px;font-size:13px",
                    onclick: () => {
                        // Skip still writes, so an emptied optional field can
                        // clear what a previous pass set.
                        if (q.set) q.set(st, q.type === "number" ? null : "");
                        if (isLast) finish(); else { i++; paint(); }
                    }
                }, "Skip") : null,
                i > 0 ? h("button", {
                    class: "btn", style: "height:34px;padding:0 14px;font-size:13px",
                    onclick: () => { i--; paint(); }
                }, "Back") : null,
                nextBtn
            )
        );

        const backdrop = h("div", { class: "modal-backdrop",
            onclick: e => { if (e.target === backdrop) closeModal(); } });
        const modal = h("div", { class: "modal guide-modal" },
            h("div", { class: "modal-header" },
                h("div", { class: "modal-title" },
                    "Add a step",
                    h("span", { class: "pill" }, entry.name)),
                h("button", { class: "btn", onclick: closeModal }, "Cancel")),
            progress, body, footer
        );
        backdrop.appendChild(modal);
        root.appendChild(backdrop);
    }

    paint();
}

// ============================================================================
// Modal: step editor — tabbed (Info / Action / Conditions / Behavior)
// ============================================================================

const STEP_TABS = [
    { id: "info",       label: "Info" },
    { id: "action",     label: "Action" },
    { id: "conditions", label: "Conditions" },
    { id: "behavior",   label: "Behavior" },
];

/** @param {string} [tab] — which tab to land on. Defaults to Info; the
 *  catalogue passes "action" so a recipe opens on the part still to fill in. */
function openStepEditor(pIdx, sIdx, tab) {
    const p = state.Playbooks[pIdx];
    const st = p.Steps[sIdx];
    if (!st) return;
    ui.openStep = { pIdx, sIdx };
    ui.stepTab = STEP_TABS.some(t => t.id === tab) ? tab : "info";
    // Clone into draft on a fresh open. reopenStep() may call back here when
    // the modal DOM was torn down; preserve any edits already in the draft.
    if (!ui.draftStep) ui.draftStep = deepClone(st);

    const root = document.getElementById("modal-root");
    root.innerHTML = "";

    const draft = ui.draftStep;
    const tabBar = h("div", { class: "modal-tab-bar" },
        ...STEP_TABS.map(t => {
            let badge = null;
            if (t.id === "action" && draft.Action)
                badge = h("span", { class: "tab-badge" }, draft.Action.Type);
            if (t.id === "conditions" && draft.Conditions.length)
                badge = h("span", { class: "tab-badge" }, String(draft.Conditions.length));
            return h("button", {
                class: "modal-tab" + (ui.stepTab === t.id ? " active" : ""),
                "data-tab": t.id,
                onclick: () => {
                    ui.stepTab = t.id;
                    document.querySelectorAll(".modal-tab-bar .modal-tab")
                        .forEach(el => el.classList.toggle("active", el.dataset.tab === t.id));
                    renderStepBody();
                }
            }, t.label, badge);
        })
    );

    const body = h("div", { class: "modal-body", id: "step-modal-body" });

    const modal = h("div", { class: "modal" },
        h("div", { class: "modal-header" },
            h("div", { class: "modal-title" },
                "Step",
                h("span", { class: "pill" }, draft.Name || draft.Id || `#${sIdx + 1}`)
            ),
            h("button", { class: "btn", onclick: closeModal }, "Close")
        ),
        tabBar,
        body,
        h("div", { class: "modal-footer" },
            btn("Delete step", () => {
                if (!confirm(`Delete step "${draft.Name || draft.Id || "untitled"}"?`)) return;
                ui.pendingStep = null; // prevent closeModal from double-removing
                ui.draftStep = null;
                p.Steps.splice(sIdx, 1);
                closeModal(); renderCanvas(); updatePreview();
            }, "danger"),
            btn("Done", () => {
                // Commit draft → live state.
                const { pIdx: _pi, sIdx: _si } = ui.openStep;
                state.Playbooks[_pi].Steps[_si] = deepClone(ui.draftStep);
                ui.draftStep = null;
                ui.pendingStep = null;
                closeModal(); renderCanvas(); updatePreview();
            }, "primary")
        )
    );

    const backdrop = h("div", { class: "modal-backdrop" });
    backdrop.appendChild(modal);
    root.appendChild(backdrop);
    renderStepBody();
}

function renderStepBody() {
    if (!ui.openStep || !ui.draftStep) return;
    const st = ui.draftStep;
    const body = document.getElementById("step-modal-body");
    if (!body) return;
    body.innerHTML = "";
    switch (ui.stepTab) {
        case "info":       body.appendChild(renderStepInfoTab(st)); break;
        case "action":     body.appendChild(renderStepActionTab(st)); break;
        case "conditions": body.appendChild(renderStepConditionsTab(st)); break;
        case "behavior":   body.appendChild(renderStepBehaviorTab(st)); break;
    }
    // Refresh tab badges from the draft.
    document.querySelectorAll(".modal-tab-bar .modal-tab").forEach(el => {
        const tid = el.dataset.tab;
        let badge = el.querySelector(".tab-badge");
        if (tid === "action") {
            if (st.Action && !badge) {
                badge = h("span", { class: "tab-badge" }, st.Action.Type);
                el.appendChild(badge);
            } else if (st.Action && badge) {
                badge.textContent = st.Action.Type;
            } else if (!st.Action && badge) {
                badge.remove();
            }
        }
        if (tid === "conditions") {
            if (st.Conditions.length && !badge) {
                badge = h("span", { class: "tab-badge" }, String(st.Conditions.length));
                el.appendChild(badge);
            } else if (st.Conditions.length && badge) {
                badge.textContent = String(st.Conditions.length);
            } else if (!st.Conditions.length && badge) {
                badge.remove();
            }
        }
    });
}

function reopenStep() {
    if (!ui.openStep) return;
    if (document.getElementById("step-modal-body")) {
        renderStepBody();
        return;
    }
    const { pIdx, sIdx } = ui.openStep;
    // Preserve the open tab — rebuilding the modal must not bounce the user
    // back to Info mid-edit.
    openStepEditor(pIdx, sIdx, ui.stepTab);
}

function refreshIconEl(el, st) {
    el.innerHTML = "";
    if (st.Icon) {
        if (/^https?:\/\//i.test(st.Icon)) {
            el.appendChild(h("img", { src: st.Icon, alt: "" })); return;
        }
        if (/^SF=/i.test(st.Icon)) { el.textContent = "SF"; el.title = st.Icon; return; }
        el.textContent = "📦"; el.title = st.Icon; return;
    }
    el.textContent = (st.Name || st.Id || "?").trim().charAt(0).toUpperCase() || "?";
}

// ---- Inline branch block rendered in the flow --------------------------------

function renderBranchBlock(st, pIdx, sIdx, steps) {
    const branchKey = `${pIdx}:${sIdx}`;

    function makeSelect(currentValue, opts) {
        // opts: array of { value, label, group? }
        const sel = h("select", { class: "branch-inline-select" });
        let grp = null;
        opts.forEach(o => {
            if (o.group !== undefined) {
                grp = document.createElement("optgroup");
                grp.label = o.group;
                sel.appendChild(grp);
                return;
            }
            const opt = document.createElement("option");
            opt.value = o.value;
            opt.textContent = o.label;
            (grp || sel).appendChild(opt);
        });
        sel.value = currentValue || "";
        return sel;
    }

    function stepOptions(skipSelf) {
        const opts = [];
        opts.push({ group: "Jump to step" });
        steps.forEach((s, i) => {
            if (i === skipSelf) return;
            opts.push({
                value: s.Id || `step-${i}`,
                label: `${i + 1}. ${s.Name || s.Id || `(step ${i + 1})`}`
            });
        });
        return opts;
    }

    // Success select: default = next step
    const successOpts = [
        { value: "", label: "▶ Continue to next step" },
        { value: "$end", label: "⏹ End run" },
        ...stepOptions(sIdx)
    ];
    const successSel = makeSelect(st.OnSuccess, successOpts);
    successSel.addEventListener("change", e => {
        st.OnSuccess = e.target.value;
        if (st.OnSuccess || st.OnFailure) ui.expandedBranches.add(branchKey);
        renderCanvas(); updatePreview();
    });

    // Failure options mirror successOpts.  "" and "$next" used to coexist
    // here but at runtime they're identical (both do i+=1 in the main loop)
    // — and "Stop run" was mislabelled (nothing actually stops the run on
    // OnFailure="", any_fail just gets set for the final exit code).  Drop
    // "$next" and relabel "" so the two dropdowns read in parallel.
    const failureOpts = [
        { value: "",     label: "▶ Continue to next step" },
        { value: "$end", label: "⏹ End run" },
        ...stepOptions(sIdx)
    ];
    const failureSel = makeSelect(st.OnFailure, failureOpts);
    failureSel.addEventListener("change", e => {
        st.OnFailure = e.target.value;
        if (st.OnSuccess || st.OnFailure) ui.expandedBranches.add(branchKey);
        renderCanvas(); updatePreview();
    });

    function removeBtn() {
        return h("button", {
            class: "branch-remove-btn",
            title: "Remove branch",
            onclick: e => {
                e.stopPropagation();
                st.OnSuccess = "";
                st.OnFailure = "";
                ui.expandedBranches.delete(branchKey);
                renderCanvas(); updatePreview();
            }
        }, "✕");
    }

    return h("div", { class: "branch-block" },
        h("div", { class: "branch-block-spine" }),
        h("div", { class: "branch-block-body" },
            h("div", { class: "branch-block-header" },
                h("span", { class: "branch-block-title" }, "⎇ If / Else"),
                h("span", { class: "branch-block-subtitle" }, "Choose where to go based on this step's outcome"),
                removeBtn()
            ),
            h("div", { class: "branch-row success" },
                h("span", { class: "branch-row-label success" }, "✓ If succeeds"),
                successSel
            ),
            h("div", { class: "branch-row failure" },
                h("span", { class: "branch-row-label failure" }, "✗ If fails"),
                failureSel
            )
        )
    );
}

function renderWaitWindowFields(st) {
    if (!st.WaitWindow) {
        return [hint("A secondary swiftDialog window shown while polling. Recommended for blocking steps with a multi-step user workflow.")];
    }
    const ww = st.WaitWindow;
    // Normalize any legacy plain-string entries in-place before rendering
    ww.Slideshow = (ww.Slideshow || []).map(normalizeSlide);

    // Derive or restore media mode (transient — ignored by serializer)
    if (!ww._mediaMode) {
        ww._mediaMode = ww.Video ? "video" : (ww.Slideshow.length > 0 ? "slideshow" : "off");
    }
    const mode = ww._mediaMode;

    function switchWwMode(val) {
        if      (val === "off")       { ww.Video = ""; ww.Slideshow = []; }
        else if (val === "slideshow") { ww.Video = ""; }
        else if (val === "video")     { ww.Slideshow = []; }
        ww._mediaMode = val;
        updatePreview(); reopenStep();

    // Segmented media picker
    const mediaModes = [["off", "None"], ["slideshow", "Slideshow"], ["video", "Video"]];

        ...mediaModes.map(([val, label], idx) =>

                class: "btn" + (mode === val ? " btn--active" : ""),
                style: "border-radius:0;border:none;" + (idx < mediaModes.length - 1 ? "border-right:1px solid var(--border);" : ""),
                onclick: () => switchWwMode(val)
            }, label)
        )
    );

    // Slideshow frame editor
    const slidesWrap = h("div", { style: "display:flex;flex-direction:column;gap:8px;margin-top:8px" });
    if (ww.Slideshow.length === 0)
        slidesWrap.appendChild(hint("No frames. Add one for a still image; 2+ for a user-clicked slideshow."));
    ww.Slideshow.forEach((slide, i) => {
        slidesWrap.appendChild(h("div", {

                btn("↑", () => { move(ww.Slideshow, i, -1); reopenStep(); }, "icon"),
                btn("↓", () => { move(ww.Slideshow, i,  1); reopenStep(); }, "icon"),
                btn("✕", () => { ww.Slideshow.splice(i, 1); reopenStep(); updatePreview(); }, "danger")
            ),
            row("Image", h("input", { type: "text", value: slide.Image || "",
                placeholder: "/path/img.png or https://…", style: "flex:1",

            row("Title", h("input", { type: "text", value: slide.Title || "",
                placeholder: "Overrides window title for this slide (optional)",
                oninput: e => { slide.Title = e.target.value; } })),
            row("Message", h("textarea", {
                placeholder: "Overrides message for this slide (Markdown, optional)",
                oninput: e => { slide.Message = e.target.value; }
            }, slide.Message || ""))
        ));
    });
    slidesWrap.appendChild(btn("+ Add frame", () => {
        ww.Slideshow.push({ Image: "", Title: "", Message: "" }); reopenStep();
    }));

    // Video URL + autoplay
    const wwVideoInput = h("input", { type: "text", value: ww.Video || "",
        placeholder: "/path/video.mp4, https://… or YouTube URL", style: "flex:1",
        oninput: e => { ww.Video = e.target.value; updatePreview(); } });
    const wwAutoplayBtn = h("button", {
        class: "btn" + (ww.VideoAutoplay === true ? " btn--active" : ""),
        style: "white-space:nowrap;flex-shrink:0",
        onclick: () => { ww.VideoAutoplay = ww.VideoAutoplay === true ? null : true; updatePreview(); reopenStep(); }
    }, "▶ Autoplay");
    const wwVideoSection = h("div", { style: "display:flex;gap:6px;align-items:center;margin-top:8px" },
        wwVideoInput, wwAutoplayBtn
    );

    return [
        row("Title",   textInput(ww.Title, v => ww.Title = v, "Defaults to step name")),
        row("Message", h("textarea", {
            oninput: e => { ww.Message = e.target.value; updatePreview(); },
            placeholder: "Markdown body."
        }, ww.Message || "")),
        row("Font sizes",
            h("div", { style: "display:flex;gap:8px;align-items:center" },
                h("span", { style: "font-size:11px;color:var(--text-4);white-space:nowrap" }, "Title"),
                h("input", { type: "number", min: "0", style: "width:58px",
                    value: ww.TitleFontSize == null ? "" : String(ww.TitleFontSize), placeholder: "default",
                    oninput: e => { const v = parseInt(e.target.value, 10); ww.TitleFontSize = Number.isFinite(v) ? v : null; updatePreview(); } }),
                h("span", { style: "font-size:11px;color:var(--text-4);white-space:nowrap;margin-left:4px" }, "Body"),

            )
        ),
        row("Size",
            h("div", { style: "display:flex;gap:8px;align-items:center" },
                h("span", { style: "font-size:11px;color:var(--text-4);white-space:nowrap" }, "W"),
                h("input", { type: "number", min: "0", style: "width:62px",
                    value: ww.Width == null ? "" : String(ww.Width), placeholder: "520",
                    oninput: e => { const v = parseInt(e.target.value, 10); ww.Width = Number.isFinite(v) ? v : null; updatePreview(); } }),
                h("span", { style: "font-size:11px;color:var(--text-4);white-space:nowrap;margin-left:4px" }, "H"),
                h("input", { type: "number", min: "0", style: "width:62px",
                    value: ww.Height == null ? "" : String(ww.Height), placeholder: "420",
                    oninput: e => { const v = parseInt(e.target.value, 10); ww.Height = Number.isFinite(v) ? v : null; updatePreview(); } })
            )
        ),
        h("div", { class: "pair-row" },
            row("Blur screen",   triStateSelect(ww.Blur,        v => { ww.Blur        = v; updatePreview(); })),
            row("Always on top", triStateSelect(ww.AlwaysOnTop, v => { ww.AlwaysOnTop = v; updatePreview(); }))
        ),
        row("Media", h("div", null,
            mediaPicker,
            ...(mode === "slideshow" ? [slidesWrap]    : []),
            ...(mode === "video"     ? [wwVideoSection] : [])
        ))
    ];
}

function actionFields(a) {
    if (a.Type === "noop") {
        return [hint("The noop action always succeeds — useful for condition-only steps.")];
    }
    if (a.Type === "shell") {
        // Infer MDM/verb from existing command on first render
        if (a._mdmId === undefined) {
            const match = inferMdmSelection(a.Command);
            if (match) {
                a._mdmId = match.mdmId;
                a._verbId = match.verbId;
                a._fields = match.fields;
            } else {
                a._mdmId = a.Command ? "custom" : null;
                a._verbId = null;
                a._fields = {};
            }
        }

        const rows = [];
        // Narrowed to the fleet's own tooling — but always including whatever
        // this action already uses, so an imported config never edits against
        // a picker that has hidden its own source.
        const sources = visibleSources(a._mdmId);
        const mdmOptions = [["", "— Select MDM / source —"], ...sources.map(m => [m.id, m.label])];
        rows.push(row("MDM / source",
            selectInput(a._mdmId || "", mdmOptions, v => {
                a._mdmId = v || null;
                a._verbId = null;
                a._fields = {};
                if (!v || v === "custom") {
                    a.Command = "";
                    a.TimeoutSeconds = null;
                } else {
                    const mdm = MDM_PRESETS.find(m => m.id === v);
                    if (mdm && mdm.verbs.length === 1) {
                        a._verbId = mdm.verbs[0].id;
                        a.TimeoutSeconds = mdm.verbs[0].timeout;
                        a.Command = assembleMdmCommand(mdm.verbs[0], {});
                    }
                }
                reopenStep(); updatePreview();
            }),
            ...(sourcesAreFiltered(a._mdmId) ? [
                h("div", { class: "source-filter-note" },
                    // "Narrowed to" rather than an exhaustive list: a step
                    // carrying a source from outside the fleet keeps it in the
                    // dropdown, so naming only the rule stays accurate.
                    h("span", null,
                        `Narrowed to ${sourceById(fleet.mdm).label}, macOS built-ins and your tooling.`),
                    h("button", {
                        onclick: () => {
                            fleet.showAllSources = true;
                            saveFleetPrefs();
                            reopenStep();
                        }
                    }, "Show all sources"))
            ] : []),
            ...(fleet.showAllSources && fleet.mdm ? [
                h("div", { class: "source-filter-note" },
                    h("span", null, "Showing every source."),
                    h("button", {
                        onclick: () => {
                            fleet.showAllSources = false;
                            saveFleetPrefs();
                            reopenStep();
                        }
                    }, `Narrow to ${sourceById(fleet.mdm).label}`))
            ] : [])
        ));

        const activeMdm = MDM_PRESETS.find(m => m.id === a._mdmId);

        if (activeMdm && activeMdm.id !== "custom" && activeMdm.verbs.length > 0) {
            const verbOptions = [["", "— Select action —"], ...activeMdm.verbs.map(v => [v.id, v.label])];
            rows.push(row("Action",
                selectInput(a._verbId || "", verbOptions, v => {
                    a._verbId = v || null;
                    a._fields = {};
                    const verb = activeMdm.verbs.find(vb => vb.id === v);
                    if (verb) {
                        a.TimeoutSeconds = verb.timeout;
                        a.Command = assembleMdmCommand(verb, {});
                    } else {
                        a.Command = "";
                    }
                    reopenStep(); updatePreview();
                })
            ));
        }

        const activeVerb = activeMdm && activeMdm.verbs.find(v => v.id === a._verbId);

        if (activeVerb && activeVerb.fields.length > 0) {

function move(arr, i, dir) {
    const j = i + dir;
    if (j < 0 || j >= arr.length) return;
    [arr[i], arr[j]] = [arr[j], arr[i]];
    updatePreview();
}

function updatePreview() {
    const el = document.getElementById("preview");
    const status = document.getElementById("preview-status");
    try {
        const xml = serializeMobileconfig(state);
        el.textContent = xml;
        const doc = new DOMParser().parseFromString(xml, "application/xml");
        if (doc.querySelector("parsererror")) throw new Error("XML parse error");
        status.textContent = "valid";
        status.classList.remove("error");
    } catch (e) {
        el.textContent = `Serialization error: ${e.message}`;
        status.textContent = "error";
        status.classList.add("error");
    }
}

function triggerDownload(xml, fname, mime) {
    const blob = new Blob([xml], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = fname;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
}

function downloadMobileconfig() {
    const base = state.outer.PayloadIdentifier || "enrollinator";
    triggerDownload(serializeMobileconfig(state), base + ".mobileconfig",
                    "application/x-apple-aspen-config");
}

function downloadBareXml() {
    const base = state.outer.PayloadIdentifier || "enrollinator";
    triggerDownload(serializeBareXml(state), base + ".plist", "application/xml");
}

// ---------------------------------------------------------------- upstream
// Fetching the runtime straight from the repo saves a trip to GitHub when
// you're standing up a new deployment: profile, script, package and daemon
// all come from the one menu.
const ENROLLINATOR_REPO = "iamalexepstein/Enrollinator-macOS";
const ENROLLINATOR_RELEASES = `https://github.com/${ENROLLINATOR_REPO}/releases/latest`;

/** Path inside the repo, read at a specific ref. Always a release tag here —
 *  never `main`, which runs ahead of the newest tag between releases. */
function enrollinatorRawUrl(ref, path) {
    return `https://raw.githubusercontent.com/${ENROLLINATOR_REPO}/${ref}/${path}`;
}

/** The newest release, fetched once per session and shared by every item in
 *  the menu, so the script, package and daemon are guaranteed to come from
 *  the same tag rather than a mix of tag and branch head. A failure is not
 *  cached: the usual cause is GitHub's unauthenticated rate limit (60/hr per
 *  IP), and one rate-limited click shouldn't poison the menu afterwards. */
let latestReleasePromise = null;
function fetchLatestRelease() {
    if (!latestReleasePromise) {
        latestReleasePromise = fetch(`https://api.github.com/repos/${ENROLLINATOR_REPO}/releases/latest`)
            .then(res => {
                if (!res.ok) throw new Error("HTTP " + res.status);
                return res.json();
            })
            .catch(err => { latestReleasePromise = null; throw err; });
    }
    return latestReleasePromise;
}

/** Fetch a remote file and save it under `filename`.
 *  Falls back to opening the URL when fetch is blocked (offline, CORS, a
 *  proxy in the way) so the click always does something useful. */
async function downloadRemote(url, filename) {
    try {
        const res = await fetch(url);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const blob = await res.blob();
        const objUrl = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = objUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(objUrl), 1000);
    } catch (e) {
        window.open(url, "_blank", "noopener");
    }
}

/** Download an asset from the newest release, matched by pattern — release
 *  filenames carry a version, so they can't be hard-coded. `repoPath` is the
 *  same file's path inside the repo, used when a release doesn't publish it
 *  as an asset; it is still read at that release's tag.
 *
 *  When the API itself is unreachable we open the releases page instead of
 *  quietly substituting a file from `main`. Those are not the same artifact —
 *  main can be many commits ahead of the newest tag — and a download labelled
 *  "from the newest release" handing over unreleased code is the kind of
 *  difference nobody notices until it misbehaves on a machine being enrolled. */
async function downloadLatestReleaseAsset(pattern, repoPath) {
    let release;
    try {
        release = await fetchLatestRelease();
    } catch (e) {
        window.open(ENROLLINATOR_RELEASES, "_blank", "noopener");
        return;
    }
    const asset = (release.assets || []).find(a => pattern.test(a.name));
    if (asset) {
        await downloadRemote(asset.browser_download_url, asset.name);
    } else if (repoPath && release.tag_name) {
        await downloadRemote(enrollinatorRawUrl(release.tag_name, repoPath),
                             repoPath.split("/").pop());
    } else {
        window.open(ENROLLINATOR_RELEASES, "_blank", "noopener");
    }
}

/** Download a file that ships in the repo rather than as a release asset,
 *  pinned to the newest release's tag so it matches the script and package
 *  downloaded alongside it. */
async function downloadReleaseFile(repoPath) {
    try {
        const release = await fetchLatestRelease();
        if (!release.tag_name) throw new Error("release has no tag");
        await downloadRemote(enrollinatorRawUrl(release.tag_name, repoPath),
                             repoPath.split("/").pop());
    } catch (e) {
        window.open(ENROLLINATOR_RELEASES, "_blank", "noopener");
    }
}

function toggleDownloadMenu(btn) {
    const existing = document.getElementById("download-menu");
    if (existing) { existing.remove(); return; }

    const rect = localRect(btn);
    const menu = document.createElement("div");
    menu.id = "download-menu";
    menu.className = "header-dropdown-menu";
    menu.style.cssText = `top:${rect.bottom + 4}px;right:${localViewport().width - rect.right}px`;

    const sections = [
        {
            title: "Your configuration",
            items: [
                { label: "Download .mobileconfig", hint: "Deploy via MDM", action: downloadMobileconfig },
                { label: "Download as .plist (--xml)", hint: "Use with enrollinator.sh --xml", action: downloadBareXml }
            ]
        },
        {
            title: "Enrollinator",
            items: [
                { label: "Latest script", hint: "enrollinator.sh from the newest release",
                  action: () => downloadLatestReleaseAsset(/^enrollinator\.sh$/i, "enrollinator.sh") },
                { label: "Latest package", hint: "Installer .pkg from the newest release",
                  action: () => downloadLatestReleaseAsset(/\.pkg$/i) },
                { label: "Latest daemon", hint: "LaunchDaemon plist from the same release",
                  action: () => downloadReleaseFile("launchd/com.enrollinator.app.plist") }
            ]
        }
    ];

    sections.forEach((section, i) => {
        if (i > 0) {
            const spacer = document.createElement("div");
            spacer.className = "ddm-spacer";
            menu.appendChild(spacer);
        }
        const title = document.createElement("div");
        title.className = "ddm-section-title";
        title.textContent = section.title;
        menu.appendChild(title);

        section.items.forEach(item => {
            const el = document.createElement("button");
            el.className = "header-dropdown-item";
            el.innerHTML = `<span class="ddi-label">${item.label}</span><span class="ddi-hint">${item.hint}</span>`;
            el.addEventListener("click", () => { menu.remove(); item.action(); });
            menu.appendChild(el);
        });
    });

    document.body.appendChild(menu);
    // Close on outside click
    setTimeout(() => document.addEventListener("click", function close(e) {
        if (!menu.contains(e.target) && e.target !== btn) { menu.remove(); }
        document.removeEventListener("click", close);
    }), 0);
}

// ============================================================================
// Tooltips — position:fixed so overflow:hidden ancestors can never clip them.
// ============================================================================

function initTooltips() {
    const tip = document.createElement("div");
    tip.className = "js-tooltip";
    document.body.appendChild(tip);

    let hideTimer = null;

    function show(target) {
        const text = target.dataset.tooltip;
        if (!text) return;
        clearTimeout(hideTimer);
        tip.textContent = text;
        tip.style.opacity = "0";
        tip.style.display = "block";

        const below = target.hasAttribute("data-tooltip-below");
        const r = localRect(target);
        const tw = tip.offsetWidth;
        const th = tip.offsetHeight;
        let left = r.left + r.width / 2 - tw / 2;
        let top  = below ? r.bottom + 7 : r.top - th - 7;

        // Keep within viewport horizontally.
        left = Math.max(6, Math.min(left, localViewport().width - tw - 6));
        tip.style.left = left + "px";
        tip.style.top  = top  + "px";
        tip.style.opacity = "1";
    }

    function hide() {
        tip.style.opacity = "0";
        hideTimer = setTimeout(() => { tip.style.display = "none"; }, 130);
    }

    document.addEventListener("mouseover", e => {
        const t = e.target.closest("[data-tooltip]");
        if (t) show(t); else hide();
    });
    document.addEventListener("mouseout", e => {
        if (!e.target.closest("[data-tooltip]")) return;
        // Only hide when leaving the element entirely (not entering a child).
        if (!e.relatedTarget || !e.relatedTarget.closest("[data-tooltip]")) hide();
    });
    document.addEventListener("scroll", hide, true);
}

        // it out of the commands rather than asking a question we can answer.
        adoptFleetFromState(state);

        renderCanvas(); updatePreview(); reopenSettings();
    } catch (err) {
        alert(`Import failed: ${err.message}`);
    }
    e.target.value = "";
});

// Fleet setup sheet — the first thing a new user sees, and the one question
// worth asking up front: what manages these Macs? Everything downstream (the
// source picker, the step catalogue) narrows itself from the answer.
// ============================================================================

function slugifyOrg(name) {
    const slug = (name || "").toLowerCase()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "");
    return slug || "example";
}

/** Seed profile identity from the organisation name, but only over fields the
 *  user has not touched — this runs after setup, and setup can be reopened at
 *  any time, so it must never stomp a hand-edited identifier. */
function seedIdentityFromOrg(org) {
    if (!org) return;
    const defaults = defaultState();
    if (state.outer.PayloadOrganization === defaults.outer.PayloadOrganization ||
        !state.outer.PayloadOrganization) {
        state.outer.PayloadOrganization = org;
    }
    if (state.outer.PayloadIdentifier === defaults.outer.PayloadIdentifier ||
        !state.outer.PayloadIdentifier) {
        state.outer.PayloadIdentifier = `com.${slugifyOrg(org)}.enrollinator`;
    }
}

/** Keep the header chip in step with the fleet. */
function refreshFleetChip() {
    const btn = document.getElementById("fleet-btn");
    if (!btn) return;
    const mdm = sourceById(fleet.mdm);
    btn.innerHTML = "";
    if (mdm) {
        btn.classList.remove("unset");
        if (mdm.icon) btn.appendChild(h("span", { class: "fleet-btn-icon" }, mdm.icon));
        btn.appendChild(h("span", null, mdm.label));
        const extras = fleet.tools.length;
        if (extras) btn.appendChild(h("span", { class: "pill" }, `+${extras}`));
        btn.setAttribute("data-tooltip",
            "Targeting " + mdm.label + ". Click to change the MDM or tooling.");
    } else if (fleet.configured) {
        // Configured with no MDM is a deliberate choice, not a blank — say so.
        btn.classList.remove("unset");
        btn.appendChild(h("span", { class: "fleet-btn-icon" }, "🛠"));
        btn.appendChild(h("span", null, "Advanced mode"));
        btn.setAttribute("data-tooltip",
            "Every source and the full step editor. Click to pick an MDM and turn on guided mode.");
    } else {
        btn.classList.add("unset");
        btn.appendChild(h("span", null, "Set MDM"));
        btn.setAttribute("data-tooltip", "Which MDM this profile targets");
    }
}

/** Guided mode is on whenever the user named an MDM. Advanced mode (no MDM)
 *  keeps the original behaviour: every source, straight into the full editor. */
function guidedMode() { return !!fleet.mdm; }

/** @param {{firstRun?: boolean}} [opts] — first run reached this from the
 *  welcome launcher, so the copy addresses someone starting from nothing and
 *  Cancel reads as Skip. */
function showFleetSetup(opts) {
    const firstRun = !!(opts && opts.firstRun);
    const existing = document.getElementById("fleet-setup-root");
    if (existing) existing.remove();

    // Edit a copy: closing without confirming must leave the fleet untouched.
    const draft = { mdm: fleet.mdm, tools: fleet.tools.slice(), org: fleet.org };

    const root = h("div", { id: "fleet-setup-root" });
    const backdrop = h("div", { class: "gs-backdrop",
        onclick: e => { if (e.target === backdrop) dismiss(); } });
    const modal = h("div", { class: "gs-modal" });

    function dismiss() {
        // Skipping still counts as configured — otherwise the sheet reappears
        // on every reload for someone who deliberately skipped it. No MDM is
        // advanced mode, which is a reasonable place to leave a skipper.
        fleet.configured = true;
        saveFleetPrefs();
        refreshFleetChip();
        root.remove();
    }

    modal.appendChild(h("div", { class: "gs-header" },
        h("h2", null, firstRun ? "👋 Let's set up your deployment" : "🏢 Deployment target"),
        h("p", null, firstRun
            ? "Two quick questions so the builder can show you the tools your fleet actually runs. You can change this at any time."
            : "Which MDM and tooling this profile targets. This shapes the step catalogue and the source picker — it is builder context only and never appears in the exported profile.")
    ));

    const body = h("div", { class: "setup-body" });

    // ---- MDM choice
    const mdmGrid = h("div", { class: "mdm-grid" });
    function paintMdmGrid() {
        mdmGrid.innerHTML = "";
        for (const m of sourcesOfKind("mdm")) {
            mdmGrid.appendChild(h("button", {
                class: "mdm-card" + (draft.mdm === m.id ? " selected" : ""),
                "data-tooltip": m.blurb,
                onclick: () => {
                    draft.mdm = draft.mdm === m.id ? null : m.id;
                    paintMdmGrid();
                }
            },
                h("span", { class: "mdm-card-icon" }, m.icon || "▫️"),
                h("span", { class: "mdm-card-name" }, m.label)
            ));
        }
        // No MDM is advanced mode: every source, every field, no follow-up
        // questions. It is also the honest answer for a fleet whose MDM isn't
        // listed, or one driven from a package with no MDM binary at all.
        mdmGrid.appendChild(h("button", {
            class: "mdm-card advanced" + (draft.mdm === null ? " selected" : ""),
            "data-tooltip": "Every source and the full step editor, with no guided questions.",
            onclick: () => { draft.mdm = null; paintMdmGrid(); }
        },
            h("span", { class: "mdm-card-icon" }, "🛠"),
            h("span", { class: "mdm-card-name" }, "Advanced mode")
        ));
    }
    paintMdmGrid();
    body.appendChild(h("div", { class: "setup-section" },
        h("div", { class: "setup-label" }, "What manages these Macs?"),
        mdmGrid,
        h("p", { class: "setup-hint" },
            "Picking an MDM turns on guided mode: new steps are built by answering a few questions, and command pickers list that MDM, macOS built-ins and your tooling. Other MDMs' presets are hidden until you click Show all sources, and the full step editor is one click away from every question.")
    ));

    // ---- Extra tooling
    const toolList = h("div", { class: "tool-list" });
    function paintToolList() {
        toolList.innerHTML = "";
        for (const t of sourcesOfKind("tool")) {
            const on = draft.tools.includes(t.id);
            toolList.appendChild(h("label", {
                class: "tool-opt" + (on ? " selected" : ""),
            },
                h("input", { type: "checkbox", checked: on, onchange: e => {
                    if (e.target.checked) {
                        if (!draft.tools.includes(t.id)) draft.tools.push(t.id);
                    } else {
                        draft.tools = draft.tools.filter(x => x !== t.id);
                    }
                    paintToolList();
                }}),
                h("div", { class: "tool-opt-text" },
                    h("span", { class: "tool-opt-name" }, `${t.icon} ${t.label}`),
                    h("span", { class: "tool-opt-desc" }, t.blurb)
                )
            ));
        }
    }
    paintToolList();
    body.appendChild(h("div", { class: "setup-section" },
        h("div", { class: "setup-label" }, "Also deployed on this fleet?",
            h("span", { class: "setup-optional" }, "optional")),
        toolList
    ));

    // ---- Organisation
    const orgInput = h("input", { type: "text", value: draft.org,
        placeholder: "Example, Inc.",
        oninput: e => { draft.org = e.target.value; } });
    body.appendChild(h("div", { class: "setup-section" },
        h("div", { class: "setup-label" }, "Organisation name",
            h("span", { class: "setup-optional" }, "optional")),
        orgInput,
        h("p", { class: "setup-hint" },
            "Fills in the profile's organisation and payload identifier so you don't have to hunt them down in Profile Settings. Existing edits are left alone.")
    ));

    modal.appendChild(body);

    modal.appendChild(h("div", { class: "gs-footer" },
        h("span", { style: "font-size:12px;color:var(--text-4)" },
            "Stored in this browser only."),
        h("div", { style: "display:flex;gap:8px" },
            h("button", { class: "btn",
                style: "height:34px;padding:0 16px;font-size:13px",
                onclick: dismiss
            }, firstRun ? "Skip" : "Cancel"),
            h("button", { class: "btn primary",
                style: "height:34px;padding:0 22px;font-size:13px",
                onclick: () => {
                    fleet.mdm = draft.mdm;
                    fleet.tools = draft.tools.slice();
                    fleet.org = draft.org.trim();
                    fleet.configured = true;
                    saveFleetPrefs();
                    seedIdentityFromOrg(fleet.org);
                    refreshFleetChip();
                    root.remove();
                    renderCanvas(); updatePreview(); reopenSettings();
                }
            }, firstRun ? "Start building" : "Save")
        )
    ));

    backdrop.appendChild(modal);
    root.appendChild(backdrop);
    document.body.appendChild(root);
    setTimeout(() => orgInput.focus(), 60);
}

// Welcome launcher — the first thing on load.
//
// There are only really three ways to start, and which one you're doing
// changes what should happen next: a new config wants the deployment
// questions, an existing one already answers them, and the sample answers
// them too. Asking that first means nobody is walked through setup for a
// config they were about to replace wholesale two clicks later.

const WELCOME_KEY = "enrollinator-welcome-seen";

function showWelcome() {
    const existing = document.getElementById("welcome-root");
    if (existing) existing.remove();

    const root = h("div", { id: "welcome-root" });
    const backdrop = h("div", { class: "gs-backdrop",
        onclick: e => { if (e.target === backdrop) close(); } });
    const modal = h("div", { class: "gs-modal" });

    const skipCheck = h("input", { type: "checkbox" });

    function close() {
        if (skipCheck.checked) prefSet(WELCOME_KEY, "1");
        root.remove();
    }

    modal.appendChild(h("div", { class: "gs-header" },
        h("h2", null, "👋 Welcome to Profile Builder"),
        h("p", null, "Build Enrollinator .mobileconfig profiles visually — no XML required. Where would you like to start?")
    ));

    const choices = [
        {
            icon: "✨", title: "Start a new config",
            desc: "A couple of questions about your fleet, then straight into building.",
            go() {
                close();
                showFleetSetup({ firstRun: true });
            }
        },
        {
            icon: "📂", title: "Open an existing config",
            desc: "Import a .mobileconfig or bare .plist and carry on editing it.",
            go() {
                close();
                // The import handler reads the fleet back out of the config, so
                // this path needs no setup questions at all.
                document.getElementById("import-file").click();
            }
        },
        {
            icon: "🧪", title: "Explore the sample",
            desc: "A complete worked example — playbooks, branching, wait windows, media.",
            go() { close(); loadSample(); }
        }
    ];

    const list = h("div", { class: "welcome-list" });
    for (const c of choices) {
        list.appendChild(h("button", { class: "welcome-choice", onclick: c.go },
            h("span", { class: "welcome-choice-icon" }, c.icon),
            h("span", { class: "welcome-choice-text" },
                h("span", { class: "welcome-choice-title" }, c.title),
                h("span", { class: "welcome-choice-desc" }, c.desc)),
            h("span", { class: "welcome-choice-caret" }, "›")
        ));
    }
    modal.appendChild(h("div", { class: "welcome-body" }, list));

    modal.appendChild(h("div", { class: "gs-footer" },
        h("label", null, skipCheck, " Don't show again"),
        h("button", { class: "btn",
            style: "height:34px;padding:0 16px;font-size:13px",
            onclick: () => { close(); showGettingStarted(); }
        }, "Take the tour")
    ));

    backdrop.appendChild(modal);
    root.appendChild(backdrop);
    document.body.appendChild(root);
}

function showGettingStarted() {
    const existing = document.getElementById("gs-root");
    if (existing) { existing.remove(); return; }

    const root = document.createElement("div");
    root.id = "gs-root";

    const backdrop = document.createElement("div");
    backdrop.className = "gs-backdrop";
    backdrop.addEventListener("click", e => { if (e.target === backdrop) root.remove(); });

    const modal = document.createElement("div");
    modal.className = "gs-modal";

    // Header
    const header = document.createElement("div");
    header.className = "gs-header";
    header.innerHTML = `
        <h2>👋 Welcome to Profile Builder</h2>
        <p>Build Enrollinator <code>.mobileconfig</code> profiles visually — no XML required.</p>`;
    modal.appendChild(header);

    // Grid of cards
    const grid = document.createElement("div");
    grid.className = "gs-grid";
    GS_CARDS.forEach(c => {
        const card = document.createElement("div");
        card.className = "gs-card";
        card.innerHTML = `
            <div class="gs-card-icon">${c.icon}</div>
            <h3>${c.title}</h3>
            <p>${c.body}</p>`;
        grid.appendChild(card);
    });
    modal.appendChild(grid);

    // Footer
    const footer = document.createElement("div");
    footer.className = "gs-footer";
    const skipLabel = document.createElement("label");
    const skipCheck = document.createElement("input");
    skipCheck.type = "checkbox";
    skipCheck.id = "gs-skip";
    skipLabel.appendChild(skipCheck);
    skipLabel.appendChild(document.createTextNode(" Don't show again"));
    footer.appendChild(skipLabel);

    const btnGroup = document.createElement("div");
    btnGroup.style.cssText = "display:flex;gap:8px";

    const guideBtn = document.createElement("button");
    guideBtn.className = "btn";
    guideBtn.style.cssText = "height:34px;padding:0 16px;font-size:13px";
    guideBtn.textContent = "Full guide";
    guideBtn.addEventListener("click", () => {
        if (skipCheck.checked) prefSet("enrollinator-gs-seen", "1");
        root.remove();
        showHelpCenter();
    });
    btnGroup.appendChild(guideBtn);

    const doneBtn = document.createElement("button");
    doneBtn.className = "btn primary";
    doneBtn.style.cssText = "height:34px;padding:0 22px;font-size:13px";
    doneBtn.textContent = "Got it";
    doneBtn.addEventListener("click", () => {
        if (skipCheck.checked) prefSet("enrollinator-gs-seen", "1");
        root.remove();
    });
    btnGroup.appendChild(doneBtn);
    footer.appendChild(btnGroup);
    modal.appendChild(footer);

    backdrop.appendChild(modal);
    root.appendChild(backdrop);
    document.body.appendChild(root);
}

/** Flatten sections into searchable entries. */
function helpSearchIndex() {
    const entries = [];
    HELP_SECTIONS.forEach(sec => {
        sec.blocks.forEach(b => {
            const text = (sec.title + " " + b.h + " " + b.body.replace(/<[^>]+>/g, " "))
                .replace(/\s+/g, " ").toLowerCase();
            entries.push({ section: sec, block: b, text });
        });
    });
    return entries;
}

/** Build the help panel into `doc`, which is this document for the modal and
 *  the popped-out window's for the standalone one. Everything below is written
 *  against `doc` rather than the global so the two stay one implementation —
 *  a second copy of the search and nav logic would drift within a release.
 *
 *  @param {Document} doc
 *  @param {{sectionId?: string, popped?: boolean, onClose?: Function,
 *           onPopOut?: Function, onTour?: Function}} opts
 *  @returns {{modal: Element, focusSearch: Function, setSection: Function}} */
function mountHelpCentre(doc, opts) {
    opts = opts || {};
    let activeId = opts.sectionId || HELP_SECTIONS[0].id;
    const index = helpSearchIndex();

    const modal = doc.createElement("div");
    modal.className = "help-modal" + (opts.popped ? " popped" : "");

    const head = doc.createElement("div");
    head.className = "help-head";
    head.innerHTML = `
        <h2>📘 Profile Builder help</h2>
        <input type="text" class="help-search" placeholder="Search help…" autocomplete="off">
        ${opts.onPopOut ? `<button class="help-popout" title="Open help in its own window">⧉</button>` : ""}
        <button class="help-close" title="${opts.popped ? "Close window" : "Close"}">✕</button>`;

    const body = doc.createElement("div");
    body.className = "help-body";
    const nav = doc.createElement("div");
    nav.className = "help-nav";
    const content = doc.createElement("div");
    content.className = "help-content";
    body.append(nav, content);
    modal.append(head, body);

    const search = head.querySelector(".help-search");
    head.querySelector(".help-close").addEventListener("click", () => {
        if (opts.onClose) opts.onClose();
    });
    const popBtn = head.querySelector(".help-popout");
    if (popBtn) popBtn.addEventListener("click", () => opts.onPopOut());

    /** Browsers block window.open often enough that failing silently would
     *  look like a dead button. Say what happened, in place. */
    function reportPopOutBlocked() {
        if (!popBtn || head.querySelector(".help-popout-blocked")) return;
        const note = doc.createElement("span");
        note.className = "help-popout-blocked";
        note.textContent = "Pop-up blocked — allow pop-ups for this page.";
        head.insertBefore(note, popBtn);
        popBtn.classList.add("blocked");
    }

    function blockNode(block, sectionTitle) {
        const el = doc.createElement("div");
        el.className = "help-block";
        el.innerHTML =
            (sectionTitle ? `<div class="help-result-section">${sectionTitle}</div>` : "") +
            `<h4>${block.h}</h4>` + block.body;
        return el;
    }

    function renderNav() {
        nav.innerHTML = "";
        HELP_SECTIONS.forEach(sec => {
            const b = doc.createElement("button");
            b.className = sec.id === activeId ? "active" : "";
            b.innerHTML = `<span class="help-nav-icon">${sec.icon}</span><span>${sec.title}</span>`;
            b.addEventListener("click", () => {
                activeId = sec.id;
                search.value = "";
                renderNav(); renderSection();
            });
            nav.appendChild(b);
        });
    }

    function renderSection() {
        const sec = HELP_SECTIONS.find(s => s.id === activeId) || HELP_SECTIONS[0];
        content.innerHTML = `<h3>${sec.icon} ${sec.title}</h3><p class="help-section-lede">${sec.lede}</p>`;
        sec.blocks.forEach(b => content.appendChild(blockNode(b)));
        content.scrollTop = 0;
    }

    function renderResults(q) {
        const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
        const hits = index.filter(e => terms.every(t => e.text.includes(t)));
        content.innerHTML = `<h3>Search</h3><p class="help-section-lede">${hits.length} result${hits.length === 1 ? "" : "s"} for “${q}”.</p>`;
        if (!hits.length) {
            const none = doc.createElement("div");
            none.className = "help-empty";
            none.textContent = "Nothing matched. Try a single keyword — blocking, slideshow, Jamf, token…";
            content.appendChild(none);
            return;
        }
        hits.forEach(e => content.appendChild(blockNode(e.block, e.section.title)));
        content.scrollTop = 0;
    }

    search.addEventListener("input", e => {
        const q = e.target.value.trim();
        if (q) {
            // Results span every section, so no nav entry is "current".
            nav.querySelectorAll("button").forEach(b => b.classList.remove("active"));
            renderResults(q);
        } else {
            renderNav();
            renderSection();
        }
    });

    // Inline actions embedded in help copy (e.g. "show the quick tour"). The
    // popped-out window runs these back in the builder, since that's where the
    // thing being demonstrated lives.
    content.addEventListener("click", e => {
        const t = e.target.closest("[data-help-action]");
        if (!t) return;
        if (t.dataset.helpAction === "tour" && opts.onTour) opts.onTour();
    });

    renderNav();
    renderSection();

    return {
        modal,
        focusSearch: () => search.focus(),
        reportPopOutBlocked,
        currentSection: () => activeId,
        setSection: id => {
            activeId = id;
            search.value = "";
            renderNav(); renderSection();
        }
    };
}

function showHelpCenter(sectionId) {
    // Already popped out? Raise that window rather than opening a second copy.
    if (helpWindowOpen()) {
        helpWindow.focus();
        if (sectionId && helpWindowApi) helpWindowApi.setSection(sectionId);
        return;
    }

    const existing = document.getElementById("help-root");
    if (existing) existing.remove();

    const root = document.createElement("div");
    root.id = "help-root";

    const backdrop = document.createElement("div");
    backdrop.className = "gs-backdrop";
    backdrop.addEventListener("click", e => { if (e.target === backdrop) close(); });

    function close() {
        root.remove();
        document.removeEventListener("keydown", onKey, true);
    }
    function onKey(e) {
        if (e.key !== "Escape") return;
        // Swallow it so the shared Esc handler doesn't also close a step editor
        // sitting behind the help centre.
        e.stopPropagation();
        close();
    }
    document.addEventListener("keydown", onKey, true);

    const api = mountHelpCentre(document, {
        sectionId: sectionId || HELP_SECTIONS[0].id,
        onClose: close,
        onTour: () => { close(); showGettingStarted(); },
        onPopOut: () => {
            // Only dismiss the modal once the window is actually up — a
            // blocked pop-up would otherwise leave the reader with nothing.
            if (popOutHelpCentre(api.currentSection())) close();
            else api.reportPopOutBlocked();
        }
    });

    backdrop.appendChild(api.modal);
    root.appendChild(backdrop);
    document.body.appendChild(root);
    setTimeout(api.focusSearch, 30);
}

// ----------------------------------------------------------------------------
// Popped-out help
//
// The builder is one self-contained file with no server, so the second window
// can't just load a URL — it's opened blank and built in place: this page's own
// <style> elements are copied across, then the same mountHelpCentre() renders
// into it. Nothing is fetched, so it works offline and from file:// exactly
// like the rest of the tool.
// ----------------------------------------------------------------------------

function helpWindowOpen() {
    return !!(helpWindow && !helpWindow.closed && helpWindow.document);
}

/** Push the builder's current theme and interface scale onto the popped-out
 *  window. Called when it opens, when it resizes, and whenever the builder's
 *  own appearance settings change, so the two never drift apart. */
function syncHelpWindow() {
    if (!helpWindowOpen()) return;
    try {
        const el = helpWindow.document.documentElement;
        el.dataset.theme = document.documentElement.dataset.theme || "light";
        // The help window scales with the builder, but measures its own
        // viewport — the same innerHeight ÷ scale that applyDisplaySettings()
        // does here, since .help-modal.popped is sized from --app-vh.
        const scale = effectiveScale();
        el.style.setProperty("--ui-scale", String(scale));
        el.style.setProperty("--app-vh", (helpWindow.innerHeight / scale) + "px");
    } catch (e) { /* window went away mid-call — nothing to sync */ }
}

/** @returns {boolean} false when the browser blocked the popup. */
function popOutHelpCentre(sectionId) {
    if (helpWindowOpen()) {
        helpWindow.focus();
        if (sectionId && helpWindowApi) helpWindowApi.setSection(sectionId);
        return true;
    }

    const w = window.open("", "enrollinator-help",
        "popup=yes,width=1040,height=840,menubar=no,toolbar=no,location=no,status=no");
    if (!w) return false;
    helpWindow = w;

    const doc = w.document;
    doc.open();
    doc.write('<!doctype html><html><head><meta charset="utf-8">' +
              "<title>Profile Builder help</title></head><body></body></html>");
    doc.close();

    // Same stylesheet, same rules — the panel looks identical to the modal.
    const style = doc.createElement("style");
    style.textContent = [...document.querySelectorAll("style")]
        .map(s => s.textContent).join("\n");
    doc.head.appendChild(style);
    doc.body.className = "help-window";

    helpWindowApi = mountHelpCentre(doc, {
        sectionId,
        popped: true,
        onClose: () => w.close(),
        onTour: () => {
            // The tour belongs to the builder window; raise it and run it there.
            try { window.focus(); } catch (e) { /* focus refused — still runs */ }
            showGettingStarted();
        }
    });
    doc.body.appendChild(helpWindowApi.modal);

    syncHelpWindow();
    w.addEventListener("resize", syncHelpWindow);
    w.addEventListener("pagehide", () => { helpWindow = null; helpWindowApi = null; });
    // Esc closes it, matching the modal it came from.
    doc.addEventListener("keydown", e => { if (e.key === "Escape") w.close(); });

    setTimeout(() => { try { w.focus(); helpWindowApi.focusSearch(); } catch (e) {} }, 40);
    return true;
}

document.getElementById("help-btn").addEventListener("click", () => showHelpCenter());
// A stranded help window outlives its builder awkwardly — it can't run the
// tour, and reloading the builder would orphan a second one.
window.addEventListener("pagehide", () => {
    if (helpWindowOpen()) helpWindow.close();
});

document.getElementById("fleet-btn").addEventListener("click", () => showFleetSetup());

// The launcher comes first and routes from there: new configs get the
// deployment questions, imported ones and the sample answer them on their own.
if (!prefGet(WELCOME_KEY)) showWelcome();
else if (!fleet.configured) showFleetSetup({ firstRun: true });

// Per-button proximity reveal for the between-step "+ insert" affordances.
// Toggles .proximity-active on each .step-insert-btn whose centre is within
// 50 px of the cursor.  Throttled to one update per animation frame.
(function installInsertProximity() {
    const RADIUS = 50;
    const RADIUS_SQ = RADIUS * RADIUS;
    let pending = false;
    let lastX = 0, lastY = 0;
    document.addEventListener("mousemove", e => {
        lastX = e.clientX; lastY = e.clientY;
        if (pending) return;
        pending = true;
        requestAnimationFrame(() => {
            pending = false;
            document.querySelectorAll(".step-insert-btn").forEach(btn => {
                const r = btn.getBoundingClientRect();
                const dx = lastX - (r.left + r.width / 2);
                const dy = lastY - (r.top  + r.height / 2);
                btn.classList.toggle("proximity-active", dx * dx + dy * dy <= RADIUS_SQ);
            });
        });
    });
    // When the cursor leaves the window, hide all of them.
    document.addEventListener("mouseleave", () => {
        document.querySelectorAll(".step-insert-btn.proximity-active")
            .forEach(b => b.classList.remove("proximity-active"));
    });
})();

renderCanvas();
updatePreview();

// ---- preview collapse toggle
(function() {
    const btn    = document.getElementById("preview-toggle");
    const pane   = document.getElementById("preview-pane");
    const handle = document.getElementById("resize-handle");
    const mainEl = document.querySelector("main");

    btn.addEventListener("click", e => {
        e.stopPropagation(); // don't trigger resize-handle mousedown
        const isCollapsed = pane.classList.toggle("collapsed");
        handle.classList.toggle("collapsed", isCollapsed);
        if (isCollapsed) {
            pane._savedCols = mainEl.style.gridTemplateColumns || "";
            mainEl.style.gridTemplateColumns = "1fr 5px 0px";
            btn.textContent = "‹";
            btn.setAttribute("data-tooltip", "Expand preview");
            btn.title = "Expand preview";
        } else {
            mainEl.style.gridTemplateColumns = pane._savedCols || "";
            btn.textContent = "›";
            btn.setAttribute("data-tooltip", "Collapse preview");
            btn.title = "Collapse preview";
        }
    });
})();

// ---- resize handle
(function() {
    const handle = document.getElementById("resize-handle");
    const mainEl = document.querySelector("main");
    let active = false, startX = 0, startW = 0;
    handle.addEventListener("mousedown", e => {
        if (handle.classList.contains("collapsed")) return;
        active = true;
        startX = e.clientX;
        // Local px throughout: grid-template-columns is interpreted in the
        // zoomed body's own units, while clientX arrives in real viewport px.
        startW = localRect(document.getElementById("canvas")).width;
        handle.classList.add("resizing");
        document.body.style.cursor = "col-resize";
        document.body.style.userSelect = "none";
        e.preventDefault();
    });
    document.addEventListener("mousemove", e => {
        if (!active) return;
        const dx = (e.clientX - startX) / effectiveScale();
        const w = Math.max(320, Math.min(startW + dx, localViewport().width - 220));
        mainEl.style.gridTemplateColumns = `${w}px 5px 1fr`;
        display.previewResized = true;
    });
    document.addEventListener("mouseup", () => {
        if (!active) return;
        active = false;
        handle.classList.remove("resizing");
        document.body.style.cursor = "";
        document.body.style.userSelect = "";
    });
})();
</script>
