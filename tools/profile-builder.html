    ));

    if (collapsed) {
        sidebar.appendChild(settingsIconBtn);
    } else {
        // Settings button
        const isOpen = ui.settingsOpen;
        sidebar.appendChild(
            h("div", { class: "sidebar-settings-row" },
                h("button", {
                    class: "settings-trigger-btn" + (isOpen ? " active" : ""),
                    "data-tooltip": "Branding, identity, hardware info, help & add-on picker",
                    "data-tooltip-below": "",
                    onclick: e => openSettingsPopover(e.currentTarget)
                },
                    h("span", { class: "stb-icon" }, "⚙"),
                    "Profile Settings",
                    h("span", { class: "stb-caret" }, "▾")
                )
            )
        );

        // Welcome Screen launcher — sits directly under Profile Settings since
        // they're both global (per-profile) settings the user reaches via a
        // dedicated launcher button.  Reuses .settings-trigger-btn styling so
        // the two buttons read as a coherent stack.
        const welcomeEnabled = !!(state.WelcomeScreen && state.WelcomeScreen.Enabled);
        sidebar.appendChild(
            h("div", { class: "sidebar-settings-row" },
                h("button", {
                    class: "settings-trigger-btn" + (ui.welcomeOpen ? " active" : ""),
                    "data-tooltip": "Configure the optional welcome dialog shown before onboarding starts",
                    "data-tooltip-below": "",
                    onclick: e => openWelcomePopover(e.currentTarget)
                },
                    h("span", { class: "stb-icon" }, "👋"),
                    h("span", { style: "flex:1;text-align:left" }, "Welcome Screen"),
                    h("span", { class: "stb-mini-status" }, welcomeEnabled ? "On" : "Off"),
                    h("span", { class: "stb-caret" }, "▾")
                )
            )
        );

        sidebar.appendChild(h("div", { class: "sidebar-section-label" }, ""));
    }

    const list = h("div", { class: "sidebar-playbook-list" });
    state.Playbooks.forEach((p, idx) => {
        const stepCount = p.Steps.length;
        const issueCount = _issues.filter(i =>
            (i.scope === "playbook" || i.scope === "step") && i.pIdx === idx).length;
        const itemLabel = p.Name || `Playbook ${idx + 1}`;
        const item = h("div", {
            class: "sidebar-item" + (ui.selectedPlaybook === idx ? " active" : ""),
            draggable: "true",
            "data-tooltip": collapsed ? itemLabel : undefined,
            "data-tooltip-below": collapsed ? "" : undefined,
            onclick: () => { ui.selectedPlaybook = idx; renderCanvas(); }
        },
            h("span", { class: "sidebar-item-icon" }, p.Addon ? "📦" : "▶"),
            h("span", { class: "sidebar-item-name" }, itemLabel),
            issueCount ? h("span", { class: "sidebar-item-warn" }, "⚠") : null,
            h("span", { class: "sidebar-item-count" }, String(stepCount))
        );

        item.addEventListener("dragstart", e => {
            e.dataTransfer.setData("application/enrollinator-lane", String(idx));
            e.dataTransfer.effectAllowed = "move";
            item.classList.add("dragging");
        });
        item.addEventListener("dragend", () => item.classList.remove("dragging"));
        item.addEventListener("dragover", e => {
            if (e.dataTransfer.types.includes("application/enrollinator-lane")) {
                e.preventDefault(); item.classList.add("drag-over");
            } else if (e.dataTransfer.types.includes("application/enrollinator-step")) {
                // Don't allow dropping a step onto its own playbook.
                e.preventDefault(); item.classList.add("step-drop-over");
            }
        });
        item.addEventListener("dragleave", () => item.classList.remove("drag-over", "step-drop-over"));
        item.addEventListener("drop", e => {
            item.classList.remove("drag-over", "step-drop-over");
            // Reorder playbooks
            if (e.dataTransfer.types.includes("application/enrollinator-lane")) {
                const raw = e.dataTransfer.getData("application/enrollinator-lane");
                if (!raw) return;
                e.preventDefault();
                const from = parseInt(raw, 10);
                if (from === idx) return;
                const moved = state.Playbooks.splice(from, 1)[0];
                state.Playbooks.splice(idx, 0, moved);
                if (ui.selectedPlaybook === from) ui.selectedPlaybook = idx;
                renderCanvas(); updatePreview();
                return;
            }
            // Move step to this playbook (appended at end)
            const raw = e.dataTransfer.getData("application/enrollinator-step");
            if (!raw) return;
            e.preventDefault();
            const { from, idx: sIdx } = JSON.parse(raw);
            if (from === idx) return; // same playbook — ignore, handled by step-row drop
            moveStep(from, sIdx, idx, state.Playbooks[idx].Steps.length);
            ui.selectedPlaybook = idx; // switch view to destination
        });

        list.appendChild(item);
    });
    sidebar.appendChild(list);

    sidebar.appendChild(h("button", {
        class: "sidebar-add-btn",
        "data-tooltip": collapsed ? "Add playbook" : undefined,
        "data-tooltip-below": "",
        onclick: () => {
            state.Playbooks.push(blankProfile());
            ui.selectedPlaybook = state.Playbooks.length - 1;
            renderCanvas(); updatePreview();
        }
    },
        "+",
        h("span", { class: "sidebar-add-btn-label" }, " Add playbook")
    ));

    return sidebar;
}

function renderPlaybookContent(pIdx) {
    const content = h("div", { class: "playbook-content" });

    if (state.Playbooks.length === 0) {
        content.appendChild(h("div", { class: "empty-state" },
            "No playbooks yet — click '+ Add playbook' in the sidebar."));
        return content;
    }

    const profile = state.Playbooks[pIdx];
    if (!profile) return content;

    // Show global issues + issues for this playbook only.
    const relevant = _issues.filter(i =>
        i.scope === "global" || ((i.scope === "playbook" || i.scope === "step") && i.pIdx === pIdx));
    if (relevant.length) content.appendChild(renderValidationBanner(relevant));

    // Playbook header
    const isDefault = state.DefaultPlaybook === profile.Name;
    content.appendChild(h("div", { class: "playbook-content-header" },
        h("div", { class: "playbook-content-title" },
            h("span", null, profile.Name || `Playbook ${pIdx + 1}`),
            isDefault ? h("span", { class: "pill default" }, "default") : null,
            profile.TestMode ? h("span", { class: "pill test-mode" }, "test mode") : null,
            profile.Addon ? h("span", { class: "pill addon" }, "addon") : null
        ),
        h("div", { class: "playbook-content-actions" },
            btn("Playbook Settings", () => openProfileEditor(pIdx)),
            btn("Duplicate", () => {
                state.Playbooks.splice(pIdx + 1, 0, JSON.parse(JSON.stringify(profile)));
                renderCanvas(); updatePreview();
            }),
            btn("Delete", () => {
                if (!confirm(`Delete playbook "${profile.Name || "untitled"}"?`)) return;
                state.Playbooks.splice(pIdx, 1);
                renderCanvas(); updatePreview();
            }, "danger")
        )
    ));

    function addStep() {
        openStepCatalog(pIdx, profile.Steps.length);
    }

    if (profile.Steps.length === 0) {
        content.appendChild(h("div", { class: "step-list-empty-cta", onclick: addStep },
            h("div", { class: "cta-icon" }, "＋"),
            h("div", { class: "cta-title" }, "Add your first step"),
            h("div", { class: "cta-sub" }, "Pick from the catalogue — installs, waits, dialogs — or start blank")
        ));
    } else {
        content.appendChild(renderStepList(profile, pIdx));
        content.appendChild(h("div", { style: "display:flex;justify-content:center;" },
            h("button", { class: "step-list-add",
                "data-tooltip": "Add a new step to this playbook",
                onclick: addStep
            }, "+ Add step")
        ));
    }

    return content;
}

function renderStepInsertBtn(pIdx, insertIdx) {
    return h("div", { class: "step-insert" },
        h("button", {
            class: "step-insert-btn",
            "data-tooltip": "Insert step here",
            onclick: e => { e.stopPropagation(); openStepCatalog(pIdx, insertIdx); }
        }, "+")
    );
}

function renderStepList(profile, pIdx) {
    const list = h("div", { class: "step-list" });
    if (profile.Steps.length === 0) return list;

    profile.Steps.forEach((st, sIdx) => {
        list.appendChild(renderStepRow(st, pIdx, sIdx));
        const branchKey = `${pIdx}:${sIdx}`;
        if (st.OnSuccess || st.OnFailure || ui.expandedBranches.has(branchKey)) {
            list.appendChild(renderBranchBlock(st, pIdx, sIdx, profile.Steps));
        }
        // Insert button between this step and the next.
        if (sIdx < profile.Steps.length - 1) {
            list.appendChild(renderStepInsertBtn(pIdx, sIdx + 1));
        }
    });

    // Drop onto empty area at end of list.
    list.addEventListener("dragover", e => {
        if (e.dataTransfer.types.includes("application/enrollinator-step")) e.preventDefault();
    });
    list.addEventListener("drop", e => {
        const raw = e.dataTransfer.getData("application/enrollinator-step");
        if (!raw) return;
        e.preventDefault();
        const { from, idx } = JSON.parse(raw);
        moveStep(from, idx, pIdx, profile.Steps.length);
    });

    return list;
}

const SETTINGS_TABS = [
    { id: "identity", label: "Playbook Identity" },
    { id: "branding", label: "Branding" },
    { id: "runtime",  label: "Runtime" },
    { id: "hardware", label: "Hardware Info" },

function openSettingsPopover(triggerEl) {
    if (ui.settingsOpen) {
        closeSettingsPopover();
        return;
    }
    ui.settingsOpen = true;
    renderCanvas(); // refresh button active state

    const backdrop = h("div", { class: "popover-backdrop", onclick: closeSettingsPopover });

    const tabBar = h("div", { class: "popover-tab-bar", id: "settings-tab-bar" },
        ...SETTINGS_TABS.map(t =>
            h("button", {
                class: "popover-tab" + (ui.settingsTab === t.id ? " active" : ""),
                "data-tab": t.id,
                onclick: () => {
                    ui.settingsTab = t.id;
                    document.querySelectorAll("#settings-tab-bar .popover-tab")
                        .forEach(el => el.classList.toggle("active", el.dataset.tab === t.id));
                    renderSettingsBody();
                }
            }, t.label)
        )
    );

    const body = h("div", { class: "popover-body", id: "settings-popover-body" });

    const popover = h("div", { class: "settings-popover" }, tabBar, body);

    const root = document.getElementById("popover-root");
    root.innerHTML = "";
    root.append(backdrop, popover);
    centrePopoverOnCanvas(popover);
    renderSettingsBody();
}

/** Centre a popover horizontally over the canvas, just below its top edge.
 *  Measures the popover after insertion rather than assuming a width — the
 *  width lives in CSS, and guessing it here drifts the popover off-centre. */
function centrePopoverOnCanvas(popover) {
    const cr = localRect(document.getElementById("canvas"));
    popover.style.left = (cr.left + (cr.width - popover.offsetWidth) / 2) + "px";
    popover.style.top  = (cr.top + 20) + "px";
}

function closeSettingsPopover() {
    ui.settingsOpen = false;
    document.getElementById("popover-root").innerHTML = "";
    renderCanvas(); // refresh button active state
}

// Stand-alone popover for the Welcome Screen tile.  Lives outside the main
// Settings popover (it's not in SETTINGS_TABS) so the Welcome Screen has its
// own dedicated launcher button above the step list.  Reuses the same
// .settings-popover styling for visual consistency.
function openWelcomePopover(triggerEl) {
    if (ui.welcomeOpen) { closeWelcomePopover(); return; }
    if (ui.settingsOpen) closeSettingsPopover();
    ui.welcomeOpen = true;
    renderCanvas();

    const backdrop = h("div", { class: "popover-backdrop", onclick: closeWelcomePopover });
    const tabBar = h("div", { class: "popover-tab-bar" },
        h("button", { class: "popover-tab active" }, "Welcome Screen")
    );
    const body = h("div", { class: "popover-body", id: "welcome-popover-body" });
    body.appendChild(renderWelcomeScreenTile());

    const popover = h("div", { class: "settings-popover" }, tabBar, body);

    const root = document.getElementById("popover-root");
    root.innerHTML = "";
    root.append(backdrop, popover);
    centrePopoverOnCanvas(popover);
}

function closeWelcomePopover() {
    ui.welcomeOpen = false;
    document.getElementById("popover-root").innerHTML = "";
    renderCanvas();
}

// Re-render whichever popover is currently open.  Called by tile renderers
// after toggling state that affects which sub-fields are visible (e.g.
// flipping Welcome Screen's Enabled checkbox).
function reopenSettings() {
    if (ui.settingsOpen) {
        renderSettingsBody();
    } else if (ui.welcomeOpen) {
        const body = document.getElementById("welcome-popover-body");
        if (!body) return;
        body.innerHTML = "";
        body.appendChild(renderWelcomeScreenTile());
    }
}

function renderSettingsBody() {
    const body = document.getElementById("settings-popover-body");
    if (!body) return;
    body.innerHTML = "";
    switch (ui.settingsTab) {
        case "identity": body.appendChild(renderIdentityTile()); break;
        case "branding": body.appendChild(renderBrandingTile()); break;
        case "runtime":  body.appendChild(renderRuntimeTile()); break;
        case "hardware": body.appendChild(renderHardwareInfoTile()); break;
        case "help":     body.appendChild(renderHelpTile()); break;
        case "addons":   body.appendChild(renderAddonPickerTile()); break;
    }
}

// Renders an optional path field. Shows a dashed "+ Add" button when the
// value is empty and the field hasn't been explicitly expanded; once open,
// shows the text input with a Remove button to collapse it again.
function optionalTextRow(label, key, value, onUpdate, placeholder, hintText) {
    const isOpen = !!(value) || ui.expandedOptional.has(key);
    if (isOpen) {
        return row(label,
            h("div", { class: "inline-color" },
                textInput(value, v => { onUpdate(v); updatePreview(); }, placeholder),
                h("button", { class: "btn-secondary", onclick: () => {
                    onUpdate("");
                    ui.expandedOptional.delete(key);
                    updatePreview(); reopenSettings();
                }}, "Remove")
            ),
            ...(hintText ? [hint(hintText)] : [])
        );
    }
    return row(label,
        h("button", { class: "optional-add-btn", onclick: () => {
            ui.expandedOptional.add(key);
            reopenSettings();
        }}, "+ Add")
    );
}

/** Like optionalTextRow but uses renderIconInput so SF= fields get the animation picker. */
function optionalIconRow(label, key, value, onUpdate) {
    const isOpen = !!(value) || ui.expandedOptional.has(key);
    if (isOpen) {
        const removeBtn = h("button", { class: "btn-secondary", style: "flex-shrink:0", onclick: () => {
            onUpdate("");
            ui.expandedOptional.delete(key);
            updatePreview(); reopenSettings();
        }}, "Remove");
        const inputNodes = renderIconInput(value, v => { onUpdate(v); updatePreview(); }, reopenSettings);
        // Wrap text input + remove button on the same line, hints below.
        const [inputEl, ...extra] = inputNodes;
        const firstLine = h("div", { class: "inline-color" }, inputEl, removeBtn);
        return row(label, firstLine, ...extra);
    }
    return row(label,
        h("button", { class: "optional-add-btn", onclick: () => {
            ui.expandedOptional.add(key);
            reopenSettings();
        }}, "+ Add")
    );
}

            const isOn = hw.Fields.includes(token);
            grid.appendChild(h("label", { class: "check-row",
                style: "gap:6px;font-size:12px;color:var(--text)" },
                h("input", { type: "checkbox", checked: isOn,
                    onchange: e => {
                        if (e.target.checked) {
                            if (!hw.Fields.includes(token)) hw.Fields.push(token);
                        } else {
                            hw.Fields = hw.Fields.filter(x => x !== token);
                        }
                        updatePreview();
                    } }),
                h("span", null, label)));
        }
        tile.append(row("Fields", grid,
            hint("Shown in the order checked here. Uncheck all to hide the panel.")));
    }
    return tile;
}

// Canvas: lanes (one per profile) with draggable step cubes.

function renderStepRow(step, pIdx, sIdx) {
    const stepRow = h("div", { class: "step-row", draggable: "true",
        onclick: () => openStepEditor(pIdx, sIdx) });
    stepRow.dataset.pidx = String(pIdx);
    stepRow.dataset.sidx = String(sIdx);

    stepRow.appendChild(h("span", { class: "step-row-handle",
        "data-tooltip": "Drag to reorder · drop onto a sidebar playbook to move",
        onclick: e => e.stopPropagation() }, "⋮⋮"));

    stepRow.appendChild(h("span", { class: "step-row-num" }, String(sIdx + 1)));

    // Icon
    const icon = h("div", { class: "step-row-icon" });
    if (step.Icon) {
        if (/^https?:\/\//i.test(step.Icon)) {
            icon.appendChild(h("img", { src: step.Icon, alt: "" }));
        } else if (/^SF=/i.test(step.Icon)) {
            icon.textContent = "􀀳";
            icon.title = step.Icon;
        } else {
            icon.textContent = "📦";
            icon.title = step.Icon;
        }
    } else {
        icon.textContent = (step.Name || step.Id || "?").trim().charAt(0).toUpperCase() || "?";
    }
    stepRow.appendChild(icon);

    // Body
    const body = h("div", { class: "step-row-body" });
    body.appendChild(h("div", { class: "step-row-name" }, step.Name || "(unnamed step)"));

    const meta = h("div", { class: "step-row-meta" });
    meta.appendChild(h("span", { class: "step-row-id" }, step.Id || "no id"));

    const badges = h("div", { class: "cube-badges" });
    if (step.Action) badges.appendChild(h("span", { class: "tag action" }, step.Action.Type));
    if (step.Conditions && step.Conditions.length)
        badges.appendChild(h("span", { class: "tag conds" },
            `${step.Conditions.length} cond${step.Conditions.length === 1 ? "" : "s"}`));
    if (step.Blocking) badges.appendChild(h("span", { class: "tag blocking" }, "blocking"));
    meta.appendChild(badges);

    const stepErrors = _issues.filter(i => i.scope === "step" && i.pIdx === pIdx && i.sIdx === sIdx);
    if (stepErrors.length) {
        stepRow.classList.add("has-error");
        meta.appendChild(h("span", {
            class: "step-row-error-badge",
            title: stepErrors.map(e => e.message).join("\n")
        }, `⚠ ${stepErrors.length}`));
    }

    body.appendChild(meta);
    stepRow.appendChild(body);

    // Actions
    const actions = h("div", { class: "step-row-actions",
        onclick: e => e.stopPropagation() });
    const branchKey = `${pIdx}:${sIdx}`;
    const branchActive = !!(step.OnSuccess || step.OnFailure) || ui.expandedBranches.has(branchKey);
    actions.appendChild(h("button", {
        class: "btn" + (branchActive ? " branch-btn-active" : ""),
        "data-tooltip": branchActive ? "Remove if/else branch" : "Add if/else branch",
        onclick: e => {
            e.stopPropagation();
            if (branchActive) {
                // Clean toggle: clearing OnSuccess/OnFailure too means a single
                // click always removes the branch, no matter what's selected.
                // (Used to require the user to first reset both dropdowns to
                // default before this button would collapse the panel — which
                // also meant non-default selections silently survived.)
                step.OnSuccess = "";
                step.OnFailure = "";
                ui.expandedBranches.delete(branchKey);
            } else {
                ui.expandedBranches.add(branchKey);
            }
            renderCanvas(); updatePreview();
        } }, "⎇"));
    actions.appendChild(h("button", { class: "btn", "data-tooltip": "Duplicate step",
        onclick: e => {
            e.stopPropagation();
            const copy = JSON.parse(JSON.stringify(step));
            if (copy.Id) copy.Id = copy.Id + "-copy";
            if (copy.Name) copy.Name = copy.Name + " (copy)";
            state.Playbooks[pIdx].Steps.splice(sIdx + 1, 0, copy);
            renderCanvas(); updatePreview();
        } }, "⎘"));
    actions.appendChild(h("button", { class: "btn danger", "data-tooltip": "Delete step",
        onclick: e => {
            e.stopPropagation();
            state.Playbooks[pIdx].Steps.splice(sIdx, 1);
            renderCanvas(); updatePreview();
        } }, "✕"));
    stepRow.appendChild(actions);

    // Drag source
    stepRow.addEventListener("dragstart", e => {
        e.stopPropagation();
        e.dataTransfer.setData("application/enrollinator-step",
            JSON.stringify({ from: pIdx, idx: sIdx }));
        e.dataTransfer.effectAllowed = "move";
        stepRow.classList.add("dragging");
    });
    stepRow.addEventListener("dragend", () => {
        stepRow.classList.remove("dragging", "drop-before", "drop-after");
        document.querySelectorAll(".step-row.drop-before, .step-row.drop-after")
            .forEach(r => r.classList.remove("drop-before", "drop-after"));
    });

    // Drop target — top/bottom half = before/after
    stepRow.addEventListener("dragover", e => {
        if (!e.dataTransfer.types.includes("application/enrollinator-step")) return;
        e.preventDefault(); e.stopPropagation();
        const rect = stepRow.getBoundingClientRect();
        const before = (e.clientY - rect.top) < rect.height / 2;
        stepRow.classList.toggle("drop-before", before);
        stepRow.classList.toggle("drop-after", !before);
    });
    stepRow.addEventListener("dragleave", () => {
        stepRow.classList.remove("drop-before", "drop-after");
    });
    stepRow.addEventListener("drop", e => {
        const raw = e.dataTransfer.getData("application/enrollinator-step");
        if (!raw) return;
        e.preventDefault(); e.stopPropagation();
        const rect = stepRow.getBoundingClientRect();
        const before = (e.clientY - rect.top) < rect.height / 2;
        stepRow.classList.remove("drop-before", "drop-after");
        const { from, idx } = JSON.parse(raw);
        moveStep(from, idx, pIdx, sIdx + (before ? 0 : 1));
    });

    return stepRow;
}

// Move a step from {fromPIdx, fromSIdx} to {toPIdx, toSIdx-ish}.
// The target index is interpreted as the index AFTER removal of the source.
function moveStep(fromPIdx, fromSIdx, toPIdx, toSIdx) {
    const src = state.Playbooks[fromPIdx];
    const dst = state.Playbooks[toPIdx];
    if (!src || !dst) return;
    const [moved] = src.Steps.splice(fromSIdx, 1);
    if (fromPIdx === toPIdx && toSIdx > fromSIdx) toSIdx--;
    dst.Steps.splice(toSIdx, 0, moved);
    renderCanvas(); updatePreview();
}

// ============================================================================
// Modal infrastructure
// ============================================================================

function closeModal() {
    if (ui.pendingStep) {
        const { pIdx, sIdx } = ui.pendingStep;
        state.Playbooks[pIdx].Steps.splice(sIdx, 1);
        ui.pendingStep = null;
    }
    document.getElementById("modal-root").innerHTML = "";
    ui.openStep = null;
    ui.draftStep = null;
}

function openModal(titleNode, bodyNode, footerNode) {
    const root = document.getElementById("modal-root");
    root.innerHTML = "";
    const backdrop = h("div", { class: "modal-backdrop",
        onclick: e => { if (e.target === backdrop) closeModal(); } });
    const modal = h("div", { class: "modal" },
        h("div", { class: "modal-header" }, titleNode,
            h("button", { class: "btn", onclick: closeModal }, "Close")),
        h("div", { class: "modal-body" }, bodyNode),
        h("div", { class: "modal-footer" }, footerNode || h("span"))
    );
    backdrop.appendChild(modal);
    root.appendChild(backdrop);
}

// ============================================================================
// Modal: profile editor (name, description, test mode, addon)
// ============================================================================

function openProfileEditor(pIdx) {
    const p = state.Playbooks[pIdx];
    const body = h("div");
    body.appendChild(renderProfileForm(p));

    const title = h("div", { class: "modal-title" },
        "Playbook",
        h("span", { class: "pill" }, p.Name || `#${pIdx + 1}`));
    const footer = h("div", null,
        btn("Done", () => { closeModal(); renderCanvas(); updatePreview(); }, "primary"));
    openModal(title, body, footer);
}

function renderProfileForm(p) {
    // Playbooks are referenced by NAME, not by index: DefaultPlaybook and
    // WelcomeScreen.PlaybookPicker.Playbooks both hold strings the runtime
    // matches exactly and case-sensitively. A rename that touched only the
    // playbook left those pointing at a name that no longer existed —
    // DefaultPlaybook is a fatal config error at enrolment (exit 2), and a
    // stale picker entry is offered to the user and then fails to resolve.
    //
    // The references are bound once, here, when the editor opens, rather than
    // re-derived from the current name on each edit: textInput fires per
    // keystroke, so matching by name would drop the link the moment the field
    // is cleared and retyped.
    const wasDefault = !!p.Name && state.DefaultPlaybook === p.Name;
    const pp = state.WelcomeScreen && state.WelcomeScreen.PlaybookPicker;
    const pickerIdx = (p.Name && pp && Array.isArray(pp.Playbooks))
        ? pp.Playbooks.indexOf(p.Name) : -1;

    function setPlaybookName(v) {
        p.Name = v;
        if (wasDefault) state.DefaultPlaybook = v;
        if (pickerIdx >= 0) pp.Playbooks[pickerIdx] = v;
    }

    const wrap = h("div");
    wrap.append(
        h("div", { class: "section" },
            h("div", { class: "section-title" }, "Basics"),
            row("Name",
                textInput(p.Name, setPlaybookName, "Engineering"),
                ...(wasDefault || pickerIdx >= 0 ? [
                    hint(`Renaming updates ${[
                        wasDefault ? "the default playbook setting" : null,
                        pickerIdx >= 0 ? "this playbook's entry in the welcome-screen picker" : null
                    ].filter(Boolean).join(" and ")}.`)
                ] : [])),
            row("Description",
                textInput(p.Description, v => p.Description = v)),
            row("Test mode",
                checkbox(p.TestMode, v => p.TestMode = v,
                    "Force test mode for this profile (actions skipped)")),
            row("Available as addon",
                checkbox(p.Addon, v => p.Addon = v,
                    "Show this profile in the post-install add-on picker"))
        )
    );
    return wrap;
}

// ----------------------------------------------------------------------------
// Guides — the follow-up questions a recipe asks in guided mode.
//
// A recipe already knows almost everything about the step it builds. What it
// can't know is the handful of values that are specific to your fleet: which
// policy, which bundle ID, what the dialog should say. Rather than open the
// four-tab editor and leave you to find those fields among everything else,
// guided mode asks for them one at a time and fills the rest in behind you.
//
// This is a front door, not a fence. Every question screen carries "Open the
// full editor", which hands the half-built step straight to the editor with
// the answers so far applied. Advanced mode skips guides entirely.
//
// A question is:
//   { id, ask, hint, type, placeholder, choices, optional, get(st), set(st,v) }
// type is "text" | "textarea" | "number" | "choice". A question whose `set`
// is omitted is display-only (used for the closing summary).
// ----------------------------------------------------------------------------

/** The closing question every guide shares: the name, and the icon shown beside
 *  it in the progress list. The recipe has already put a sensible value in both,
 *  so this is a confirm-and-edit, never a blank. */
function nameQuestion(hint) {
    return {
        id: "name",
        ask: "What should this step be called?",
        hint: hint || "Shown in the progress window while the step runs, next to the icon you pick here.",
        type: "name-icon",
        placeholder: "Install Google Chrome",
        get: st => st.Name,
        set: (st, v) => { st.Name = v; }
    };
}

/** Conditions all answer "how do we know this finished?", but each type stores
 *  its answer in a different key. This pairs the type picker with the one
 *  follow-up field that type needs. */
const CONDITION_ASKS = [
    { value: "app_installed", label: "An app is installed",
      desc: "Checks for an app by bundle ID.",
      ask: "Which app's bundle ID?", placeholder: "com.google.Chrome", key: "BundleId" },
    { value: "process_running", label: "A process is running",
      desc: "Checks the process list by name.",
      ask: "Which process name?", placeholder: "ZscalerTunnel", key: "Name" },
    { value: "file_exists", label: "A file exists",
      desc: "Checks for a file or folder on disk.",
      ask: "Which path should exist?", placeholder: "/Library/Preferences/com.example.plist", key: "Path" },
    { value: "profile_installed", label: "A profile is installed",
      desc: "Checks the installed configuration profiles.",
      ask: "Which profile identifier?", placeholder: "com.example.mdm.enrollment", key: "Identifier" },
    { value: "shell", label: "A command exits cleanly",
      desc: "Runs a command; exit code 0 means done.",
      ask: "Which command should exit 0?", placeholder: "/usr/bin/pgrep -q Dock", key: "Command" }
];

/** Read/write the first condition on a step, swapping its type in place. */
function firstConditionQuestions(askText) {
    return [
        {
            id: "cond-type",
            ask: askText || "How will Enrollinator know this finished?",
            hint: "The step keeps checking until this is true. You can add more checks later in the Conditions tab.",
            type: "choice",
            choices: CONDITION_ASKS,
            get: st => (st.Conditions[0] || {}).Type || "",
            set: (st, v) => {
                if (!st.Conditions[0] || st.Conditions[0].Type !== v) {
                    st.Conditions[0] = blankCondition(v);
                }
            }
        },
        {
            id: "cond-value",
            // Both the question and the field it writes depend on the type
            // chosen a screen earlier, so they're resolved at render time.
            dynamic: st => {
                const c = st.Conditions[0] || {};
                const spec = CONDITION_ASKS.find(a => a.value === c.Type) || CONDITION_ASKS[0];
                return {
                    ask: spec.ask,
                    placeholder: spec.placeholder,
                    type: spec.value === "shell" ? "textarea" : "text",
                    get: s => (s.Conditions[0] || {})[spec.key] || "",
                    set: (s, v) => { if (s.Conditions[0]) s.Conditions[0][spec.key] = v; }
                };
            }
        }
    ];
}

        nameQuestion("Taken from the walkthrough title. This is the progress-list entry, not the window itself.")
    ],
    "dialog-video": () => [
        { id: "title", ask: "What's the video called?",
          type: "text", placeholder: "Welcome to the team",
          hint: "Shown as the title, and used as the step name.",
          get: st => st.Action.Title,
          set: (st, v) => { st.Action.Title = v; st.Name = v; } },
        { id: "video", ask: "Where's the video?",
          hint: "A path on the Mac, an https:// URL, or a YouTube link. Local files play even when the network is down — worth it during enrolment.",
          type: "text", placeholder: "https://youtu.be/… or /Library/Enrollinator/welcome.mp4",
          get: st => st.Action.Video, set: (st, v) => { st.Action.Video = v; } },
        { id: "autoplay", ask: "Should it play automatically?",
          type: "choice",
          choices: [
              { value: "yes", label: "Play it automatically", desc: "Starts as soon as the window appears." },
              { value: "no", label: "Wait for them to press play", desc: "Shows the poster frame and a play button." }
          ],
          get: st => st.Action.VideoAutoplay === true ? "yes" : "no",
          set: (st, v) => { st.Action.VideoAutoplay = v === "yes" ? true : null; } },
        nameQuestion("Taken from the video title. This is the progress-list entry, not the window itself.")
    ],
    pause: () => [
        { id: "seconds", ask: "How long should it pause?",
          hint: "Seconds. Long enough for whatever you're waiting on to settle — a daemon starting, a package finishing its postinstall.",
          type: "number", placeholder: "10",
          get: st => st.Action.DurationSeconds, set: (st, v) => { st.Action.DurationSeconds = v; } },
        nameQuestion("Shown in the progress window while it waits.")
    ],
    checkpoint: () => [
        nameQuestion("Checkpoints show up as branch targets by this name, so make it easy to recognise in the If/else dropdowns.")
    ],
    "custom-shell": () => [
        { id: "command", ask: "What command should run?",
          hint: "Passed to /bin/sh -c. Use absolute paths — the run environment is minimal, and $PATH is not what your shell gives you.",
          type: "textarea", placeholder: "/usr/bin/defaults write com.example.app SomeKey -bool true",
          get: st => st.Action.Command, set: (st, v) => { st.Action.Command = v; } },
        { id: "runas", ask: "Who should run it?",
          type: "choice",
          choices: [
              { value: "root", label: "root", desc: "The default. Right for anything touching /Library or system settings." },
              { value: "user", label: "The signed-in user", desc: "Right for anything writing to their home folder or their preferences domain." }
          ],
          get: st => st.Action.RunAsUser ? "user" : "root",
          set: (st, v) => { st.Action.RunAsUser = v === "user" ? "$CONSOLE_USER" : ""; } },
        nameQuestion()
    ]
};

/** The questions for a catalogue entry, or [] when it has none (Blank step,
 *  and anything at all in advanced mode). */
function guideFor(entry) {
    if (!guidedMode()) return [];
    if (entry.guide) return entry.guide();
    const make = STEP_GUIDES[entry.id];
    return make ? make() : [];
}

/** Turn an MDM_PRESETS verb into a catalogue recipe. Only verbs carrying a
 *  stepName qualify — the rest stay available through the Action tab picker. */
function recipeFromVerb(source, verb) {
    return {
        id: `${source.id}:${verb.id}`,
        group: "install",
        glyph: source.icon || "⚙️",
        name: verb.stepName,
        desc: verb.catalogDesc || verb.note || "",
        build() {
            const st = blankStep();
            st.Name = verb.stepName;
            st.Icon = verb.icon || "";
            st.Action = blankAction("shell");
            st.Action.Command = assembleMdmCommand(verb, {});
            st.Action.TimeoutSeconds = verb.timeout || null;
            // Pre-seed the picker's transient keys so the Action tab opens on
            // the right source and verb instead of re-inferring from the
            // placeholder-laden command.
            st.Action._mdmId = source.id;
            st.Action._verbId = verb.id;
            st.Action._fields = {};
            return st;
        },
        // One question per placeholder the command template leaves open, then
        // the name. A verb with no placeholders (recon, Rosetta) asks only for
        // the name — there is genuinely nothing else to decide.
        guide: () => [
            ...verb.fields.map(f => ({
                id: f.key,
                ask: f.ask || `What should “${f.label}” be?`,
                hint: f.guideHint || verb.note || "",
                type: "text",
                placeholder: (f.placeholder || "").replace(/^e\.g\.\s*/, ""),
                get: st => (st.Action._fields || {})[f.key] || "",
                set: (st, v) => {
                    if (!st.Action._fields) st.Action._fields = {};
                    st.Action._fields[f.key] = v;
                    st.Action.Command = assembleMdmCommand(verb, st.Action._fields);
                }
            })),
            nameQuestion()
        ]
    };
}

/** Every recipe on offer, ordered so the fleet's own tooling comes first. */
function catalogEntries() {
    const fromVerbs = [];
    for (const source of visibleSources(null)) {
        if (source.kind === "custom") continue;
        for (const verb of source.verbs) {
            if (verb.stepName) fromVerbs.push(recipeFromVerb(source, verb));
        }
    }
    // The fleet's MDM leads, then its extra tooling, then macOS built-ins.
    const rank = s => s === fleet.mdm ? 0 : (fleet.tools.includes(s) ? 1 : 2);
    fromVerbs.sort((a, b) => rank(a.id.split(":")[0]) - rank(b.id.split(":")[0]));
    return [...fromVerbs, ...STEP_RECIPES];
}

function openStepCatalog(pIdx, insertIdx) {
    const root = document.getElementById("modal-root");
    root.innerHTML = "";

    const entries = catalogEntries();
    let query = "";

    const bodyEl = h("div", { class: "cat-body" });

    function commit(entry) {
        const st = entry.build();
        const questions = guideFor(entry);
        if (questions.length) {
            runGuidedStep(pIdx, insertIdx, entry, st, questions);
        } else {
            // Advanced mode, or a recipe with nothing left to ask (Blank step).
            insertBuiltStep(pIdx, insertIdx, st);
            ui.pendingStep = { pIdx, sIdx: insertIdx };
            // Open on whichever tab still holds the field worth filling in.
            // Recipes name it explicitly; otherwise Action if there is one.
            openStepEditor(pIdx, insertIdx, entry.tab || (st.Action ? "action" : "info"));
        }
    }

    function paint() {
        bodyEl.innerHTML = "";
        const q = query.trim().toLowerCase();
        const matches = entries.filter(e => !q ||
            e.name.toLowerCase().includes(q) ||
            e.desc.toLowerCase().includes(q));

        if (!matches.length) {
            bodyEl.appendChild(h("div", { class: "cat-empty" },
                "Nothing matches — try \"Blank step\" and build it by hand."));
            return;
        }

        for (const group of CATALOG_GROUPS) {
            const inGroup = matches.filter(e => e.group === group.id);
            if (!inGroup.length) continue;
            const grid = h("div", { class: "cat-grid" });
            for (const entry of inGroup) {
                grid.appendChild(h("button", {
                    class: "cat-card",
                    onclick: () => commit(entry)
                },
                    h("span", { class: "cat-card-icon" }, entry.glyph),
                    h("span", { class: "cat-card-text" },
                        h("span", { class: "cat-card-name" }, entry.name),
                        entry.desc ? h("span", { class: "cat-card-desc" }, entry.desc) : null
                    )
                ));
            }
            bodyEl.appendChild(h("div", { class: "cat-group" },
                h("div", { class: "cat-group-title" }, group.label),
                grid
            ));
        }
    }
    paint();

    const search = h("input", {
        type: "text", class: "cat-search",
        placeholder: "Search — install, wait, dialog, video…",
        oninput: e => { query = e.target.value; paint(); }
    });

    const backdrop = h("div", { class: "modal-backdrop",
        onclick: e => { if (e.target === backdrop) closeModal(); } });
    const modal = h("div", { class: "modal cat-modal" },
        h("div", { class: "modal-header" },
            h("div", { class: "modal-title" }, "Add a step"),
            h("button", { class: "btn", onclick: closeModal }, "Close")),
        h("div", { class: "cat-search-row" }, search),
        bodyEl
    );
    backdrop.appendChild(modal);
    root.appendChild(backdrop);
    setTimeout(() => search.focus(), 40);
}

/** Splice a built step into a playbook, giving it a unique readable ID derived
 *  from its name so branch targets and add-on dedup have something to hold
 *  onto immediately. */
function insertBuiltStep(pIdx, insertIdx, st) {
    const profile = state.Playbooks[pIdx];
    const used = new Set(profile.Steps.map(s => s.Id).filter(Boolean));
    const base = (st.Name || "step").toLowerCase()
        .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "step";
    let id = base, n = 2;
    while (used.has(id)) id = `${base}-${n++}`;
    st.Id = id;
    profile.Steps.splice(insertIdx, 0, st);
    return st;
}

// ============================================================================
// Guided step runner — one question per screen.
//
// The step is built up in memory and only spliced into the playbook at the
// end, so abandoning the flow leaves nothing behind. "Open the full editor"
// inserts it early and hands over mid-flight with every answer so far applied,
// which is what keeps guided mode a shortcut rather than a walled garden.
// ============================================================================

function runGuidedStep(pIdx, insertIdx, entry, st, questions) {
    const root = document.getElementById("modal-root");
    let i = 0;

    /** Questions may compute their ask/get/set from answers given earlier. */
    function resolve(q) {
        return q.dynamic ? Object.assign({}, q, q.dynamic(st)) : q;
    }

    function finish() {
        insertBuiltStep(pIdx, insertIdx, st);
        ui.pendingStep = null;
        closeModal();
        renderCanvas();
        updatePreview();
    }

    function handOff() {
        insertBuiltStep(pIdx, insertIdx, st);
        ui.pendingStep = { pIdx, sIdx: insertIdx };
        openStepEditor(pIdx, insertIdx, entry.tab || (st.Action ? "action" : "info"));
    }

    function paint() {
        const q = resolve(questions[i]);
        const isLast = i === questions.length - 1;
        root.innerHTML = "";

        // Progress bar: one segment per question.
        const progress = h("div", { class: "guide-progress" },
            ...questions.map((_, n) => h("div", {
                class: "guide-dot" + (n < i ? " done" : n === i ? " active" : "")
            }))
        );

        let readValue;
        const body = h("div", { class: "guide-body" },
            h("div", { class: "guide-count" }, `Question ${i + 1} of ${questions.length}`),
            h("h2", { class: "guide-q" }, q.ask),
            q.hint ? h("p", { class: "guide-hint" }, q.hint) : null
        );

        if (q.type === "choice") {
            let picked = q.get(st) || (q.choices[0] && q.choices[0].value);
            const wrap = h("div", { class: "guide-choices" });
            const paintChoices = () => {
                wrap.innerHTML = "";
                for (const c of q.choices) {
                    wrap.appendChild(h("button", {
                        class: "guide-choice" + (picked === c.value ? " selected" : ""),
                        onclick: () => { picked = c.value; paintChoices(); }
                    },
                        h("span", { class: "guide-choice-label" }, c.label),
                        c.desc ? h("span", { class: "guide-choice-desc" }, c.desc) : null
                    ));
                }
            };
            paintChoices();
            body.appendChild(wrap);
            readValue = () => picked;
        } else if (q.type === "textarea") {
            const ta = h("textarea", { placeholder: q.placeholder || "" }, q.get(st) || "");
            body.appendChild(ta);
            readValue = () => ta.value;
            setTimeout(() => ta.focus(), 40);
        } else if (q.type === "number") {
            const raw = q.get(st);
            const input = h("input", { type: "number", min: "0",
                placeholder: q.placeholder || "",
                value: raw == null ? "" : String(raw) });
            body.appendChild(input);
            readValue = () => {
                const n = parseInt(input.value, 10);
                return Number.isFinite(n) ? n : null;
            };
            setTimeout(() => { input.focus(); input.select(); }, 40);
        } else if (q.type === "name-icon") {
            // Name and icon together: they're the two things the progress
            // window shows side by side, so it reads oddly to split them
            // across screens — and it keeps the guide one question shorter.
            const input = h("input", { type: "text",
                placeholder: q.placeholder || "", value: q.get(st) || "" });
            body.appendChild(input);

            const iconWrap = h("div", { class: "guide-icon-field" });
            // The icon control re-renders itself (the animation row appears
            // only for SF= values), so it gets its own repaint rather than
            // redrawing the whole question.
            function paintIcon() {
                iconWrap.innerHTML = "";
                iconWrap.append(
                    h("div", { class: "guide-icon-label" }, "Icon"),
                    ...renderIconInput(st.Icon, v => { st.Icon = v; }, paintIcon)
                );
            }
            paintIcon();
            body.appendChild(iconWrap);

            readValue = () => input.value.trim();
            setTimeout(() => { input.focus(); input.select(); }, 40);
        } else {
            const input = h("input", { type: "text",
                placeholder: q.placeholder || "", value: q.get(st) || "" });
            body.appendChild(input);
            readValue = () => input.value.trim();
            setTimeout(() => { input.focus(); input.select(); }, 40);
        }

        function advance() {
            const v = readValue();
            if (q.set) q.set(st, v);
            if (isLast) finish();
            else { i++; paint(); }
        }

        // Enter advances from single-line fields; a textarea keeps Enter for
        // newlines, since these messages are Markdown and want them.
        body.addEventListener("keydown", e => {
            if (e.key !== "Enter") return;
            if (e.target.tagName === "TEXTAREA" && !(e.metaKey || e.ctrlKey)) return;
            e.preventDefault();
            advance();
        });

        const nextBtn = h("button", { class: "btn primary",
            style: "height:34px;padding:0 18px;font-size:13px",
            onclick: advance
        }, isLast ? "Add step" : "Next");

        const footer = h("div", { class: "guide-footer" },
            h("button", { class: "guide-escape", onclick: handOff },
                "Open the full editor"),
            h("div", { class: "guide-nav" },
                q.optional ? h("button", {
                    class: "btn", style: "height:34px;padding:0 14px;font-size:13px",
                    onclick: () => {
                        // Skip still writes, so an emptied optional field can
                        // clear what a previous pass set.
                        if (q.set) q.set(st, q.type === "number" ? null : "");
                        if (isLast) finish(); else { i++; paint(); }
                    }
                }, "Skip") : null,
                i > 0 ? h("button", {
                    class: "btn", style: "height:34px;padding:0 14px;font-size:13px",
                    onclick: () => { i--; paint(); }
                }, "Back") : null,
                nextBtn
            )
        );

        const backdrop = h("div", { class: "modal-backdrop",
            onclick: e => { if (e.target === backdrop) closeModal(); } });
        const modal = h("div", { class: "modal guide-modal" },
            h("div", { class: "modal-header" },
                h("div", { class: "modal-title" },
                    "Add a step",
                    h("span", { class: "pill" }, entry.name)),
                h("button", { class: "btn", onclick: closeModal }, "Cancel")),
            progress, body, footer
        );
        backdrop.appendChild(modal);
        root.appendChild(backdrop);
    }

    paint();
}

// ============================================================================
// Modal: step editor — tabbed (Info / Action / Conditions / Behavior)
// ============================================================================

const STEP_TABS = [
    { id: "info",       label: "Info" },
    { id: "action",     label: "Action" },
    { id: "conditions", label: "Conditions" },
    { id: "behavior",   label: "Behavior" },
];

/** @param {string} [tab] — which tab to land on. Defaults to Info; the
 *  catalogue passes "action" so a recipe opens on the part still to fill in. */
function openStepEditor(pIdx, sIdx, tab) {
    const p = state.Playbooks[pIdx];
    const st = p.Steps[sIdx];
    if (!st) return;
    ui.openStep = { pIdx, sIdx };
    ui.stepTab = STEP_TABS.some(t => t.id === tab) ? tab : "info";
    // Clone into draft on a fresh open. reopenStep() may call back here when
    // the modal DOM was torn down; preserve any edits already in the draft.
    if (!ui.draftStep) ui.draftStep = deepClone(st);

    const root = document.getElementById("modal-root");
    root.innerHTML = "";

    const draft = ui.draftStep;
    const tabBar = h("div", { class: "modal-tab-bar" },
        ...STEP_TABS.map(t => {
            let badge = null;
            if (t.id === "action" && draft.Action)
                badge = h("span", { class: "tab-badge" }, draft.Action.Type);
            if (t.id === "conditions" && draft.Conditions.length)
                badge = h("span", { class: "tab-badge" }, String(draft.Conditions.length));
            return h("button", {
                class: "modal-tab" + (ui.stepTab === t.id ? " active" : ""),
                "data-tab": t.id,
                onclick: () => {
                    ui.stepTab = t.id;
                    document.querySelectorAll(".modal-tab-bar .modal-tab")
                        .forEach(el => el.classList.toggle("active", el.dataset.tab === t.id));
                    renderStepBody();
                }
            }, t.label, badge);
        })
    );

    const body = h("div", { class: "modal-body", id: "step-modal-body" });

    const modal = h("div", { class: "modal" },
        h("div", { class: "modal-header" },
            h("div", { class: "modal-title" },
                "Step",
                h("span", { class: "pill" }, draft.Name || draft.Id || `#${sIdx + 1}`)
            ),
            h("button", { class: "btn", onclick: closeModal }, "Close")
        ),
        tabBar,
        body,
        h("div", { class: "modal-footer" },
            btn("Delete step", () => {
                if (!confirm(`Delete step "${draft.Name || draft.Id || "untitled"}"?`)) return;
                ui.pendingStep = null; // prevent closeModal from double-removing
                ui.draftStep = null;
                p.Steps.splice(sIdx, 1);
                closeModal(); renderCanvas(); updatePreview();
            }, "danger"),
            btn("Done", () => {
                // Commit draft → live state.
                const { pIdx: _pi, sIdx: _si } = ui.openStep;
                state.Playbooks[_pi].Steps[_si] = deepClone(ui.draftStep);
                ui.draftStep = null;
                ui.pendingStep = null;
                closeModal(); renderCanvas(); updatePreview();
            }, "primary")
        )
    );

    const backdrop = h("div", { class: "modal-backdrop" });
    backdrop.appendChild(modal);
    root.appendChild(backdrop);
    renderStepBody();
}

function renderStepBody() {
    if (!ui.openStep || !ui.draftStep) return;
    const st = ui.draftStep;
    const body = document.getElementById("step-modal-body");
    if (!body) return;
    body.innerHTML = "";
    switch (ui.stepTab) {
        case "info":       body.appendChild(renderStepInfoTab(st)); break;
        case "action":     body.appendChild(renderStepActionTab(st)); break;
        case "conditions": body.appendChild(renderStepConditionsTab(st)); break;
        case "behavior":   body.appendChild(renderStepBehaviorTab(st)); break;
    }
    // Refresh tab badges from the draft.
    document.querySelectorAll(".modal-tab-bar .modal-tab").forEach(el => {
        const tid = el.dataset.tab;
        let badge = el.querySelector(".tab-badge");
        if (tid === "action") {
            if (st.Action && !badge) {
                badge = h("span", { class: "tab-badge" }, st.Action.Type);
                el.appendChild(badge);
            } else if (st.Action && badge) {
                badge.textContent = st.Action.Type;
            } else if (!st.Action && badge) {
                badge.remove();
            }
        }
        if (tid === "conditions") {
            if (st.Conditions.length && !badge) {
                badge = h("span", { class: "tab-badge" }, String(st.Conditions.length));
                el.appendChild(badge);
            } else if (st.Conditions.length && badge) {
                badge.textContent = String(st.Conditions.length);
            } else if (!st.Conditions.length && badge) {
                badge.remove();
            }
        }
    });
}

function reopenStep() {
    if (!ui.openStep) return;
    if (document.getElementById("step-modal-body")) {
        renderStepBody();
        return;
    }
    const { pIdx, sIdx } = ui.openStep;
    // Preserve the open tab — rebuilding the modal must not bounce the user
    // back to Info mid-edit.
    openStepEditor(pIdx, sIdx, ui.stepTab);
}

// ---- Info tab ---------------------------------------------------------------

function refreshIconEl(el, st) {
    el.innerHTML = "";
    if (st.Icon) {
        if (/^https?:\/\//i.test(st.Icon)) {
            el.appendChild(h("img", { src: st.Icon, alt: "" })); return;
        }
        if (/^SF=/i.test(st.Icon)) { el.textContent = "SF"; el.title = st.Icon; return; }
        el.textContent = "📦"; el.title = st.Icon; return;
    }
    el.textContent = (st.Name || st.Id || "?").trim().charAt(0).toUpperCase() || "?";
}

function renderStepInfoTab(st) {
    const iconEl = h("div", { class: "step-icon-lg" });
    refreshIconEl(iconEl, st);

    return h("div", null,
        h("div", { class: "section step-info-hero" },
            iconEl,
            h("div", { class: "step-hero-fields" },
                h("input", {
                    type: "text", class: "step-name-input",
                    value: st.Name || "", placeholder: "Step name",
                    oninput: e => {
                        st.Name = e.target.value;
                        refreshIconEl(iconEl, st);
                        updatePreview();
                    }
                }),
                h("input", {
                    type: "text", class: "step-id-input",
                    value: st.Id || "", placeholder: "step-id",
                    oninput: e => { st.Id = e.target.value; updatePreview(); }
                })
            )
        ),
        h("div", { class: "context-banner" },
            h("b", null, "Name"), " is shown in the progress window as the step runs. ",
            h("b", null, "Id"), " is a machine-readable key used in branch targets, log output, and add-on deduplication — use lowercase-with-hyphens and keep it unique within the playbook."
        ),
        h("div", { class: "section" },
            h("div", { class: "section-title" }, "Details"),
            row("Description", textInput(st.Description, v => st.Description = v)),
            row("Icon",
                ...renderIconInput(st.Icon, v => {
                    st.Icon = v;
                    const prev = document.querySelector(".step-icon-lg");
                    if (prev) refreshIconEl(prev, st);
                }, reopenStep)
            )
        )
    );
}

// ---- Action tab -------------------------------------------------------------

function renderStepActionTab(st) {
    const wrap = h("div");

    if (!st.Action) {
        wrap.appendChild(
            h("div", { class: "section action-empty" },
                h("div", { class: "action-empty-icon" }, "⚡"),
                h("p", null, "An action is something Enrollinator ", h("em", null, "does"), " — install a package, run a shell command, show a dialog, or pause. It runs once at the start of the step, before conditions are checked. Actions are optional; leave this empty to make a condition-only step."),
                h("div", { class: "action-empty-label" }, "Choose an action type"),
                h("div", { class: "type-grid", style: "justify-content:center" },
                    ...ACTION_TYPES.map(t =>
                        h("button", { class: "type-grid-btn", onclick: () => {
                            st.Action = blankAction(t);
                            renderCanvas(); updatePreview(); reopenStep();
                        }}, t)
                    )
                )
            )
        );
        return wrap;
    }

    wrap.append(
        h("div", { class: "section" },
            h("div", { class: "section-title" },
                "Action type",
                btn("Remove", () => { st.Action = null; renderCanvas(); updatePreview(); reopenStep(); }, "danger")
            ),
            h("div", { class: "seg-control" },
                ...ACTION_TYPES.map(t =>
                    h("button", {
                        class: "seg-btn" + (st.Action.Type === t ? " active" : ""),
                        onclick: () => { st.Action = blankAction(t); renderCanvas(); updatePreview(); reopenStep(); }
                    }, t)
                )
            )
        )
    );

    if (st.Action.Type === "noop") {
        wrap.append(h("div", { class: "section" },
            hint("The noop action always succeeds — useful for condition-only steps.")));
    } else {
        wrap.append(h("div", { class: "section" },
            h("div", { class: "section-title" }, "Configuration"),
            ...actionFields(st.Action)
        ));
    }

    return wrap;
}

// ---- Conditions tab ---------------------------------------------------------

function renderStepConditionsTab(st) {
    const wrap = h("div");

    wrap.appendChild(h("div", { class: "context-banner" },
        "Conditions are ", h("em", null, "checks"), " that must pass for the step to succeed — is an app installed? is a process running? did a file appear? They are evaluated ", h("em", null, "after"), " the action runs. Multiple conditions are AND-ed: every one must pass. If any fail and the step is ", h("b", null, "Blocking"), ", Enrollinator keeps polling until they all pass."
    ));

    if (st.Conditions.length === 0) {
        wrap.appendChild(h("div", { class: "empty-state" },
            "No conditions — step succeeds as soon as its action completes."));
    } else {
        st.Conditions.forEach((c, i) => wrap.appendChild(renderConditionCard(c, i, st)));
    }

    wrap.appendChild(
        h("div", { class: "section" },
            h("div", { class: "section-title" }, "Add condition"),
            h("div", { class: "type-grid" },
                ...CONDITION_TYPES.map(t =>
                    h("button", { class: "type-grid-btn", onclick: () => {
                        st.Conditions.push(blankCondition(t));
                        reopenStep(); updatePreview();
                    }}, `+ ${t}`)
                )
            )
        )
    );
    return wrap;
}
