// ---- Branch tab -------------------------------------------------------------

// ---- Inline branch block rendered in the flow --------------------------------

function renderBranchBlock(st, pIdx, sIdx, steps) {
    const branchKey = `${pIdx}:${sIdx}`;

    function makeSelect(currentValue, opts) {
        // opts: array of { value, label, group? }
        const sel = h("select", { class: "branch-inline-select" });
        let grp = null;
        opts.forEach(o => {
            if (o.group !== undefined) {
                grp = document.createElement("optgroup");
                grp.label = o.group;
                sel.appendChild(grp);
                return;
            }
            const opt = document.createElement("option");
            opt.value = o.value;
            opt.textContent = o.label;
            (grp || sel).appendChild(opt);
        });
        sel.value = currentValue || "";
        return sel;
    }

    function stepOptions(skipSelf) {
        const opts = [];
        opts.push({ group: "Jump to step" });
        steps.forEach((s, i) => {
            if (i === skipSelf) return;
            opts.push({
                value: s.Id || `step-${i}`,
                label: `${i + 1}. ${s.Name || s.Id || `(step ${i + 1})`}`
            });
        });
        return opts;
    }

    // Success select: default = next step
    const successOpts = [
        { value: "", label: "▶ Continue to next step" },
        { value: "$end", label: "⏹ End run" },
        ...stepOptions(sIdx)
    ];
    const successSel = makeSelect(st.OnSuccess, successOpts);
    successSel.addEventListener("change", e => {
        st.OnSuccess = e.target.value;
        if (st.OnSuccess || st.OnFailure) ui.expandedBranches.add(branchKey);
        renderCanvas(); updatePreview();
    });

    // Failure options mirror successOpts.  "" and "$next" used to coexist
    // here but at runtime they're identical (both do i+=1 in the main loop)
    // — and "Stop run" was mislabelled (nothing actually stops the run on
    // OnFailure="", any_fail just gets set for the final exit code).  Drop
    // "$next" and relabel "" so the two dropdowns read in parallel.
    const failureOpts = [
        { value: "",     label: "▶ Continue to next step" },
        { value: "$end", label: "⏹ End run" },
        ...stepOptions(sIdx)
    ];
    const failureSel = makeSelect(st.OnFailure, failureOpts);
    failureSel.addEventListener("change", e => {
        st.OnFailure = e.target.value;
        if (st.OnSuccess || st.OnFailure) ui.expandedBranches.add(branchKey);
        renderCanvas(); updatePreview();
    });

    function removeBtn() {
        return h("button", {
            class: "branch-remove-btn",
            title: "Remove branch",
            onclick: e => {
                e.stopPropagation();
                st.OnSuccess = "";
                st.OnFailure = "";
                ui.expandedBranches.delete(branchKey);
                renderCanvas(); updatePreview();
            }
        }, "✕");
    }

    return h("div", { class: "branch-block" },
        h("div", { class: "branch-block-spine" }),
        h("div", { class: "branch-block-body" },
            h("div", { class: "branch-block-header" },
                h("span", { class: "branch-block-title" }, "⎇ If / Else"),
                h("span", { class: "branch-block-subtitle" }, "Choose where to go based on this step's outcome"),
                removeBtn()
            ),
            h("div", { class: "branch-row success" },
                h("span", { class: "branch-row-label success" }, "✓ If succeeds"),
                successSel
            ),
            h("div", { class: "branch-row failure" },
                h("span", { class: "branch-row-label failure" }, "✗ If fails"),
                failureSel
            )
        )
    );
}

function renderWaitWindowFields(st) {
    if (!st.WaitWindow) {
        return [hint("A secondary swiftDialog window shown while polling. Recommended for blocking steps with a multi-step user workflow.")];
    }
    const ww = st.WaitWindow;
    // Normalize any legacy plain-string entries in-place before rendering
    ww.Slideshow = (ww.Slideshow || []).map(normalizeSlide);

    // Derive or restore media mode (transient — ignored by serializer)
    if (!ww._mediaMode) {
        ww._mediaMode = ww.Video ? "video" : (ww.Slideshow.length > 0 ? "slideshow" : "off");
    }
    const mode = ww._mediaMode;

    function switchWwMode(val) {
        if      (val === "off")       { ww.Video = ""; ww.Slideshow = []; }
        else if (val === "slideshow") { ww.Video = ""; }
        else if (val === "video")     { ww.Slideshow = []; }
        ww._mediaMode = val;
        updatePreview(); reopenStep();
    }

    // Segmented media picker
    const mediaModes = [["off", "None"], ["slideshow", "Slideshow"], ["video", "Video"]];
    const mediaPicker = h("div", { style: "display:inline-flex;border-radius:7px;overflow:hidden;border:1px solid var(--border)" },
        ...mediaModes.map(([val, label], idx) =>
            h("button", {
                class: "btn" + (mode === val ? " btn--active" : ""),
                style: "border-radius:0;border:none;" + (idx < mediaModes.length - 1 ? "border-right:1px solid var(--border);" : ""),
                onclick: () => switchWwMode(val)
            }, label)
        )
    );

    // Slideshow frame editor
    const slidesWrap = h("div", { style: "display:flex;flex-direction:column;gap:8px;margin-top:8px" });
    if (ww.Slideshow.length === 0)
        slidesWrap.appendChild(hint("No frames. Add one for a still image; 2+ for a user-clicked slideshow."));
    ww.Slideshow.forEach((slide, i) => {
        slidesWrap.appendChild(h("div", {
            style: "display:flex;flex-direction:column;gap:6px;padding:10px 10px 8px;background:var(--hover-fill);border-radius:7px;border:1px solid var(--hairline)"
        },
            h("div", { style: "display:flex;align-items:center;gap:6px;margin-bottom:2px" },
                h("span", { style: "font-size:10px;font-weight:700;text-transform:uppercase;color:var(--text-faint);letter-spacing:0.08em;flex:1" },
                    `Frame ${i + 1}`),
                btn("↑", () => { move(ww.Slideshow, i, -1); reopenStep(); }, "icon"),
                btn("↓", () => { move(ww.Slideshow, i,  1); reopenStep(); }, "icon"),
                btn("✕", () => { ww.Slideshow.splice(i, 1); reopenStep(); updatePreview(); }, "danger")
            ),
            row("Image", h("input", { type: "text", value: slide.Image || "",
                placeholder: "/path/img.png or https://…", style: "flex:1",
                oninput: e => { slide.Image = e.target.value; updatePreview(); } })),
            row("Title", h("input", { type: "text", value: slide.Title || "",
                placeholder: "Overrides window title for this slide (optional)",
                oninput: e => { slide.Title = e.target.value; } })),
            row("Message", h("textarea", {
                placeholder: "Overrides message for this slide (Markdown, optional)",
                oninput: e => { slide.Message = e.target.value; }
            }, slide.Message || ""))
        ));
    });
    slidesWrap.appendChild(btn("+ Add frame", () => {
        ww.Slideshow.push({ Image: "", Title: "", Message: "" }); reopenStep();
    }));

    // Video URL + autoplay
    const wwVideoInput = h("input", { type: "text", value: ww.Video || "",
        placeholder: "/path/video.mp4, https://… or YouTube URL", style: "flex:1",
        oninput: e => { ww.Video = e.target.value; updatePreview(); } });
    const wwAutoplayBtn = h("button", {
        class: "btn" + (ww.VideoAutoplay === true ? " btn--active" : ""),
        style: "white-space:nowrap;flex-shrink:0",
        onclick: () => { ww.VideoAutoplay = ww.VideoAutoplay === true ? null : true; updatePreview(); reopenStep(); }
    }, "▶ Autoplay");
    const wwVideoSection = h("div", { style: "display:flex;gap:6px;align-items:center;margin-top:8px" },
        wwVideoInput, wwAutoplayBtn
    );

    return [
        row("Title",   textInput(ww.Title, v => ww.Title = v, "Defaults to step name")),
        row("Message", h("textarea", {
            oninput: e => { ww.Message = e.target.value; updatePreview(); },
            placeholder: "Markdown body."
        }, ww.Message || "")),
        row("Font sizes",
            h("div", { style: "display:flex;gap:8px;align-items:center" },
                h("span", { style: "font-size:11px;color:var(--text-4);white-space:nowrap" }, "Title"),
                h("input", { type: "number", min: "0", style: "width:58px",
                    value: ww.TitleFontSize == null ? "" : String(ww.TitleFontSize), placeholder: "default",
                    oninput: e => { const v = parseInt(e.target.value, 10); ww.TitleFontSize = Number.isFinite(v) ? v : null; updatePreview(); } }),
                h("span", { style: "font-size:11px;color:var(--text-4);white-space:nowrap;margin-left:4px" }, "Body"),
                h("input", { type: "number", min: "0", style: "width:58px",
                    value: ww.MessageFontSize == null ? "" : String(ww.MessageFontSize), placeholder: "default",
                    oninput: e => { const v = parseInt(e.target.value, 10); ww.MessageFontSize = Number.isFinite(v) ? v : null; updatePreview(); } })
            )
        ),
        row("Size",
            h("div", { style: "display:flex;gap:8px;align-items:center" },
                h("span", { style: "font-size:11px;color:var(--text-4);white-space:nowrap" }, "W"),
                h("input", { type: "number", min: "0", style: "width:62px",
                    value: ww.Width == null ? "" : String(ww.Width), placeholder: "520",
                    oninput: e => { const v = parseInt(e.target.value, 10); ww.Width = Number.isFinite(v) ? v : null; updatePreview(); } }),
                h("span", { style: "font-size:11px;color:var(--text-4);white-space:nowrap;margin-left:4px" }, "H"),
                h("input", { type: "number", min: "0", style: "width:62px",
                    value: ww.Height == null ? "" : String(ww.Height), placeholder: "420",
                    oninput: e => { const v = parseInt(e.target.value, 10); ww.Height = Number.isFinite(v) ? v : null; updatePreview(); } })
            )
        ),
        h("div", { class: "pair-row" },
            row("Blur screen",   triStateSelect(ww.Blur,        v => { ww.Blur        = v; updatePreview(); })),
            row("Always on top", triStateSelect(ww.AlwaysOnTop, v => { ww.AlwaysOnTop = v; updatePreview(); }))
        ),
        row("Media", h("div", null,
            mediaPicker,
            ...(mode === "slideshow" ? [slidesWrap]    : []),
            ...(mode === "video"     ? [wwVideoSection] : [])
        ))
    ];
}

function actionFields(a) {
    if (a.Type === "noop") {
        return [hint("The noop action always succeeds — useful for condition-only steps.")];
    }
    if (a.Type === "shell") {
        // Infer MDM/verb from existing command on first render
        if (a._mdmId === undefined) {
            const match = inferMdmSelection(a.Command);
            if (match) {
                a._mdmId = match.mdmId;
                a._verbId = match.verbId;
                a._fields = match.fields;
            } else {
                a._mdmId = a.Command ? "custom" : null;
                a._verbId = null;
                a._fields = {};
            }
        }

        const rows = [];
        // Narrowed to the fleet's own tooling — but always including whatever
        // this action already uses, so an imported config never edits against
        // a picker that has hidden its own source.
        const sources = visibleSources(a._mdmId);
        const mdmOptions = [["", "— Select MDM / source —"], ...sources.map(m => [m.id, m.label])];
        rows.push(row("MDM / source",
            selectInput(a._mdmId || "", mdmOptions, v => {
                a._mdmId = v || null;
                a._verbId = null;
                a._fields = {};
                if (!v || v === "custom") {
                    a.Command = "";
                    a.TimeoutSeconds = null;
                } else {
                    const mdm = MDM_PRESETS.find(m => m.id === v);
                    if (mdm && mdm.verbs.length === 1) {
                        a._verbId = mdm.verbs[0].id;
                        a.TimeoutSeconds = mdm.verbs[0].timeout;
                        a.Command = assembleMdmCommand(mdm.verbs[0], {});
                    }
                }
                reopenStep(); updatePreview();
            }),
            ...(sourcesAreFiltered(a._mdmId) ? [
                h("div", { class: "source-filter-note" },
                    // "Narrowed to" rather than an exhaustive list: a step
                    // carrying a source from outside the fleet keeps it in the
                    // dropdown, so naming only the rule stays accurate.
                    h("span", null,
                        `Narrowed to ${sourceById(fleet.mdm).label}, macOS built-ins and your tooling.`),
                    h("button", {
                        onclick: () => {
                            fleet.showAllSources = true;
                            saveFleetPrefs();
                            reopenStep();
                        }
                    }, "Show all sources"))
            ] : []),
            ...(fleet.showAllSources && fleet.mdm ? [
                h("div", { class: "source-filter-note" },
                    h("span", null, "Showing every source."),
                    h("button", {
                        onclick: () => {
                            fleet.showAllSources = false;
                            saveFleetPrefs();
                            reopenStep();
                        }
                    }, `Narrow to ${sourceById(fleet.mdm).label}`))
            ] : [])
        ));

        const activeMdm = MDM_PRESETS.find(m => m.id === a._mdmId);

        if (activeMdm && activeMdm.id !== "custom" && activeMdm.verbs.length > 0) {
            const verbOptions = [["", "— Select action —"], ...activeMdm.verbs.map(v => [v.id, v.label])];
            rows.push(row("Action",
                selectInput(a._verbId || "", verbOptions, v => {
                    a._verbId = v || null;
                    a._fields = {};
                    const verb = activeMdm.verbs.find(vb => vb.id === v);
                    if (verb) {
                        a.TimeoutSeconds = verb.timeout;
                        a.Command = assembleMdmCommand(verb, {});
                    } else {
                        a.Command = "";
                    }
                    reopenStep(); updatePreview();
                })
            ));
        }

        const activeVerb = activeMdm && activeMdm.verbs.find(v => v.id === a._verbId);

        if (activeVerb && activeVerb.fields.length > 0) {
            if (!a._fields) a._fields = {};
            for (const f of activeVerb.fields) {
                rows.push(row(f.label,
                    textInput(a._fields[f.key] || "", v => {
                        if (!a._fields) a._fields = {};
                        a._fields[f.key] = v;
                        a.Command = assembleMdmCommand(activeVerb, a._fields);
                        updatePreview();
                    }, f.placeholder)
                ));
            }
        }

        if (activeVerb && activeVerb.note) {
            rows.push(hint(activeVerb.note));
        }

        if (!activeMdm || activeMdm.id === "custom") {
            rows.push(row("Command",
                h("textarea", { oninput: e => { a.Command = e.target.value; updatePreview(); } }, a.Command || ""),
                hint("Passed to /bin/sh -c.")
            ));
        } else if (a.Command) {
            // A command that matched its preset but doesn't match what the
            // preset writes today came in through a legacyTemplate — the
            // vendor renamed the binary or the verb. Derived rather than
            // remembered, so editing a field clears it without extra state.
            const current = activeVerb ? assembleMdmCommand(activeVerb, a._fields || {}) : a.Command;
            rows.push(row("Command",
                h("div", { class: "command-preview" }, a.Command),
                ...(current !== a.Command ? [
                    h("div", { class: "source-filter-note" },
                        h("span", null, `Superseded — ${activeMdm.label} now uses `),
                        h("code", null, current),
                        h("button", {
                            onclick: () => {
                                a.Command = current;
                                reopenStep(); updatePreview();
                            }
                        }, "Update it"))
                ] : [])
            ));
        }

        const runAsChecked = !!(a.RunAsUser);
        rows.push(row("Run as user",
            h("div", { style: "display:flex;flex-direction:column;gap:6px" },
                h("label", { style: "display:flex;align-items:center;gap:7px;cursor:pointer" },
                    h("input", { type: "checkbox", checked: runAsChecked,
                        onchange: e => {
                            a.RunAsUser = e.target.checked ? "$CONSOLE_USER" : "";
                            reopenStep();
                        }
                    }),
                    h("span", { style: "font-size:12.5px" }, "Run as a different user")
                ),
                ...(runAsChecked ? [textInput(a.RunAsUser, v => { a.RunAsUser = v; }, "$CONSOLE_USER")] : [])
            ),
            hint("Default: runs as root (the script user). Check to run as the console user or a named account.")
        ));
        rows.push(row("Timeout (s)", intInput(a.TimeoutSeconds, v => a.TimeoutSeconds = v, "300")));
        return rows;
    }
    if (a.Type === "package") {
        return [
            row("Path",   textInput(a.Path, v => a.Path = v, "/Library/Enrollinator/packages/GoogleChrome.pkg")),
            row("Target", textInput(a.Target, v => a.Target = v, "/")),
            row("Timeout (s)", intInput(a.TimeoutSeconds, v => a.TimeoutSeconds = v, "600"))
        ];
    }
    if (a.Type === "wait") {
        return [
            row("Duration (s)",
                intInput(a.DurationSeconds, v => a.DurationSeconds = v, "10"),
                hint("Sleeps for this long, then succeeds. Good for letting a LaunchDaemon settle."))
        ];
    }
    if (a.Type === "dialog") {
        // Buttons editor — up to 3 pipe-delimited labels.
        const buttonsWrap = h("div", { style: "display:flex;flex-direction:column;gap:4px" });
        const buttons = Array.isArray(a.Buttons) ? a.Buttons : [];
        buttons.forEach((label, i) => {
            buttonsWrap.appendChild(h("div",
                { style: "display:flex;gap:6px;align-items:center" },
                h("input", { type: "text", value: label,
                    placeholder: `Button ${i + 1}`,
                    style: "flex:1",
                    oninput: e => {
                        buttons[i] = e.target.value;
                        if (!buttons.includes(a.ExpectedButton)) {
                            a.ExpectedButton = buttons[0] || "";
                        }
                        updatePreview();
                    } }),
                btn("↑", () => { move(buttons, i, -1); reopenStep(); }, "icon"),
                btn("↓", () => { move(buttons, i,  1); reopenStep(); }, "icon"),
                btn("✕", () => {
                    buttons.splice(i, 1);
                    if (!buttons.includes(a.ExpectedButton)) {
                        a.ExpectedButton = buttons[0] || "";
                    }
                    reopenStep(); updatePreview();
                }, "danger")
            ));
        });
        if (buttons.length < 3) {
            buttonsWrap.appendChild(btn("+ Add button", () => {
                buttons.push("");
                if (!a.Buttons) a.Buttons = buttons;
                reopenStep();
            }));
        }
        return [
            row("Title",   textInput(a.Title, v => a.Title = v, "Acceptable use policy")),
            row("Message",
                h("textarea", {
                    oninput: e => { a.Message = e.target.value; updatePreview(); },
                    placeholder: "Markdown body"
                }, a.Message || "")),
            row("Font sizes",
                h("div", { style: "display:flex;gap:8px;align-items:center" },
                    h("span", { style: "font-size:11px;color:var(--text-4);white-space:nowrap" }, "Title"),
                    h("input", { type: "number", min: "0", style: "width:58px",
                        value: a.TitleFontSize == null ? "" : String(a.TitleFontSize), placeholder: "default",
                        oninput: e => { const v = parseInt(e.target.value, 10); a.TitleFontSize = Number.isFinite(v) ? v : null; updatePreview(); } }),
                    h("span", { style: "font-size:11px;color:var(--text-4);white-space:nowrap;margin-left:4px" }, "Body"),
                    h("input", { type: "number", min: "0", style: "width:58px",
                        value: a.MessageFontSize == null ? "" : String(a.MessageFontSize), placeholder: "default",
                        oninput: e => { const v = parseInt(e.target.value, 10); a.MessageFontSize = Number.isFinite(v) ? v : null; updatePreview(); } })
                )
            ),
            row("Size",
                h("div", { style: "display:flex;gap:8px;align-items:center" },
                    h("span", { style: "font-size:11px;color:var(--text-4);white-space:nowrap" }, "W"),
                    h("input", { type: "number", min: "0", style: "width:62px",
                        value: a.Width == null ? "" : String(a.Width), placeholder: "520",
                        oninput: e => { const v = parseInt(e.target.value, 10); a.Width = Number.isFinite(v) ? v : null; updatePreview(); } }),
                    h("span", { style: "font-size:11px;color:var(--text-4);white-space:nowrap;margin-left:4px" }, "H"),
                    h("input", { type: "number", min: "0", style: "width:62px",
                        value: a.Height == null ? "" : String(a.Height), placeholder: "300",
                        oninput: e => { const v = parseInt(e.target.value, 10); a.Height = Number.isFinite(v) ? v : null; updatePreview(); } })
                )
            ),
            row("Buttons", buttonsWrap, hint("1–3 labels, left to right.")),
            ...(buttons.length > 0 ? [row("Expected",
                selectInput(a.ExpectedButton,
                    buttons,
                    v => { a.ExpectedButton = v; updatePreview(); }),
                hint("Step passes only if the user clicks this button."))] : []),
            ...(() => {
                if (!Array.isArray(a.Slideshow)) a.Slideshow = [];
                // Normalize any legacy plain-string entries in-place before rendering
                a.Slideshow = a.Slideshow.map(normalizeSlide);

                // Derive or restore media mode (transient — ignored by serializer)
                if (!a._mediaMode) {
                    a._mediaMode = a.Video ? "video" : (a.Slideshow.length > 0 ? "slideshow" : "off");
                }
                const mode = a._mediaMode;

                function switchDlgMode(val) {
                    if      (val === "off")       { a.Video = ""; a.Slideshow = []; }
                    else if (val === "slideshow") { a.Video = ""; }
                    else if (val === "video")     { a.Slideshow = []; }
                    a._mediaMode = val;
                    updatePreview(); reopenStep();
                }

                // Segmented media picker
                const mediaModes = [["off", "None"], ["slideshow", "Slideshow"], ["video", "Video"]];
                const mediaPicker = h("div", { style: "display:inline-flex;border-radius:7px;overflow:hidden;border:1px solid var(--border)" },
                    ...mediaModes.map(([val, label], idx) =>
                        h("button", {
                            class: "btn" + (mode === val ? " btn--active" : ""),
                            style: "border-radius:0;border:none;" + (idx < mediaModes.length - 1 ? "border-right:1px solid var(--border);" : ""),
                            onclick: () => switchDlgMode(val)
                        }, label)
                    )
                );

                // Slideshow frame editor
                const slidesWrap = h("div", { style: "display:flex;flex-direction:column;gap:8px;margin-top:8px" });
                if (a.Slideshow.length === 0)
                    slidesWrap.appendChild(hint("No frames. Add one for a still image; 2+ for a user-clicked slideshow."));
                a.Slideshow.forEach((slide, i) => {
                    slidesWrap.appendChild(h("div", {
                        style: "display:flex;flex-direction:column;gap:6px;padding:10px 10px 8px;background:var(--hover-fill);border-radius:7px;border:1px solid var(--hairline)"
                    },
                        h("div", { style: "display:flex;align-items:center;gap:6px;margin-bottom:2px" },
                            h("span", { style: "font-size:10px;font-weight:700;text-transform:uppercase;color:var(--text-faint);letter-spacing:0.08em;flex:1" },
                                `Frame ${i + 1}`),
                            btn("↑", () => { move(a.Slideshow, i, -1); reopenStep(); }, "icon"),
                            btn("↓", () => { move(a.Slideshow, i,  1); reopenStep(); }, "icon"),
                            btn("✕", () => { a.Slideshow.splice(i, 1); reopenStep(); updatePreview(); }, "danger")
                        ),
                        row("Image", h("input", { type: "text", value: slide.Image || "",
                            placeholder: "/path/img.png or https://…", style: "flex:1",
                            oninput: e => { slide.Image = e.target.value; updatePreview(); } })),
                        row("Title", h("input", { type: "text", value: slide.Title || "",
                            placeholder: "Overrides dialog title for this frame (optional)",
                            oninput: e => { slide.Title = e.target.value; } })),
                        row("Message", h("textarea", {
                            placeholder: "Overrides message for this frame (Markdown, optional)",
                            oninput: e => { slide.Message = e.target.value; }
                        }, slide.Message || ""))
                    ));
                });
                slidesWrap.appendChild(btn("+ Add frame", () => {
                    a.Slideshow.push({ Image: "", Title: "", Message: "" }); reopenStep();
                }));

                // Video URL + autoplay
                const dlgVideoInput = h("input", { type: "text", value: a.Video || "",
                    placeholder: "/path/video.mp4, https://… or YouTube URL", style: "flex:1",
                    oninput: e => { a.Video = e.target.value; updatePreview(); } });
                const dlgAutoplayBtn = h("button", {
                    class: "btn" + (a.VideoAutoplay === true ? " btn--active" : ""),
                    style: "white-space:nowrap;flex-shrink:0",
                    onclick: () => { a.VideoAutoplay = a.VideoAutoplay === true ? null : true; updatePreview(); reopenStep(); }
                }, "▶ Autoplay");
                const dlgVideoSection = h("div", { style: "display:flex;gap:6px;align-items:center;margin-top:8px" },
                    dlgVideoInput, dlgAutoplayBtn
                );

                return [row("Media", h("div", null,
                    mediaPicker,
                    ...(mode === "slideshow" ? [slidesWrap]      : []),
                    ...(mode === "video"     ? [dlgVideoSection] : [])
                ))];
            })(),
            h("div", { class: "pair-row" },
                row("Blur screen",   triStateSelect(a.Blur,        v => { a.Blur        = v; updatePreview(); })),
                row("Always on top", triStateSelect(a.AlwaysOnTop, v => { a.AlwaysOnTop = v; updatePreview(); }))
            )
        ];
    }
    return [];
}

// ============================================================================
// Misc helpers + preview + download
// ============================================================================

function move(arr, i, dir) {
    const j = i + dir;
    if (j < 0 || j >= arr.length) return;
    [arr[i], arr[j]] = [arr[j], arr[i]];
    updatePreview();
}

// ============================================================================
// Visual preview — a schematic of the windows this config produces at run time
//
// Drawn from the same `state` the XML is serialized from, so it is always in
// step with the pane below it. It is a schematic, not a mock-up: anything the
// browser cannot honestly draw — an image path that only exists on the
// enrolled Mac, a video, an SF Symbol from a font we don't have — is drawn as
// a labelled placeholder instead of being faked. What it does show accurately
// is the part that is hard to hold in your head while editing XML: how big
// each window is against the screen, which window opens on top of which,
// which screens appear and in what order, step order, how each step's status
// text changes as the run advances, whether the screen is blurred, and which
// buttons exist.
//
// Every default in here is read off the runtime (lib/ui.sh and the
// show_welcome_screen / ui_addon_picker paths in enrollinator.sh), not off the
// schema docs — when the two disagree, what ships is what the Mac will show.
// ============================================================================

// The mock display, in points. Windows are drawn against it at true relative
// size, which is the whole reason a 900×700 window looks alarming here.
const VIS_SCREEN_PT = [1280, 800];
// Body text size in points, used to derive the font size of a drawn window
// from the same points-to-pixels factor the window itself is drawn at.
const VIS_TEXT_PT = 17;

// Stand-in values for {token} substitution and the hardware info panel. Fixed
// rather than random so the preview doesn't flicker on every keystroke.
const VIS_TOKENS = {
    console_user:  "astevens",
    full_name:     "Alex Stevens",
    hostname:      "marketing-mbp",
    computer_name: "Marketing MBP",
    serial_number: "C02XK1ZQJGH5",
    model:         "MacBookPro18,4",
    model_name:    "MacBook Pro",
    os_version:    "15.3.1",
    ip_address:    "10.4.22.187",
    uuid:          "3A1F9C42-6E7B-4D18-9C55-B0E2A7F41D63"
};

// Labels the runtime uses in the info box (hw_info_label in enrollinator.sh).
const VIS_HW_LABELS = {
    console_user: "User", full_name: "Name", hostname: "Hostname",
    computer_name: "Computer", serial_number: "Serial", model: "Model ID",
    model_name: "Model", os_version: "macOS", ip_address: "IP", uuid: "UUID"
};

// Window sizes the runtime falls back to when the config leaves them unset.
const VIS_SIZES = {
    main:    [720, 560],
    welcome: [600, 450],
    picker:  [520, 300],
    wait:    [520, 420],
    dialog:  [520, 300],
    addon:   [500, 360]
};

// The dock. Five apps, drawn as tiles — enough to read as a Mac desktop
// behind the window, which is the only job it has.
const VIS_DOCK_APPS = [
    { name: "Finder",          glyph: "☺", from: "#7fb4ff", to: "#2a6fd6", running: true },
    { name: "Safari",          glyph: "✦", from: "#8fd8ff", to: "#1f7fd0" },
    { name: "Mail",            glyph: "✉", from: "#6fc6ff", to: "#2a7fe0" },
    { name: "Messages",        glyph: "◍", from: "#7de88a", to: "#1f9e3d" },
    { name: "System Settings", glyph: "⚙", from: "#c9c9d2", to: "#6e6e78" }
];

// A state that came from Load sample or an older import can be missing whole
// sub-dicts (the sample has no WelcomeScreen.PlaybookPicker, for one), so every
// branch the schematic reads goes through one of these.
const visWS = () => state.WelcomeScreen || {};
const visPP = () => visWS().PlaybookPicker || {};
const visAP = () => state.AddonPicker || {};

function visExpand(s) {
    return String(s == null ? "" : s)
        .replace(/\{([a-z_]+)\}/g, (m, k) => (k in VIS_TOKENS ? VIS_TOKENS[k] : m));
}

/** Inline markdown → HTML, for the message bodies swiftDialog renders as
 *  markdown. Escapes first, so a config that contains angle brackets shows
 *  them rather than injecting markup. Links keep their text but lose their
 *  href — a schematic window should not be clickable. */
function visInlineMd(s) {
    return xmlEscape(s)
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\[([^\]]*)\]\(([^)\s]+)\)/g, (m, text, url) => `<a>${text || url}</a>`)
        .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
        .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<i>$2</i>");
}

/** Markdown body → nodes. Handles the subset that turns up in these configs:
 *  paragraphs, `- ` bullets, `#` headings, and the inline marks above. */
function visRichText(text) {
    const src = visExpand(text || "").replace(/\r\n/g, "\n");
    if (!src.trim()) return [];
    const out = [];
    let list = null;
    for (const rawLine of src.split("\n")) {
        const line = rawLine.trim();
        if (/^[-*]\s+/.test(line)) {
            if (!list) { list = h("ul"); out.push(list); }
            list.appendChild(h("li", { html: visInlineMd(line.replace(/^[-*]\s+/, "")) }));
            continue;
        }
        list = null;
        if (!line) continue;
        const heading = line.match(/^#{1,6}\s+(.*)$/);
        const p = h("p", { html: visInlineMd(heading ? heading[1] : line) });
        if (heading) p.style.fontWeight = "600";
        out.push(p);
    }
    return out;
}

/** Placeholder tile for a logo / icon. `value` is a path, an https URL, an
 *  SF Symbol token, or empty (the runtime's own `SF=sparkles` fallback). */
function visIcon(value, opts) {
    const o = opts || {};
    const v = String(value || "").trim();
    let glyph = "✦", label = "sparkles";
    if (!v) {
        if (o.hidden) return null;
    } else if (/^SF=/i.test(v)) {
        glyph = "◈";
        label = parseSFValue(v).name || "symbol";
    } else if (/^https?:\/\//i.test(v)) {
        glyph = "▤";
        label = v.replace(/[?#].*$/, "").split("/").filter(Boolean).pop() || "image";
    } else {
        glyph = "▤";
        label = v.split("/").filter(Boolean).pop() || "image";
    }
    return h("div", { class: "vis-icon" + (o.small ? " small" : ""), title: v || "SF=sparkles (default)" },
        h("div", { class: "vis-icon-glyph" }, glyph),
        o.small ? null : h("div", { class: "vis-icon-label" }, label)
    );
}

/** Dashed box standing in for media we deliberately don't draw. */
function visMedia(kind, detail, extraClass) {
    return h("div", { class: "vis-media" + (extraClass ? " " + extraClass : "") },
        h("b", null, kind),
        detail ? h("div", null, detail) : null
    );
}

/** A window's slideshow frames, normalised. Entries may be bare strings (the
 *  schema's array-of-paths form) or dicts with per-frame text; both turn up in
 *  real configs and the builder itself writes the dict form. A window with a
 *  Video has no slides — Video wins over Slideshow at run time. */
function visSlides(cfg) {
    if (!cfg || cfg.Video) return [];
    return (cfg.Slideshow || [])
        .map(s => (typeof s === "string" ? { Image: s } : (s || {})))
        .filter(s => s.Image || s.Title || s.Message);
}

/** How many windows the user actually clicks through for this config: one per
 *  slide, or one plain window when there's no slideshow. */
function visFrameCount(cfg) {
    return Math.max(1, visSlides(cfg).length);
}

/** The body area of a window, showing the one frame this position is on. */
function visMediaSlot(cfg, idx) {
    const slot = h("div", { class: "vis-checks" });
    if (cfg.Video) {
        slot.appendChild(visMedia("video", cfg.Video + (cfg.VideoAutoplay ? " · autoplay" : "")));
        return slot;
    }
    const slides = visSlides(cfg);
    if (!slides.length) return slot;
    const i = Math.max(0, Math.min(idx == null ? slides.length - 1 : idx, slides.length - 1));
    slot.appendChild(visMedia(
        slides.length > 1 ? `image · frame ${i + 1} of ${slides.length}` : "image",
        slides[i].Image || ""));
    return slot;
}

/** Per-frame text overrides. A frame's own Title / Message replace the
 *  window's for as long as that frame is up (ui_wait_open and ui_dialog_popup
 *  both carry the last frame's text into the window that follows the slides). */
function visSlideText(cfg, idx, title, message) {
    const slide = visSlides(cfg)[idx];
    if (!slide) return { title, message };
    return { title: slide.Title || title, message: slide.Message || message };
}

/** Font sizes inside a window are `em` against the window's own font size, so
 *  they scale with it. 9.5px was the hand-tuned base these were drawn at. */
function visEm(px) { return (Math.round((px / 9.5) * 100) / 100) + "em"; }

function visFontSize(configured, fallback, factor, min, max) {
    const pt = Number.isFinite(configured) && configured > 0 ? configured : fallback;
    return visEm(Math.max(min, Math.min(max, pt * factor)));
}

function visTitleStyle(size, color) {
    const pt = Number.isFinite(size) && size > 0 ? size : 26;
    return `font-size:${visEm(Math.max(11, Math.min(20, pt * 0.5)))}` + (color ? `;color:${color}` : "");
}

/** The window frame: title bar, optional badge, and a content column. Its
 *  point size rides along in the dataset for visLayout() to size it with. */
function visWindowShell(w, h_, opts) {
    const o = opts || {};
    const win = h("div", { class: "vis-win" });
    win.dataset.w = w;
    win.dataset.h = h_;
    win.appendChild(h("div", { class: "vis-titlebar" },
        h("span", { class: "vis-dot r" }), h("span", { class: "vis-dot y" }), h("span", { class: "vis-dot g" }),
        o.badge ? h("span", { class: "vis-badge" }, o.badge) : null
    ));
    return win;
}

/** Effective window size for a screen: configured value or runtime default. */
function visSize(kind, width, height) {
    const [dw, dh] = VIS_SIZES[kind];
    return [
        Number.isFinite(width)  && width  > 0 ? width  : dw,
        Number.isFinite(height) && height > 0 ? height : dh
    ];
}

/** Title + message header block, shared by every window. */
function visHead(icon, title, titleStyle, messageNodes, msgSize, trailing) {
    return h("div", { class: "vis-head" },
        icon,
        h("div", { class: "vis-headtext" },
            h("div", { class: "vis-title", style: titleStyle }, visExpand(title)),
            messageNodes.length
                ? h("div", { class: "vis-msg", style: `font-size:${msgSize}` }, ...messageNodes)
                : null
        ),
        trailing || null
    );
}

// ---------------------------------------------------------------- windows

function visStepName(step, idx) {
    return step.Name || step.Id || `Step ${idx + 1}`;
}

/** Main run window: the swiftDialog list window, at the given step position.
 *  `pos` runs 0…steps.length, where the last value is the finished state. */
function visMainWindow(playbook, pos) {
    const b = state.Branding;
    const steps = playbook ? playbook.Steps : [];
    const total = steps.length;
    const done = Math.min(pos, total);
    const finished = done >= total;
    const current = finished ? null : steps[done];
    const testMode = state.TestMode || (playbook && playbook.TestMode);

    const [w, hgt] = visSize("main", b.WindowWidth, b.WindowHeight);
    const win = visWindowShell(w, hgt, { badge: testMode ? "test mode" : null });
    const msgSize = visFontSize(b.MessageFontSize, 14, 0.62, 8.5, 14);

    // The banner replaces the plain header when Branding.Banner is set.
    if (b.Banner) win.appendChild(visMedia("banner image", b.Banner, "banner"));

    // Subtitle is the live banner line: a blocking step with a UserPrompt and
    // no WaitWindow overwrites it while waiting, and the end of the run
    // replaces it again (enrollinator.sh, ui_set_banner).
    let message = b.Subtitle;
    if (finished) message = state.AllowClose ? "All done. You can close this window." : "All done.";
    else if (current && current.Blocking && current.UserPrompt && !current.WaitWindow)
        message = current.UserPrompt;

    const content = h("div", { class: "vis-content" });
    const helpEnabled = state.Help && state.Help.Enabled;
    content.appendChild(h("div", { class: "vis-head" },
        h("div", { class: "vis-headtext" },
            h("div", { class: "vis-title", style: visTitleStyle(b.TitleFontSize, b.AccentColor) },
                visExpand(b.Title || "Enrollinator")),
            h("div", { class: "vis-msg", style: `font-size:${msgSize}` }, ...visRichText(message))
        ),
        helpEnabled ? h("div", { class: "vis-help", title: "Help button" }, "?") : null
    ));

    // Step list, with the icon and hardware info panel stacked to its left —
    // swiftDialog draws --infobox underneath the window icon, not beside the list.
    const list = h("div", { class: "vis-list" });
    if (!total) {
        list.appendChild(h("div", { class: "vis-empty" }, "This playbook has no steps yet."));
    } else {
        steps.forEach((s, i) => {
            let cls = "", text = "Pending", glyph = "○";
            if (i < done)        { cls = "done"; text = testMode ? "TEST MODE: skipped" : "Done"; glyph = "✓"; }
            else if (i === done) {
                if (s.Blocking)  { cls = "wait"; text = "Waiting…"; glyph = "◐"; }
                else             { cls = "run";  text = "Running…"; glyph = "●"; }
            }
            const named = !!(s.Name || s.Id);
            list.appendChild(h("div", { class: "vis-step" + (i === done ? " current" : "") },
                visIcon(s.Icon, { small: true, hidden: true }),
                h("span", { class: "vis-step-name" + (named ? "" : " unnamed") }, visStepName(s, i)),
                h("span", { class: "vis-step-status " + cls }, glyph + " " + text)
            ));
        });
    }

    const side = h("div", { class: "vis-sidecol" }, visIcon(b.Logo));
    const hw = state.HardwareInfo || {};
    if (hw.Enabled && (hw.Fields || []).length) {
        const box = h("div", { class: "vis-infobox" });
        hw.Fields.forEach(f => {
            box.appendChild(h("div", null,
                h("span", { class: "k" }, (VIS_HW_LABELS[f] || f) + ": "),
                VIS_TOKENS[f] || "—"
            ));
        });
        side.appendChild(box);
    }
    content.appendChild(h("div", { class: "vis-cols" },
        side,
        h("div", { class: "vis-maincol" }, list)
    ));

    const pct = total ? Math.round((done * 100) / total) : 100;
    content.appendChild(h("div", { class: "vis-foot" },
        h("div", { class: "vis-bar" }, h("i", { style: `width:${finished ? 100 : pct}%` })),
        h("div", { class: "vis-footrow" },
            h("span", { class: "vis-progresstext" },
                finished ? "Finished" : total ? `Step ${done + 1} of ${total}` : "Getting ready…"),
            h("span", { class: "vis-btn" + (finished && state.AllowClose ? " primary" : " disabled") }, "Done")
        )
    ));

    win.appendChild(content);
    return win;
}

/** The welcome dialog. When it carries a slideshow this is its LAST frame —
 *  the earlier ones are drawn by visSlideWindow() — so the last slide's text
 *  overrides the dialog's, and a Back button appears beside the real ones. */
function visWelcomeWindow() {
    const wsc = visWS();
    const b = state.Branding;
    const slides = visSlides(wsc);
    const last = slides.length - 1;
    const text = visSlideText(wsc, last, wsc.Title || b.Title || "Welcome", wsc.Message);
    const [w, hgt] = visSize("welcome", wsc.Width, wsc.Height);
    const win = visWindowShell(w, hgt);
    const content = h("div", { class: "vis-content" });

    content.appendChild(visHead(
        visIcon(wsc.Logo || b.Logo),
        text.title,
        visTitleStyle(wsc.TitleFontSize, b.AccentColor),
        visRichText(text.message),
        visFontSize(wsc.MessageFontSize, 14, 0.62, 8.5, 14)
    ));
    content.appendChild(visMediaSlot(wsc, last));

    const buttons = h("div", { class: "vis-footrow" }, h("span", { class: "vis-progresstext" }));
    // swiftDialog gives Back the button2 slot, which the defer button owns when
    // one is configured — so a deferrable welcome screen has no way back.
    if (wsc.DeferButton) buttons.appendChild(h("span", { class: "vis-btn" }, wsc.DeferButton));
    else if (slides.length > 1) buttons.appendChild(h("span", { class: "vis-btn" }, "\u2190 Back"));
    buttons.appendChild(h("span", { class: "vis-btn primary" }, wsc.Button || "Get Started"));
    content.appendChild(h("div", { class: "vis-foot" }, buttons));

    win.appendChild(content);
    return win;
}

/** One of the instruction slides a slideshow shows before its window: no icon,
 *  the frame's own text, its image, and Next / Back to click through them.
 *  `kind` picks the window size defaults; `cfg` is the welcome screen, wait
 *  window or dialog action the slideshow belongs to. */
function visSlideWindow(cfg, kind, idx, fallbackTitle, fallbackMessage) {
    const slides = visSlides(cfg);
    const total = slides.length;
    const text = visSlideText(cfg, idx, fallbackTitle, fallbackMessage);
    const [w, hgt] = visSize(kind, cfg.Width, cfg.Height);
    const win = visWindowShell(w, hgt);
    const content = h("div", { class: "vis-content" });

    content.appendChild(visHead(
        null,                       // slides are drawn with --hideicon
        text.title,
        visTitleStyle(cfg.TitleFontSize, state.Branding.AccentColor),
        visRichText(text.message),
        visFontSize(cfg.MessageFontSize, 14, 0.62, 8.5, 14)
    ));
    content.appendChild(visMediaSlot(cfg, idx));

    const row = h("div", { class: "vis-footrow" }, h("span", { class: "vis-progresstext" }));
    if (idx > 0) row.appendChild(h("span", { class: "vis-btn" }, "\u2190 Back"));
    row.appendChild(h("span", { class: "vis-btn primary" }, `Next \u2192  (${idx + 1} of ${total})`));
    content.appendChild(h("div", { class: "vis-foot" }, row));

    win.appendChild(content);
    return win;
}

function visPickerWindow() {
    const pp = visPP();
    const [w, hgt] = visSize("picker", pp.Width, pp.Height);
    const win = visWindowShell(w, hgt);
    const content = h("div", { class: "vis-content" });

    // Blank entries are dropped by the runtime, so drop them here too.
    const names = (pp.Playbooks || []).map(n => String(n || "").trim()).filter(Boolean);

    content.appendChild(visHead(
        pp.HideIcon ? null : visIcon(pp.Icon, { hidden: !pp.Icon }),
        pp.Title || "Choose your setup",
        visTitleStyle(null, state.Branding.AccentColor),
        visRichText(pp.Message || "Select the configuration that applies to you."),
        "1em"
    ));

    content.appendChild(h("div", { class: "vis-checks" },
        h("div", null,
            h("div", { class: "vis-select-label" }, "Playbook"),
            h("div", { class: "vis-select" },
                h("span", null, names[0] || "— no playbooks listed —"),
                h("span", { class: "caret" }, "▼"))
        )
    ));

    content.appendChild(h("div", { class: "vis-foot" },
        h("div", { class: "vis-footrow" },
            h("span", { class: "vis-progresstext" }),
            h("span", { class: "vis-btn primary" }, "Continue"))
    ));

    win.appendChild(content);
    return win;
}

function visAddonWindow() {
    const ap = visAP();
    const addons = state.Playbooks.filter(p => p.Addon);
    const [w, hgt] = visSize("addon", ap.Width, ap.Height);
    const win = visWindowShell(w, hgt);
    const content = h("div", { class: "vis-content" });

    content.appendChild(visHead(
        visIcon(ap.Icon || state.Branding.Logo),
        ap.Title || "Optional Add-ons",
        visTitleStyle(ap.TitleFontSize, state.Branding.AccentColor),
        visRichText(ap.Message || "Select additional profiles to install."),
        visFontSize(ap.MessageFontSize, 14, 0.62, 8.5, 14)
    ));

    const checks = h("div", { class: "vis-checks" });
    addons.forEach((p, i) => {
        checks.appendChild(h("div", { class: "vis-check" },
            h("span", { class: "box" }),
            h("span", null,
                h("div", null, p.Name || `Add-on ${i + 1}`),
                p.Description ? h("div", { class: "vis-check-desc" }, p.Description) : null)
        ));
    });
    content.appendChild(checks);

    content.appendChild(h("div", { class: "vis-foot" },
        h("div", { class: "vis-footrow" },
            h("span", { class: "vis-progresstext" }),
            h("span", { class: "vis-btn" }, ap.SkipButton || "Skip"),
            h("span", { class: "vis-btn primary" }, ap.InstallButton || "Install"))
    ));

    win.appendChild(content);
    return win;
}

/** The window a blocking step leaves up while it polls — the last frame of its
 *  slideshow, when it has one. */
function visWaitWindow(step) {
    const ww = step.WaitWindow;
    const slides = visSlides(ww);
    const last = slides.length - 1;
    const text = visSlideText(ww, last,
        ww.Title || step.Name || "Waiting", ww.Message || step.UserPrompt);
    const [w, hgt] = visSize("wait", ww.Width, ww.Height);
    const win = visWindowShell(w, hgt);
    const content = h("div", { class: "vis-content" });

    content.appendChild(visHead(
        null,
        text.title,
        visTitleStyle(ww.TitleFontSize, state.Branding.AccentColor),
        visRichText(text.message),
        visFontSize(ww.MessageFontSize, 14, 0.62, 8.5, 14)
    ));
    content.appendChild(visMediaSlot(ww, last));

    const row = h("div", { class: "vis-footrow" },
        h("span", { class: "vis-progresstext" }, "Watching for your action…"));
    if (slides.length > 1) row.appendChild(h("span", { class: "vis-btn" }, "\u2190 Back"));
    row.appendChild(h("span", { class: "vis-btn disabled" }, "Waiting\u2026"));
    content.appendChild(h("div", { class: "vis-foot" },
        h("div", { class: "vis-bar" }, h("i", { style: "width:35%" })),
        row
    ));

    win.appendChild(content);
    return win;
}

/** The modal a `dialog` action pops before the step's conditions run — the last
 *  frame of its slideshow, when it has one. */
function visDialogWindow(action) {
    const slides = visSlides(action);
    const last = slides.length - 1;
    const text = visSlideText(action, last, action.Title || "Dialog", action.Message);
    const [w, hgt] = visSize("dialog", action.Width, action.Height);
    const win = visWindowShell(w, hgt);
    const content = h("div", { class: "vis-content" });

    content.appendChild(visHead(
        null,
        text.title,
        visTitleStyle(action.TitleFontSize, state.Branding.AccentColor),
        visRichText(text.message),
        visFontSize(action.MessageFontSize, 14, 0.62, 8.5, 14)
    ));
    content.appendChild(visMediaSlot(action, last));

    const buttons = (action.Buttons || []).filter(Boolean);
    const expected = action.ExpectedButton || buttons[0];
    const row = h("div", { class: "vis-footrow" }, h("span", { class: "vis-progresstext" }));
    // swiftDialog draws button1 on the right, so later buttons sit to its left.
    // Back takes the button2 slot, and only when the config left it free.
    const drawn = buttons.slice();
    if (slides.length > 1 && drawn.length < 2) drawn.push("\u2190 Back");
    drawn.reverse().forEach(label => {
        row.appendChild(h("span", { class: "vis-btn" + (label === expected ? " primary" : "") }, label));
    });
    content.appendChild(h("div", { class: "vis-foot" }, row));

    win.appendChild(content);
    return win;
}

// ------------------------------------------------------------- the flow

/** The whole run as a flat list of frames, in the order the user meets them:
 *  welcome → playbook picker → every step → finished → add-on picker. The
 *  stepper walks this, so you can go from the first screen to the last without
 *  ever touching the screen dropdown. */
function visFlow(playbook) {
    const frames = [];

    /** Push one frame per slide: the run makes the user click through them,
     *  so the preview does too. The last slide IS the window itself — that's
     *  how ui_wait_open and ui_dialog_popup hand off — so only the frames
     *  before it are marked `slide`. */
    const pushSlides = (cfg, base, name) => {
        const total = visFrameCount(cfg);
        for (let i = 0; i < total - 1; i++) {
            frames.push(Object.assign({}, base, {
                slide: i, slides: total,
                label: `${name} \u00b7 slide ${i + 1}/${total}`
            }));
        }
        frames.push(Object.assign({}, base, {
            slides: total,
            label: total > 1 ? `${name} \u00b7 slide ${total}/${total}` : name
        }));
    };

    if (visWS().Enabled) {
        pushSlides(visWS(), { screen: "welcome" }, "Welcome screen");
        if (visPP().Enabled) frames.push({ screen: "picker", label: "Playbook picker" });
    }

    const steps = playbook ? playbook.Steps : [];
    steps.forEach((s, i) => {
        const name = `Step ${i + 1} of ${steps.length} · ${visStepName(s, i)}`;
        const base = { screen: "main", step: i };
        let any = false;
        // Runtime order within a step: the action runs first, then the step
        // blocks on its conditions with the wait window up.
        if (s.Action && s.Action.Type === "dialog") {
            pushSlides(s.Action, Object.assign({ kind: "dialog" }, base), `${name} \u00b7 dialog`);
            any = true;
        }
        if (s.Blocking && s.WaitWindow) {
            pushSlides(s.WaitWindow, Object.assign({ kind: "wait" }, base), `${name} \u00b7 waiting`);
            any = true;
        }
        if (!any) frames.push(Object.assign({ label: name }, base));
    });

    frames.push({ screen: "main", step: steps.length, label: "Run complete" });
    if (state.Playbooks.some(p => p.Addon))
        frames.push({ screen: "addons", label: "Add-on picker" });
    return frames;
}

/** Screens present in the flow, for the jump-to dropdown. */
function visScreens(frames) {
    const seen = new Set();
    const out = [];
    frames.forEach((f, i) => {
        if (seen.has(f.screen)) return;
        seen.add(f.screen);
        out.push({
            id: f.screen, at: i,
            label: { welcome: "Welcome screen", picker: "Playbook picker",
                     main: "Main window", addons: "Add-on picker" }[f.screen]
        });
    });
    return out.map((s, i) => Object.assign(s, { label: `${i + 1} · ${s.label}` }));
}

/** The playbook the preview is showing. `ui.vis.playbook` is null while the
 *  preview is following the editor's own selection, and an index once the
 *  user has pinned one from the dropdown. */
function visPlaybookIndex() {
    if (!state.Playbooks.length) return -1;
    const pinned = ui.vis.playbook;
    if (pinned != null && pinned >= 0 && pinned < state.Playbooks.length) return pinned;
    return Math.min(ui.selectedPlaybook, state.Playbooks.length - 1);
}

/** Is the screen blurred behind this frame? Per-window Blur overrides the
 *  global BlurScreen; null means inherit. */
function visBlurred(frame, step, topKind) {
    const global = !!state.BlurScreen;
    const pick = v => (v == null ? global : !!v);
    if (frame.screen === "welcome") return pick(visWS().Blur);
    if (topKind === "wait")   return pick(step.WaitWindow.Blur);
    if (topKind === "dialog") return pick(step.Action.Blur);
    return global;
}

/** One line of plain English about how the current step behaves — the bits
 *  the drawing itself can't show (branching, polling, conditions). */
function visStepNotes(step, steps) {
    const notes = [];
    if (step.Action && step.Action.Type && step.Action.Type !== "noop")
        notes.push(`action: ${step.Action.Type}`);
    const conds = (step.Conditions || []).length;
    if (conds) notes.push(`${conds} condition${conds > 1 ? "s" : ""}`);
    if (step.Blocking)
        notes.push(`blocks, polling every ${step.PollIntervalSeconds || 5}s`);
    if (step.ContinueOnFailure) notes.push("continues on failure");
    const target = id => id === "$end" ? "the end" : id === "$next" ? "the next step"
        : (() => {
            const i = steps.findIndex(s => s.Id === id);
            return i < 0 ? `“${id}” (no such step)` : `step ${i + 1}`;
        })();
    if (step.OnSuccess) notes.push(`on success → ${target(step.OnSuccess)}`);
    if (step.OnFailure) notes.push(`on failure → ${target(step.OnFailure)}`);
    return notes;
}

// ------------------------------------------------------------- the pane

function visDock() {
    const dock = h("div", { class: "vis-dock" });
    VIS_DOCK_APPS.forEach(app => {
        dock.appendChild(h("div", { class: "vis-dock-slot" },
            h("div", { class: "vis-dock-app", title: app.name,
                style: `background:linear-gradient(160deg, ${app.from}, ${app.to})` }, app.glyph),
            app.running ? h("span", { class: "vis-dock-run" }) : null
        ));
    });
    return dock;
}

/** Size everything on the mock screen. Kept apart from the drawing so it can
 *  also run on a resize, where nothing about the config has changed — only how
 *  much room there is to draw it in. */
function visLayout() {
    const screen = document.querySelector("#vis-stage .vis-screen");
    if (!screen) return;
    const r = localRect(screen);
    if (!r.width || !r.height) return;   // not laid out yet; the observer retries

    const scale = Math.min(r.width / VIS_SCREEN_PT[0], r.height / VIS_SCREEN_PT[1]);

    screen.querySelectorAll(".vis-win").forEach(win => {
        const pw = Number(win.dataset.w), ph = Number(win.dataset.h);
        win.style.width  = Math.max(90, Math.round(pw * scale)) + "px";
        win.style.height = Math.max(64, Math.round(ph * scale)) + "px";
        // Text rides the same points-to-pixels factor as the window, with a
        // floor so a cramped pane stays readable rather than becoming a smudge.
        win.style.fontSize = Math.max(6, Math.min(13, VIS_TEXT_PT * scale)).toFixed(2) + "px";
    });

    const dock = screen.querySelector(".vis-dock");
    if (dock) {
        const icon = Math.max(9, Math.min(34, Math.round(56 * scale)));
        dock.style.gap = Math.round(icon * 0.16) + "px";
        dock.style.padding = Math.round(icon * 0.13) + "px " + Math.round(icon * 0.16) + "px";
        dock.style.borderRadius = Math.round(icon * 0.32) + "px";
        dock.querySelectorAll(".vis-dock-app").forEach(el => {
            el.style.width = icon + "px";
            el.style.height = icon + "px";
            el.style.fontSize = Math.round(icon * 0.5) + "px";
        });
    }
}

/** Place a window on the mock screen. `role` is "solo" for a window with
 *  nothing under it, "behind" for one another window has opened on top of,
 *  and "front" for that top window — offset down and right so both stay
 *  readable. A solo window sits centred, the way swiftDialog's
 *  `--position center` puts it. */
function visPlace(win, role) {
    const front = role === "front";
    win.style.left = front ? "56%" : "50%";
    win.style.top  = front ? "55%" : "47%";
    win.style.transform = "translate(-50%, -50%)";
    win.style.zIndex = role === "behind" ? "1" : "2";
    win.classList.toggle("behind", role === "behind");
}

function renderVisualPreview() {
    const stage    = document.getElementById("vis-stage");
    const controls = document.getElementById("vis-controls");
    const nav      = document.getElementById("vis-nav");
    const sizeEl   = document.getElementById("vis-size");
    if (!stage) return;

    // Clamp the position against a config that may have changed underneath it.
    if (ui.vis.playbook != null && ui.vis.playbook >= state.Playbooks.length) ui.vis.playbook = null;
    const pIdx     = visPlaybookIndex();
    const playbook = pIdx < 0 ? null : state.Playbooks[pIdx];
    const steps    = playbook ? playbook.Steps : [];
    const frames   = visFlow(playbook);
    ui.vis.pos = Math.max(0, Math.min(ui.vis.pos, frames.length - 1));
    const frame  = frames[ui.vis.pos];
    const screens = visScreens(frames);

    // ---- controls
    controls.textContent = "";
    controls.appendChild(h("select", {
        title: "Jump to a screen",
        onchange: e => { ui.vis.pos = Number(e.target.value); renderVisualPreview(); }
    }, ...screens.map(s => {
        const opt = h("option", { value: String(s.at) }, s.label);
        if (s.id === frame.screen) opt.selected = true;
        return opt;
    })));

    const pbSelect = h("select", {
        class: "vis-control-grow",
        title: "Which playbook the run window is working through",
        disabled: !state.Playbooks.length,
        onchange: e => {
            ui.vis.playbook = Number(e.target.value);
            // Land on the new playbook's first step rather than an index that
            // meant something else in the playbook we just left.
            const first = visFlow(state.Playbooks[ui.vis.playbook])
                .findIndex(f => f.screen === "main");
            ui.vis.pos = first < 0 ? 0 : first;
            renderVisualPreview();
        }
    }, ...state.Playbooks.map((p, i) => {
        const opt = h("option", { value: String(i) },
            (p.Name || `Playbook ${i + 1}`) + (p.Addon ? "  (add-on)" : ""));
        if (i === pIdx) opt.selected = true;
        return opt;
    }));
    if (!state.Playbooks.length) pbSelect.appendChild(h("option", null, "No playbooks"));
    controls.appendChild(pbSelect);

    // ---- the mock screen
    stage.textContent = "";
    if (!playbook && frame.screen === "main") {
        stage.appendChild(h("div", { class: "vis-empty" }, "Add a playbook to see the window."));
        sizeEl.textContent = "";
        nav.textContent = "";
        return;
    }

    const layer = h("div", { class: "vis-winlayer" });
    const captions = [];
    const step = frame.screen === "main" && frame.step < steps.length ? steps[frame.step] : null;
    let topKind = null, topSize = null;

    if (frame.screen === "welcome") {
        // Mid-slideshow frames are instruction slides; the last one is the
        // welcome dialog itself.
        const win = frame.slide == null
            ? visWelcomeWindow()
            : visSlideWindow(visWS(), "welcome", frame.slide,
                             visWS().Title || state.Branding.Title || "Welcome", visWS().Message);
        visPlace(win, "solo");
        layer.appendChild(win);
        topSize = visSize("welcome", visWS().Width, visWS().Height);
        captions.push(frame.slide == null
            ? "Shown before the run window opens."
            : `Instruction slide — the user clicks Next through all ${frame.slides} before the buttons appear.`);
    } else if (frame.screen === "picker") {
        const win = visPickerWindow();
        visPlace(win, "solo");
        layer.appendChild(win);
        topSize = visSize("picker", visPP().Width, visPP().Height);
        captions.push("The playbook chosen here overrides DefaultPlaybook for that run.");
    } else if (frame.screen === "addons") {
        // The run window stays up behind the picker.
        const behind = visMainWindow(playbook, steps.length);
        visPlace(behind, "behind");
        layer.appendChild(behind);
        const win = visAddonWindow();
        visPlace(win, "front");
        layer.appendChild(win);
        topSize = visSize("addon", visAP().Width, visAP().Height);
        captions.push("Shown once the main playbook finishes. Steps already run are skipped.");
    } else {
        const main = visMainWindow(playbook, frame.step);
        layer.appendChild(main);
        topSize = visSize("main", state.Branding.WindowWidth, state.Branding.WindowHeight);

        // Which window this step has open right now comes off the frame: a
        // step with both a dialog action and a wait window gets a frame for
        // each, in the order the run opens them.
        if (step && frame.kind === "wait") {
            topKind = "wait";
            const ww = step.WaitWindow;
            const win = frame.slide == null
                ? visWaitWindow(step)
                : visSlideWindow(ww, "wait", frame.slide,
                                 ww.Title || step.Name || "Waiting", ww.Message || step.UserPrompt);
            visPlace(win, "front");
            visPlace(main, "behind");
            layer.appendChild(win);
            topSize = visSize("wait", ww.Width, ww.Height);
            captions.push(frame.slide == null
                ? "This window stays up, over the run window, until the step's conditions pass."
                : `Instruction slide ${frame.slide + 1} of ${frame.slides} — the user clicks Next to reach the waiting window.`);
        } else if (step && frame.kind === "dialog") {
            topKind = "dialog";
            const act = step.Action;
            const win = frame.slide == null
                ? visDialogWindow(act)
                : visSlideWindow(act, "dialog", frame.slide, act.Title || "Dialog", act.Message);
            visPlace(win, "front");
            visPlace(main, "behind");
            layer.appendChild(win);
            topSize = visSize("dialog", act.Width, act.Height);
            captions.push(frame.slide == null
                ? "The step's dialog action runs first — it must be answered with " +
                  `\u201c${act.ExpectedButton || (act.Buttons || [])[0] || "OK"}\u201d to pass.`
                : `Instruction slide ${frame.slide + 1} of ${frame.slides} — the user clicks Next to reach the dialog's own buttons.`);
        } else {
            visPlace(main, "solo");
        }
        if (step) {
            const notes = visStepNotes(step, steps);
            if (notes.length) captions.unshift(notes.join(" · "));
        }
    }

    const blurred = visBlurred(frame, step, topKind);
    const screen = h("div", { class: "vis-screen" + (blurred ? " blurred" : "") },
        h("div", { class: "vis-backdrop" },
            h("div", { class: "vis-wall" }),
            visDock()
        ),
        blurred ? h("div", { class: "vis-blur-note" }, "screen blurred") : null,
        layer
    );
    stage.appendChild(screen);
    if (captions.length) {
        stage.appendChild(h("div", { class: "vis-captions" },
            ...captions.map(text => h("div", { class: "vis-caption" }, text))));
    }
    sizeEl.textContent = `${topSize[0]} × ${topSize[1]}`;
    visLayout();

    // ---- flow navigation
    nav.textContent = "";
    const jump = (delta, enabled) => h("button", {
        disabled: !enabled,
        title: delta < 0 ? "Previous screen" : "Next screen",
        onclick: () => { ui.vis.pos += delta; renderVisualPreview(); }
    }, delta < 0 ? "‹" : "›");
    nav.appendChild(jump(-1, ui.vis.pos > 0));
    nav.appendChild(h("span", { class: "vis-nav-label" }, h("b", null, frame.label)));
    nav.appendChild(h("span", { class: "vis-nav-count" }, `${ui.vis.pos + 1}/${frames.length}`));
    nav.appendChild(jump(1, ui.vis.pos < frames.length - 1));
}

function updatePreview() {
    const el = document.getElementById("preview");
    const status = document.getElementById("preview-status");
    try {
        const xml = serializeMobileconfig(state);
        el.textContent = xml;
        const doc = new DOMParser().parseFromString(xml, "application/xml");
        if (doc.querySelector("parsererror")) throw new Error("XML parse error");
        status.textContent = "valid";
        status.classList.remove("error");
    } catch (e) {
        el.textContent = `Serialization error: ${e.message}`;
        status.textContent = "error";
        status.classList.add("error");
    }
    // Isolated: the XML pane is the load-bearing one, and a half-drawn
    // schematic must never be what stops you from exporting a valid profile.
    try {
        renderVisualPreview();
    } catch (e) {
        const stage = document.getElementById("vis-stage");
        if (stage) {
            stage.textContent = "";
            stage.appendChild(h("div", { class: "vis-empty" },
                "Couldn't draw this config: " + e.message));
        }
    }
}

function triggerDownload(xml, fname, mime) {
    const blob = new Blob([xml], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = fname;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
}

function downloadMobileconfig() {
    const base = state.outer.PayloadIdentifier || "enrollinator";
    triggerDownload(serializeMobileconfig(state), base + ".mobileconfig",
                    "application/x-apple-aspen-config");
}

function downloadBareXml() {
    const base = state.outer.PayloadIdentifier || "enrollinator";
    triggerDownload(serializeBareXml(state), base + ".plist", "application/xml");
}

// ---------------------------------------------------------------- upstream
// Fetching the runtime straight from the repo saves a trip to GitHub when
// you're standing up a new deployment: profile, script, package and daemon
// all come from the one menu.
const ENROLLINATOR_REPO = "iamalexepstein/Enrollinator-macOS";
const ENROLLINATOR_RELEASES = `https://github.com/${ENROLLINATOR_REPO}/releases/latest`;

/** Path inside the repo, read at a specific ref. Always a release tag here —
 *  never `main`, which runs ahead of the newest tag between releases. */
function enrollinatorRawUrl(ref, path) {
    return `https://raw.githubusercontent.com/${ENROLLINATOR_REPO}/${ref}/${path}`;
}

/** The newest release, fetched once per session and shared by every item in
 *  the menu, so the script, package and daemon are guaranteed to come from
 *  the same tag rather than a mix of tag and branch head. A failure is not
 *  cached: the usual cause is GitHub's unauthenticated rate limit (60/hr per
 *  IP), and one rate-limited click shouldn't poison the menu afterwards. */
let latestReleasePromise = null;
function fetchLatestRelease() {
    if (!latestReleasePromise) {
        latestReleasePromise = fetch(`https://api.github.com/repos/${ENROLLINATOR_REPO}/releases/latest`)
            .then(res => {
                if (!res.ok) throw new Error("HTTP " + res.status);
                return res.json();
            })
            .catch(err => { latestReleasePromise = null; throw err; });
    }
    return latestReleasePromise;
}

/** Fetch a remote file and save it under `filename`.
 *  Falls back to opening the URL when fetch is blocked (offline, CORS, a
 *  proxy in the way) so the click always does something useful. */
async function downloadRemote(url, filename) {
    try {
        const res = await fetch(url);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const blob = await res.blob();
        const objUrl = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = objUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(objUrl), 1000);
    } catch (e) {
        window.open(url, "_blank", "noopener");
    }
}

/** Download an asset from the newest release, matched by pattern — release
 *  filenames carry a version, so they can't be hard-coded. `repoPath` is the
 *  same file's path inside the repo, used when a release doesn't publish it
 *  as an asset; it is still read at that release's tag.
 *
 *  When the API itself is unreachable we open the releases page instead of
 *  quietly substituting a file from `main`. Those are not the same artifact —
 *  main can be many commits ahead of the newest tag — and a download labelled
 *  "from the newest release" handing over unreleased code is the kind of
 *  difference nobody notices until it misbehaves on a machine being enrolled. */
async function downloadLatestReleaseAsset(pattern, repoPath) {
    let release;
    try {
        release = await fetchLatestRelease();
    } catch (e) {
        window.open(ENROLLINATOR_RELEASES, "_blank", "noopener");
        return;
    }
    const asset = (release.assets || []).find(a => pattern.test(a.name));
    if (asset) {
        await downloadRemote(asset.browser_download_url, asset.name);
    } else if (repoPath && release.tag_name) {
        await downloadRemote(enrollinatorRawUrl(release.tag_name, repoPath),
                             repoPath.split("/").pop());
    } else {
        window.open(ENROLLINATOR_RELEASES, "_blank", "noopener");
    }
}

/** Download a file that ships in the repo rather than as a release asset,
 *  pinned to the newest release's tag so it matches the script and package
 *  downloaded alongside it. */
async function downloadReleaseFile(repoPath) {
    try {
        const release = await fetchLatestRelease();
        if (!release.tag_name) throw new Error("release has no tag");
        await downloadRemote(enrollinatorRawUrl(release.tag_name, repoPath),
                             repoPath.split("/").pop());
    } catch (e) {
        window.open(ENROLLINATOR_RELEASES, "_blank", "noopener");
    }
}

function toggleDownloadMenu(btn) {
    const existing = document.getElementById("download-menu");
    if (existing) { existing.remove(); return; }

    const rect = localRect(btn);
    const menu = document.createElement("div");
    menu.id = "download-menu";
    menu.className = "header-dropdown-menu";
    menu.style.cssText = `top:${rect.bottom + 4}px;right:${localViewport().width - rect.right}px`;

    const sections = [
        {
            title: "Your configuration",
            items: [
                { label: "Download .mobileconfig", hint: "Deploy via MDM", action: downloadMobileconfig },
                { label: "Download as .plist (--xml)", hint: "Use with enrollinator.sh --xml", action: downloadBareXml }
            ]
        },
        {
            title: "Enrollinator",
            items: [
                { label: "Latest script", hint: "enrollinator.sh from the newest release",
                  action: () => downloadLatestReleaseAsset(/^enrollinator\.sh$/i, "enrollinator.sh") },
                { label: "Latest package", hint: "Installer .pkg from the newest release",
                  action: () => downloadLatestReleaseAsset(/\.pkg$/i) },
                { label: "Latest daemon", hint: "LaunchDaemon plist from the same release",
                  action: () => downloadReleaseFile("launchd/com.enrollinator.app.plist") }
            ]
        }
    ];

    sections.forEach((section, i) => {
        if (i > 0) {
            const spacer = document.createElement("div");
            spacer.className = "ddm-spacer";
            menu.appendChild(spacer);
        }
        const title = document.createElement("div");
        title.className = "ddm-section-title";
        title.textContent = section.title;
        menu.appendChild(title);

        section.items.forEach(item => {
            const el = document.createElement("button");
            el.className = "header-dropdown-item";
            el.innerHTML = `<span class="ddi-label">${item.label}</span><span class="ddi-hint">${item.hint}</span>`;
            el.addEventListener("click", () => { menu.remove(); item.action(); });
            menu.appendChild(el);
        });
    });

    document.body.appendChild(menu);
    // Close on outside click
    setTimeout(() => document.addEventListener("click", function close(e) {
        if (!menu.contains(e.target) && e.target !== btn) { menu.remove(); }
        document.removeEventListener("click", close);
    }), 0);
}

    adoptFleetFromState(state);
    resetUiForNewState();
    renderCanvas(); updatePreview();
}

// Reset all per-state transient UI — call whenever state is fully replaced.
function resetUiForNewState() {
    ui.openStep          = null;
    ui.draftStep         = null;
    ui.stepTab           = "info";
    ui.pendingStep       = null;
    ui.expandedOptional  = new Set();
    ui.expandedBranches  = new Set();
    ui.selectedPlaybook  = 0;
    // A pinned playbook and step position belong to the config that was open,
    // not to the one just loaded.
    ui.vis               = { playbook: null, pos: 0 };
    // Leave settingsOpen, settingsTab, sidebarCollapsed — those are user
    // window-layout preferences, not content-specific state.
}

// ============================================================================
// Tooltips — position:fixed so overflow:hidden ancestors can never clip them.
// ============================================================================

function initTooltips() {
    const tip = document.createElement("div");
    tip.className = "js-tooltip";
    document.body.appendChild(tip);

    let hideTimer = null;

    function show(target) {
        const text = target.dataset.tooltip;
        if (!text) return;
        clearTimeout(hideTimer);
        tip.textContent = text;
        tip.style.opacity = "0";
        tip.style.display = "block";

        const below = target.hasAttribute("data-tooltip-below");
        const r = localRect(target);
        const tw = tip.offsetWidth;
        const th = tip.offsetHeight;
        let left = r.left + r.width / 2 - tw / 2;
        let top  = below ? r.bottom + 7 : r.top - th - 7;

        // Keep within viewport horizontally.
        left = Math.max(6, Math.min(left, localViewport().width - tw - 6));
        tip.style.left = left + "px";
        tip.style.top  = top  + "px";
        tip.style.opacity = "1";
    }

    function hide() {
        tip.style.opacity = "0";
        hideTimer = setTimeout(() => { tip.style.display = "none"; }, 130);
    }

    document.addEventListener("mouseover", e => {
        const t = e.target.closest("[data-tooltip]");
        if (t) show(t); else hide();
    });
    document.addEventListener("mouseout", e => {
        if (!e.target.closest("[data-tooltip]")) return;
        // Only hide when leaving the element entirely (not entering a child).
        if (!e.relatedTarget || !e.relatedTarget.closest("[data-tooltip]")) hide();
    });
    document.addEventListener("scroll", hide, true);
}

document.getElementById("import-file").addEventListener("change", async e => {
    const f = e.target.files[0];
    if (!f) return;
    try {
        const xml = await f.text();
        state = importFromMobileconfig(xml);
        // An imported config already says which MDM it was written for — read
        // it out of the commands rather than asking a question we can answer.
        adoptFleetFromState(state);
        resetUiForNewState();
        renderCanvas(); updatePreview(); reopenSettings();
    } catch (err) {
        alert(`Import failed: ${err.message}`);
    }
    e.target.value = "";
});
